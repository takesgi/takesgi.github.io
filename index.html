<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="無人航空機の飛行の安全に関する教則 第5版に準拠した、二等無人航空機操縦士 学科試験の対策アプリ。420問の問題演習、本番形式の模擬試験、苦手復習、暗記カード、教則ダイジェストを収録。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15242f" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学科試験">
<style>@supports(padding:env(safe-area-inset-top)){.topbar{padding-top:calc(9px + env(safe-area-inset-top))}@media(min-width:920px){.tabbar{padding-top:calc(70px + env(safe-area-inset-top))}}}#installBtn{border-color:var(--blue);color:var(--blue);background:var(--blue-wash)}</style>
<title>二等無人航空機操縦士学科試験</title>
<style>
/* ============ tokens ============ */
:root{
  --paper:#eef5f9; --panel:#ffffff; --panel2:#f3f9fc; --sink:#e2eef4;
  --ink:#0b1a24; --ink2:#2f4657; --muted:#6c8698;
  --rule:#c8dae4; --rule2:#e1ecf2; --grid:rgba(16,90,130,.055);
  --blue:#0d7fb8; --blue-ink:#ffffff; --blue-wash:#dceffa;
  --mag:#d6246b; --mag-wash:#fde2ec;
  --ok:#0f9066; --ok-wash:#dbf5ea; --ng:#d43c2e; --ng-wash:#fde5e1;
  --warn:#c08c06; --warn-wash:#fbf0d3;
  --c2:#e2860b; --c2w:#fdf0d8; --c3:#d6246b; --c3w:#fde2ec;
  --c4:#0d8fc7; --c4w:#dbeffb; --c5:#6a4ad6; --c5w:#e9e3fc;
  --c6:#0d9a74; --c6w:#d8f5ec;
  --r:12px; --rm:20px; --rl:28px; --rp:999px;
  --fd:"UA Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --fb:"UA Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --fm:"UA Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b1721; --panel:#15242f; --panel2:#1d303d; --sink:#112029;
  --ink:#e9f3f8; --ink2:#bad0dc; --muted:#849cad;
  --rule:#2a4051; --rule2:#203444; --grid:rgba(120,190,230,.06);
  --blue:#4bb8ea; --blue-ink:#04212e; --blue-wash:#123244;
  --mag:#ff80b1; --mag-wash:#36212d;
  --ok:#3fd0a0; --ok-wash:#0e3128; --ng:#f48a7c; --ng-wash:#321e1b;
  --warn:#e7c05d; --warn-wash:#2e2619;
  --c2:#f9ba4b; --c2w:#352a11; --c3:#ff80b1; --c3w:#37222d;
  --c4:#4fc3ed; --c4w:#123342; --c5:#ab96f9; --c5w:#272242;
  --c6:#40d7ab; --c6w:#0e332b;
}}
:root[data-theme="dark"]{
  --paper:#0b1721; --panel:#15242f; --panel2:#1d303d; --sink:#112029;
  --ink:#e9f3f8; --ink2:#bad0dc; --muted:#849cad;
  --rule:#2a4051; --rule2:#203444; --grid:rgba(120,190,230,.06);
  --blue:#4bb8ea; --blue-ink:#04212e; --blue-wash:#123244;
  --mag:#ff80b1; --mag-wash:#36212d;
  --ok:#3fd0a0; --ok-wash:#0e3128; --ng:#f48a7c; --ng-wash:#321e1b;
  --warn:#e7c05d; --warn-wash:#2e2619;
  --c2:#f9ba4b; --c2w:#352a11; --c3:#ff80b1; --c3w:#37222d;
  --c4:#4fc3ed; --c4w:#123342; --c5:#ab96f9; --c5w:#272242;
  --c6:#40d7ab; --c6w:#0e332b;
}

*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.8;
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:30px 30px;background-position:-1px -1px;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--fd);text-wrap:balance;margin:0;letter-spacing:.005em}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ shell ============ */
#shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:9px 16px 8px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;
  background:linear-gradient(90deg,var(--c2) 0 20%,var(--c3) 20% 40%,var(--c4) 40% 60%,var(--c5) 60% 80%,var(--c6) 80% 100%)}
.mark{width:26px;height:26px;flex:none;color:var(--blue)}
.brandtxt{min-width:0}
.brandtxt b{display:block;font-family:var(--fd);font-weight:900;font-size:clamp(13px,3.6vw,17px);
  line-height:1.3;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
.brandtxt span{display:block;font-family:var(--fm);font-weight:400;font-size:9.5px;letter-spacing:.16em;color:var(--muted);line-height:1.4}
.spacer{flex:1}
.hud{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-align:right;line-height:1.35;display:none}
.hud b{display:block;font-size:15px;font-weight:700;color:var(--blue);letter-spacing:.02em}
@media(min-width:460px){.hud{display:block}}
.iconbtn{background:var(--panel2);border:1px solid var(--rule);border-radius:var(--rp);width:33px;height:33px;
  display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--blue);border-color:var(--blue)}
main{flex:1;width:100%;max-width:800px;margin:0 auto;padding:22px 16px 116px}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--panel);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--fm);font-size:9.5px;font-weight:500;letter-spacing:.04em;color:var(--muted);
  border-top:2px solid transparent;margin-top:-1px}
.tabbar button svg{width:20px;height:20px}
.tabbar button[aria-current="true"]{color:var(--blue);border-top-color:var(--blue);background:var(--blue-wash)}
@media(min-width:920px){
  .tabbar{top:0;bottom:auto;right:auto;width:98px;height:100vh;border-top:0;border-right:1px solid var(--rule);
    grid-template-columns:1fr;grid-auto-rows:max-content;align-content:start;padding-top:70px}
  .tabbar button{padding:13px 4px;font-size:10px;border-top:0;border-left:2px solid transparent}
  .tabbar button[aria-current="true"]{border-top-color:transparent;border-left-color:var(--blue)}
  #shell{padding-left:98px}
  main{padding-bottom:52px}
}

/* ============ primitives ============ */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--rl);padding:16px}
.lg{display:flex;align-items:center;gap:9px;font-family:var(--fm);font-size:10px;font-weight:700;
  letter-spacing:.2em;color:var(--mag);margin-bottom:11px}
.lg::before{content:"";width:7px;height:7px;flex:none;background:currentColor}
.lg::after{content:"";flex:1;height:1px;background:var(--rule2)}
.lg.b{color:var(--blue)} .lg.g{color:var(--c6)} .lg.v{color:var(--c5)} .lg.o{color:var(--c2)}
h2.page{font-size:22px;font-weight:900;line-height:1.5;margin:0 0 4px}
.sub{color:var(--muted);font-size:12.5px;line-height:1.75}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--rule);background:var(--panel);border-radius:var(--rp);padding:9px 17px;
  font-family:var(--fm);font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.1);color:var(--blue-ink)}
.btn.wide{width:100%;padding:13px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:not(:disabled):active{transform:translateY(1px)}
.panel,.navrow,.set,.cd,.verdict,.opt,.fcface{transition:border-color .16s ease}

.seg{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;border-left:1px solid var(--rule2);background:none;padding:8px 10px;white-space:nowrap;
  font-family:var(--fm);font-size:11.5px;letter-spacing:.05em;color:var(--muted)}
.seg button:first-of-type{border-left:0;border-radius:var(--rp) 0 0 var(--rp)}
.seg button[aria-pressed="true"]{background:var(--sw,var(--blue-wash));color:var(--sc,var(--blue));font-weight:700;
  box-shadow:inset 0 -3px 0 var(--sc,var(--blue))}
.seg .cap{font-family:var(--fm);font-size:10px;letter-spacing:.12em;color:var(--muted);padding:8px 11px;
  background:var(--panel2);border-right:1px solid var(--rule);white-space:nowrap;align-self:stretch;display:flex;align-items:center}
.segscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ============ gauge ============ */
.gauge{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
@media(max-width:400px){.gauge{grid-template-columns:114px 1fr;gap:12px}}
.gauge svg{width:100%;height:auto;display:block}
.gauge .arcv{transition:stroke-dasharray .6s cubic-bezier(.3,.85,.3,1)}

/* ============ readout ============ */
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.readout div{padding:12px 8px;text-align:center;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--rw);border-top:3px solid var(--rc)}
.readout b{display:block;font-family:var(--fm);font-size:22px;font-weight:700;line-height:1.15;color:var(--rc)}
.readout span{font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--muted)}

/* ============ activity ============ */
.act{display:flex;gap:3px;margin-top:4px}
.act s{flex:1;height:22px;border-radius:var(--rp);background:var(--sink);border:1px solid var(--rule2);text-decoration:none}
.act s.on{background:var(--c6);border-color:var(--c6)}
.act s.tdy{outline:2px solid var(--mag);outline-offset:1px}
.actlab{display:flex;justify-content:space-between;font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--muted);margin-top:6px}

/* ============ chapter rows ============ */
.chrow{display:grid;grid-template-columns:30px 1fr 44px;gap:11px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule2);padding:11px 0}
.chrow:last-child{border-bottom:0}
.chrow .idx{font-family:var(--fm);font-size:11px;font-weight:700;color:var(--cc);background:var(--cw);
  border:1px solid var(--cc);border-radius:var(--rp);height:26px;display:grid;place-items:center}
.chrow .nm{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.chrow .nm em{font-style:normal;font-family:var(--fm);font-size:10.5px;color:var(--muted)}
.chrow .pct{font-family:var(--fm);font-size:13px;font-weight:700;text-align:right;color:var(--cc)}
.bar{height:8px;background:var(--sink);border:1px solid var(--rule2);position:relative;overflow:hidden;border-radius:var(--rp)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--cc,var(--blue));border-radius:var(--rp)}
button.chrow:hover .idx{background:var(--cc);color:var(--panel)}

.navrow{display:grid;grid-template-columns:38px 1fr 14px;gap:13px;align-items:center;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--rl);padding:13px 16px}
.navrow:hover{border-color:var(--cc)}
.navrow .idx{width:38px;height:38px;display:grid;place-items:center;background:var(--cw);
  color:var(--cc);border:1px solid var(--cc);border-radius:var(--rp)}
.navrow b{display:block;font-family:var(--fd);font-weight:700;font-size:14.5px;line-height:1.5}
.navrow .mt{font-family:var(--fm);font-size:10.5px;letter-spacing:.02em;color:var(--muted)}
.navrow .ar{color:var(--cc);font-family:var(--fm);font-size:13px}

/* ============ flight strip ============ */
.strip{display:flex;align-items:flex-end;gap:2px;height:16px;padding:3px 0;overflow:hidden}
.strip s{display:block;flex:1;min-width:2px;height:7px;background:var(--rule2);text-decoration:none;border-radius:var(--rp)}
.strip s.a{background:var(--blue)}
.strip s.o{background:var(--ok)}
.strip s.x{background:var(--ng)}
.strip s.cur{background:var(--mag);height:14px}

/* ============ quiz ============ */
.qtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.qtop .n{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.04em}
.tmr{font-family:var(--fm);font-weight:700;font-size:14px;letter-spacing:.06em;padding:2px 9px;
  border:1px solid var(--rule);border-radius:var(--rp);background:var(--panel);color:var(--ink)}
.tmr.hot{background:var(--ng-wash);border-color:var(--ng);color:var(--ng)}
.qsec{display:inline-flex;align-items:center;gap:7px;font-family:var(--fm);font-size:10px;letter-spacing:.1em;
  color:var(--cc);background:var(--cw);border:1px solid var(--cc);border-radius:var(--rp);padding:4px 12px;margin:18px 0 10px}
.qtext{font-family:var(--fd);font-weight:700;font-size:17.5px;line-height:1.78;margin:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--rm);padding:13px 15px;
  font-size:14.5px;line-height:1.75}
.opt .k{font-family:var(--fm);font-weight:700;font-size:12px;width:28px;height:28px;border-radius:var(--rp);
  display:grid;place-items:center;background:var(--panel2);border:1px solid var(--rule);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:hover:not(:disabled) .k{border-color:var(--blue);color:var(--blue);background:var(--blue-wash)}
.opt.sel{border-color:var(--blue);background:var(--blue-wash)}
.opt.sel .k{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-wash)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ng-wash)}
.opt.ng .k{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.expl{margin-top:16px;border:1px solid var(--rule);border-top-width:3px;border-radius:var(--rm);
  background:var(--panel);padding:13px 15px}
.expl.right{border-top-color:var(--ok);background:var(--ok-wash)}
.expl.wrong{border-top-color:var(--ng);background:var(--ng-wash)}
.expl .v{font-family:var(--fm);font-weight:700;font-size:11px;letter-spacing:.16em;margin-bottom:7px;
  display:flex;align-items:center;gap:10px}
.expl.right .v{color:var(--ok)} .expl.wrong .v{color:var(--ng)}
.expl .v em{font-style:normal;color:var(--muted);font-weight:400;letter-spacing:.06em}
.expl p{margin:0;font-size:13.5px;line-height:1.85;color:var(--ink2)}
.qfoot{display:flex;gap:8px;margin-top:18px;align-items:stretch}
.bmk{border:1px solid var(--rule);background:var(--panel);border-radius:var(--rp);width:42px;
  display:grid;place-items:center;color:var(--muted);flex:none}
.bmk.on{color:var(--warn);border-color:var(--warn);background:var(--warn-wash)}

/* ============ result ============ */
.verdict{border:1px solid var(--rule);border-top:4px solid var(--blue);border-radius:var(--rl);
  background:var(--panel);padding:22px 18px;text-align:center}
.verdict.pass{border-top-color:var(--ok);background:var(--ok-wash)}
.verdict.fail{border-top-color:var(--ng);background:var(--ng-wash)}
.verdict .score{font-family:var(--fm);font-size:48px;font-weight:700;line-height:1;letter-spacing:-.03em}
.verdict.pass .score{color:var(--ok)} .verdict.fail .score{color:var(--ng)}
.verdict .score small{font-size:17px;color:var(--muted);letter-spacing:0}
.verdict .tag{font-family:var(--fm);font-weight:700;font-size:12px;letter-spacing:.22em;margin-top:12px}
.verdict.pass .tag{color:var(--ok)} .verdict.fail .tag{color:var(--ng)}
.scale{margin:18px 4px 0;position:relative;height:34px}
.scale .trk{position:absolute;top:0;left:0;right:0;height:12px;background:var(--sink);border:1px solid var(--rule2);border-radius:var(--rp)}
.scale .fil{position:absolute;top:0;left:0;height:12px;background:var(--blue);border-radius:var(--rp)}
.scale .fil.pass{background:var(--ok)} .scale .fil.fail{background:var(--ng)}
.scale .thr{position:absolute;top:-4px;width:2px;height:18px;background:var(--mag);border-radius:var(--rp)}
.scale .thrlab{position:absolute;top:19px;transform:translateX(-100%);padding-right:7px;font-family:var(--fm);font-size:9.5px;
  letter-spacing:.06em;color:var(--mag);white-space:nowrap}
.scale .ends{position:absolute;top:19px;left:0;right:0;display:flex;justify-content:space-between;
  font-family:var(--fm);font-size:9.5px;color:var(--muted)}

.revitem{display:grid;grid-template-columns:24px 1fr;gap:11px;width:100%;text-align:left;align-items:start;
  background:none;border:0;border-bottom:1px solid var(--rule2);padding:11px 0}
.revitem:last-child{border-bottom:0}
.revitem .mk{width:22px;height:22px;display:grid;place-items:center;border-radius:var(--rp);
  font-family:var(--fm);font-size:12px;font-weight:700;line-height:1}
.revitem .mk.ok{background:var(--ok);color:#fff} .revitem .mk.ng{background:var(--ng);color:#fff}
.revitem p{margin:0;font-size:13.5px;line-height:1.7}
.revitem em{font-style:normal;display:block;font-family:var(--fm);font-size:10px;letter-spacing:.03em;color:var(--cc);margin-top:3px}
.revitem:hover p{color:var(--blue)}

.hrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--rule2);font-size:13px}
.hrow:last-child{border-bottom:0}
.hrow .b{padding:3px 10px;border-radius:var(--rp);font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.1em;flex:none}
.b.pass{background:var(--ok);color:#fff} .b.fail{background:var(--ng-wash);color:var(--ng);border:1px solid var(--ng)}

/* ============ flashcards ============ */
.fcwrap{perspective:1500px}
.fc{position:relative;min-height:255px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.85,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fcface{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--panel);border-top:4px solid var(--cc);padding:28px 22px;
  display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.fcback{transform:rotateY(180deg);background:var(--cw)}
.fcface .q{font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.7}
.fcface .a{font-size:15px;line-height:1.9;color:var(--ink2)}
.fcface .hint{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.fcback .hint:first-child{color:var(--cc);font-weight:700}

/* ============ numeric input ============ */
.numq{border:1px solid var(--rule);border-top:4px solid var(--cc);border-radius:var(--r);background:var(--panel);padding:18px 18px 8px}
.numq .hint{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.numq .q{font-family:var(--fd);font-weight:700;font-size:17.5px;line-height:1.7;margin:8px 0 10px}
.numf{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:11px 0;border-top:1px solid var(--rule2);font-size:14px}
.numf .lb{flex-basis:100%;color:var(--ink2);font-size:13px}
.numin{font:inherit;font-family:var(--fm);font-size:20px;font-weight:700;width:5.5em;max-width:55%;text-align:right;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--panel2);color:var(--ink);padding:7px 12px}
.numin:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-wash)}
.numin:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.numf.ok .numin{border-color:var(--ok);background:var(--ok-wash);color:var(--ok)}
.numf.ng .numin{border-color:var(--ng);background:var(--ng-wash);color:var(--ng)}
.numf .u{font-weight:700;color:var(--ink2)}
.numf .ans{margin-left:auto;font-family:var(--fm);font-size:12px;font-weight:700}
.numf.ok .ans{color:var(--ok)} .numf.ng .ans{color:var(--ng)}

/* ============ textbook ============ */
.tsec{background:var(--panel);border:1px solid var(--rule);border-radius:var(--rl);overflow:hidden}
.tsec+.tsec{margin-top:-1px}
.tsec>summary{cursor:pointer;list-style:none;padding:13px 15px;font-family:var(--fd);font-weight:700;font-size:14px;
  display:flex;align-items:center;gap:10px}
.tsec>summary::before{content:"";width:4px;height:15px;flex:none;background:var(--cc);border-radius:1px}
.tsec>summary::-webkit-details-marker{display:none}
.tsec>summary::after{content:"+";margin-left:auto;font-family:var(--fm);color:var(--muted);font-size:14px}
.tsec[open]>summary::after{content:"−"}
.tsec[open]>summary{border-bottom:1px solid var(--rule2);color:var(--cc)}
.tbody{padding:6px 15px 18px;font-size:13.5px;line-height:1.95;color:var(--ink2)}
.tbody h4{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;color:var(--cc);margin:20px 0 6px;font-weight:700}
.tbody ul,.tbody ol{margin:8px 0;padding-left:1.3em}
.tbody li{margin:4px 0}
.tbody li::marker{color:var(--cc)}
.tbody b{color:var(--ink);font-weight:700}
.tbody p{margin:8px 0}
.tbody table{width:100%;border-collapse:collapse;font-size:12px;margin:11px 0;line-height:1.65}
.tbody th,.tbody td{border:1px solid var(--rule2);padding:7px 9px;text-align:left;vertical-align:top}
.tbody th{background:var(--cw);font-weight:700;color:var(--ink);font-family:var(--fm);font-size:10.5px;letter-spacing:.04em}
.tbl-scroll{overflow-x:auto}
.cal{background:var(--cw);border:1px solid var(--rule2);border-left:3px solid var(--cc);border-radius:var(--rm);
  padding:12px 14px;margin:13px 0;font-size:13px;line-height:1.85}
.cal.warn{background:var(--warn-wash);border-left-color:var(--warn)}
.steps{counter-reset:s;list-style:none;padding-left:0}
.steps li{position:relative;padding-left:30px;margin:11px 0}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;left:0;top:4px;
  font-family:var(--fm);font-size:10px;font-weight:700;color:var(--cc);letter-spacing:.04em}

.note{font-family:var(--fm);font-size:10px;line-height:1.9;letter-spacing:.02em;color:var(--muted);
  text-align:center;padding:20px 4px 0}
.chtitle{font-family:var(--fd);font-size:15px;font-weight:900;margin:20px 0 9px;display:flex;align-items:center;gap:9px}
.chtitle i{font-family:var(--fm);font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--panel);
  font-weight:700;background:var(--cc);padding:4px 10px;border-radius:var(--rp)}

/* ============ countdown ============ */
.cd{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;
  border:1px solid var(--rule);border-top:4px solid var(--c3);border-radius:var(--rl);
  background:var(--c3w);padding:15px 16px}
.cd .d{font-family:var(--fm);font-weight:700;font-size:40px;line-height:1;color:var(--c3);letter-spacing:-.03em}
.cd .d small{font-size:14px;letter-spacing:.08em;margin-left:3px}
.cd .t{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--c3);font-weight:700}
.cd .s{font-size:12.5px;color:var(--ink2);line-height:1.65}
.cd.today{--c3:var(--ok);border-top-color:var(--ok);background:var(--ok-wash)}
.cd.today .d,.cd.today .t{color:var(--ok)}

/* ============ settings ============ */
.set{border:1px solid var(--rule);border-radius:var(--rl);background:var(--panel);overflow:hidden}
.set .r{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid var(--rule2);flex-wrap:wrap}
.set .r:first-child{border-top:0}
.set .r .lb{flex:1;min-width:130px}
.set .r b{display:block;font-size:13.5px;font-weight:700;font-family:var(--fd)}
.set .r span.h{display:block;font-size:11.5px;color:var(--muted);line-height:1.6}
.set input[type=date],.set input[type=time]{font:inherit;font-family:var(--fm);font-size:13px;
  border:1px solid var(--rule);border-radius:var(--rp);background:var(--panel2);color:var(--ink);padding:7px 12px}
.sw{position:relative;width:46px;height:26px;border-radius:99px;border:1px solid var(--rule);
  background:var(--sink);flex:none;padding:0;transition:background .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.pill{font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.1em;padding:4px 11px;border-radius:var(--rp)}
.pill.on{background:var(--ok-wash);color:var(--ok);border:1px solid var(--ok)}
.pill.off{background:var(--sink);color:var(--muted);border:1px solid var(--rule)}
.pill.warn{background:var(--warn-wash);color:var(--warn);border:1px solid var(--warn)}
/* ============ phase3 parts ============ */
.d20{display:grid;grid-template-columns:auto 1fr 14px;gap:14px;align-items:center;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--c3);border-radius:var(--rl);padding:14px 16px;cursor:pointer}
.d20:disabled{opacity:.62;cursor:default}
.d20 .g{display:flex;align-items:baseline;justify-content:center;min-width:62px;height:52px;gap:1px;
  background:var(--c3w);border:1px solid var(--c3);border-radius:var(--rm);color:var(--c3);
  font-family:var(--fm);font-weight:700}
.d20 .g b{font-size:22px;line-height:52px}
.d20 .g i{font-style:normal;font-size:11px;line-height:52px;opacity:.8}
.d20 .tx b{display:block;font-family:var(--fd);font-weight:700;font-size:16px;line-height:1.5}
.d20 .tx .mt{font-family:var(--fm);font-size:10.5px;color:var(--muted)}
.d20 .ar{color:var(--c3);font-family:var(--fm);font-size:13px}

.rzrow{margin-top:14px;border-top:1px dashed var(--rule);padding-top:12px}
.rzrow .cap{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.rzset{display:flex;gap:7px;flex-wrap:wrap}
.rz{border:1px solid var(--rule);background:var(--panel2);border-radius:var(--rp);padding:6px 13px;
  font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.rz:hover{border-color:var(--cc);color:var(--cc)}
.rz.on{background:var(--cw);border-color:var(--cc);color:var(--cc);font-weight:700}

.tlink{display:inline-block;margin-top:13px;font-size:12.5px;font-weight:700;color:var(--blue);
  text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer}

.pacerow{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;background:var(--panel2);
  border:1px solid var(--rule2);border-radius:var(--rm);margin:6px 0 12px}
.pacerow .mono{font-size:11.5px;color:var(--ink2)}
.lgsm{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--muted);margin:14px 0 2px}

.rdy{margin-top:16px;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--rm);background:var(--panel2)}
.rdy.high{background:var(--ok-wash);border-color:var(--ok)}
.rdy.mid{background:var(--warn-wash);border-color:var(--warn)}
.rdy.low{background:var(--ng-wash);border-color:var(--ng)}
.rdy .sgs{display:flex;gap:5px;align-items:center}
.rdy .sg{width:9px;height:9px;border-radius:var(--rp);background:var(--rule);display:block}
.rdy .sg.on.low{background:var(--ng)}
.rdy .sg.on.mid{background:var(--warn)}
.rdy .sg.on.high{background:var(--ok)}

.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(6,20,30,.42);padding:0}
.sheet .box{width:100%;max-width:560px;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--rl) var(--rl) 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto;box-shadow:0 -8px 32px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 4px;font-family:var(--fd);font-size:17px}
.sheet .x{position:absolute;top:14px;right:16px}
@media(min-width:920px){ .sheet{align-items:center} .sheet .box{border-radius:var(--rl)} .sheet .x{position:static;margin-left:auto;display:block} }

@media print{
  body{background:#fff}
  .topbar,.tabbar,.hud,.iconbtn,.btn,.toast,.note,.lg,.sub{display:none !important}
  #view{padding:0 !important}
  .panel{border:0 !important;border-radius:0 !important;padding:0 !important}
  .misslist{column-count:2;column-gap:14px}
  .missitem{break-inside:avoid;border-bottom:1px solid #ccc;padding:7px 0}
}
.misslist{display:block}
.missitem{padding:11px 0;border-bottom:1px solid var(--rule2)}
.missitem:last-child{border-bottom:0}
.missitem p{margin:0;font-size:14px;line-height:1.7}
.missitem em{display:block;margin-top:5px;font-style:normal;font-family:var(--fm);font-size:10.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--paper);font-size:13px;padding:11px 18px;border-radius:var(--rp);
  box-shadow:0 6px 24px rgba(0,0,0,.28);max-width:88vw;text-align:center}
@media(min-width:920px){.toast{bottom:24px}}
</style>

</head>

<script>
const DATA = {"Q":[{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の操縦者の心得として、正しいものを1つ選びなさい。","c":["飛行の安全に関する責任は機体の製造者が負うため、操縦者は操作に専念すればよい","飛行開始から飛行終了までの全てについて操縦者が責任を問われる","レクリエーション目的の飛行であれば、業務目的より低い水準の準備で足りる"],"a":1,"e":"操縦者は運航・安全管理に責任を負い、飛行開始から終了までの全てについて責任を問われます。目的がレクリエーションでも業務でも、求められる準備の水準は同じです。","id":1},{"ch":2,"sec":"2.1 役割と責任","q":"技能証明を保有する者が複数いる状況で飛行させる場合の対応として、正しいものを1つ選びなさい。","c":["誰が操縦者となるかを飛行前に明確にしておく","その場の状況に応じて交代で操縦すればよく、事前の取決めは不要である","最も経験の長い者が自動的に操縦者となるため取決めは不要である"],"a":0,"e":"技能証明保有者が複数いるときは、誰が操縦者であるかを飛行前に明確化しておく必要があります。補助者を置く場合も役割と連絡手段を必ず確認します。","id":2},{"ch":2,"sec":"2.1 役割と責任","q":"航空機と無人航空機が交差または接近する場合の措置として、正しいものを1つ選びなさい。","c":["航空機側が無人航空機を視認して回避する","無人航空機側が回避する","互いに右へ旋回して回避する"],"a":1,"e":"航空機が進路権を有します。航空機側から無人航空機を視認して回避することは困難であり、無人航空機の方が一般に機動性が高いため、無人航空機側が回避します。","id":3},{"ch":2,"sec":"2.1 役割と責任","q":"事故を起こした操縦者が負う法的責任の組合せとして、正しいものを1つ選びなさい。","c":["刑事責任・民事責任・行政処分等","刑事責任・民事責任のみ","民事責任・行政処分等のみ"],"a":0,"e":"死傷者が発生すれば業務上過失致死傷等の刑事責任、被害者に対する民法上の損害賠償責任（民事責任）、さらに技能証明に関する行政処分等の対象になります。","id":4},{"ch":2,"sec":"2.1 役割と責任","q":"技能証明の効力の停止期間として、定められていないものを1つ選びなさい。","c":["3月","6月","9月"],"a":2,"e":"効力の停止は「1年・6月・3月」の3種類です。「9月」「2年」といった期間はひっかけの選択肢です。","id":5},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行計画の作成に関する記述として、正しいものを1つ選びなさい。","c":["自宅近所や何度も飛行した経験のある場所では飛行計画の作成を省略してよい","緊急着陸に適した場所や安全にホバリング・旋回できる場所も設定しておく","飛行計画はドローン情報基盤システムへ飛行後にまとめて入力すればよい"],"a":1,"e":"経験のある場所でも必ず計画を立てます。緊急着陸地点や安全にホバリング・旋回できる場所も設定します。飛行計画は事前通報が原則で、困難な場合に限り事後の通報が認められます。","id":6},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行予定地域及びその周辺の調査項目として、適切でないものを1つ選びなさい。","c":["日出・日没の時刻","離着陸場所の状況や障害物の位置","機体メーカーの販売店の所在地"],"a":2,"e":"調査すべきは、日出・日没の時刻、標高（海抜高度）・障害物・目標物、離着陸場所の状況、地上の歩行者や自動車の通行状況、有人航空機の飛行状況などです。","id":7},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行時の服装及び体調管理に関する記述として、正しいものを1つ選びなさい。","c":["動きやすく、頭部を含む素肌の露出が少なく、関係者と分かる服装が望ましい","操縦者は地上にいるため、保護具の使用を検討する必要はない","飲酒は飛行の直前でなければ、前夜であっても影響を考える必要はない"],"a":0,"e":"服装は動きやすく素肌（頭部を含む）の露出が少なく、関係者と分かるものとし、必要に応じてヘルメットや保護メガネを着用します。前夜の飲酒は翌日の操縦時まで影響が残る可能性があります。","id":8},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"特定飛行を行う際に携行すべき書類等として、正しいものを1つ選びなさい。","c":["機体の購入時の領収書と保証書","許可書・承認書、技能証明書、飛行日誌","機体メーカーの取扱説明書と会員証"],"a":1,"e":"特定飛行の際は、許可書・承認書（原本または写し）、技能証明書、飛行日誌を携行します。","id":9},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行中の注意事項として、正しいものを1つ選びなさい。","c":["天候が悪化しそうな場合でも、飛行計画の完了を優先して飛行を続ける","衝突防止装置を搭載していれば、周囲の監視は省略できる","天候の悪化が予想される場合は飛行途中でもただちに帰還または緊急着陸させる"],"a":2,"e":"周囲の監視が最大の安全対策であり、衝突防止装置を過信してはいけません。天候悪化のおそれがあれば飛行途中でもただちに帰還または緊急着陸させます。","id":10},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行後の対応として、適切でないものを1つ選びなさい。","c":["飛行後の点検・手入れを行い、機体とバッテリーを適切に保管する","飛行日誌の記載は、月末にまとめて行えばよい","特定飛行に該当しない飛行でも飛行日誌への記載が望ましい"],"a":1,"e":"飛行日誌（飛行記録・日常点検記録・点検整備記録）は遅滞なく記載します。特定飛行でなくても記載が望ましいとされています。","id":11},{"ch":2,"sec":"2.3 事故時の対応","q":"事故が発生した際に最初に行うべき対応として、正しいものを1つ選びなさい。","c":["負傷者の有無・程度を確認し、救護や通報を行う","飛行ログを保存し原因究明を開始する","国土交通大臣へ報告する"],"a":0,"e":"事故時は「人命最優先」が出発点です。負傷の有無と程度の確認・救護・通報を行い、その後に二次災害の防止、警察・消防等への通報、国土交通大臣への報告、記録の保存と続きます。","id":12},{"ch":2,"sec":"2.3 事故時の対応","q":"事故後の二次災害防止として適切なものを1つ選びなさい。","c":["機体が通電中であっても、まず機体を回収して安全な場所へ移動させる","通電中であれば電源を切り、回転中のプロペラに不用意に近付かない","プロペラが回転していても、素手ですぐに停止させる"],"a":1,"e":"二次災害防止として、通電中なら電源をOFFにし、回転中のプロペラには不用意に近付かないことが求められます。","id":13},{"ch":2,"sec":"2.3 事故時の対応","q":"無人航空機の保険に関する記述として、正しいものを1つ選びなさい。","c":["自動車と同様に自動車損害賠償責任保険に相当する強制保険がある","すべて任意保険であるが、一定の場合には第三者賠償責任保険への加入が求められる","無人航空機を対象とする保険商品は存在しない"],"a":1,"e":"無人航空機の保険に強制保険はなくすべて任意保険です。ただしカテゴリーⅡ飛行のうち総重量25kg以上の機体、またはレベル3.5飛行では、十分な補償が可能な第三者賠償責任保険への加入が求められます。","id":14},{"ch":2,"sec":"2.3 事故時の対応","q":"第三者賠償責任保険への加入が求められる場合として、正しいものを1つ選びなさい。","c":["カテゴリーⅠ飛行を行うすべての場合","レベル3.5飛行を行う場合","100g未満の模型航空機を飛行させる場合"],"a":1,"e":"レベル3.5飛行の要件の一つが、十分な補償が可能な第三者賠償責任保険への加入です。カテゴリーⅡ飛行で総重量25kg以上の機体を飛行させる場合にも求められます。","id":15},{"ch":3,"sec":"3.1 定義と登録","q":"航空法上の「無人航空機」に該当するための要件として、誤っているものを1つ選びなさい。","c":["構造上人が乗ることができないものであること","遠隔操作又は自動操縦により飛行させることができるものであること","本体のみの重量が100g以上であること"],"a":2,"e":"重量要件は「本体とバッテリーの合計が100g以上」です。バッテリー以外の着脱可能な付属品は含みません。100g未満のものは模型航空機に分類されます。","id":16},{"ch":3,"sec":"3.1 定義と登録","q":"航空法上の無人航空機に該当しないものを1つ選びなさい。","c":["最大離陸重量15kgのマルチローター","気球やロケット","本体とバッテリーの合計が120gの飛行機型の機体"],"a":1,"e":"紙飛行機、気球、ロケットは無人航空機に該当しません。無人航空機は飛行機・回転翼航空機・滑空機・飛行船であって構造上人が乗ることができないものです。","id":17},{"ch":3,"sec":"3.1 定義と登録","q":"100g未満の機体に関する記述として、正しいものを1つ選びなさい。","c":["小型無人機等飛行禁止法の規制は受けない","緊急用務空域では飛行が禁止される","高度150m以上の空域でも一切の規制を受けない"],"a":1,"e":"緊急用務空域は100g未満の模型航空機も飛行禁止です。また小型無人機等飛行禁止法の「小型無人機」は大きさ・重さを問わず対象となります。","id":18},{"ch":3,"sec":"3.1 定義と登録","q":"無人航空機の登録の有効期間として、正しいものを1つ選びなさい。","c":["1年","3年","5年"],"a":1,"e":"登録の有効期間は3年です。第二種機体認証と技能証明（一等・二等とも）も3年で、1年なのは第一種機体認証だけです。","id":19},{"ch":3,"sec":"3.1 定義と登録","q":"登録記号の表示に関する記述として、正しいものを1つ選びなさい。","c":["最大離陸重量25kg以上の機体は文字高25mm以上、25kg未満は3mm以上","機体の重量にかかわらず文字高25mm以上","機体の重量にかかわらず文字高3mm以上"],"a":0,"e":"登録記号の文字の高さは、25kg以上の機体で25mm以上、25kg未満の機体で3mm以上です。","id":20},{"ch":3,"sec":"3.1 定義と登録","q":"無人航空機の登録制度の目的として、適切でないものを1つ選びなさい。","c":["事故発生時などにおける所有者の把握","安全上問題のある機体の登録を拒否して安全を確保すること","機体の市場価格を公示して取引の適正化を図ること"],"a":2,"e":"登録制度の目的は、①所有者の把握、②事故の原因究明など安全確保上必要な措置の実施、③安全上問題のある機体の登録拒否の3つです。","id":21},{"ch":3,"sec":"3.1 定義と登録","q":"登録を受けることができない無人航空機として、適切でないものを1つ選びなさい。","c":["表面に不要な突起物があるなど、衝突時に安全を著しく損なうおそれのあるもの","遠隔操作又は自動操縦による飛行の制御が著しく困難なもの","製造後5年以上が経過したもの"],"a":2,"e":"登録を受けられないのは、国土交通大臣があらかじめ指定したもの（リコール中や事故多発の機体等）、不要な突起物等により衝突時の安全を著しく損なうおそれのあるもの、飛行の制御が著しく困難なものです。製造年数は要件ではありません。","id":22},{"ch":3,"sec":"3.1 定義と登録","q":"リモートIDが発信する情報として、含まれないものを1つ選びなさい。","c":["製造番号及び登録記号","位置・速度・高度・時刻","所有者及び使用者の氏名・住所"],"a":2,"e":"リモートIDは静的情報として製造番号・登録記号を、動的情報として位置・速度・高度・時刻を発信します。所有者や使用者の情報は含まれません。","id":23},{"ch":3,"sec":"3.1 定義と登録","q":"リモートID機能の搭載が不要となる場合として、誤っているものを1つ選びなさい。","c":["30m以内の十分な強度を有する紐等で係留して行う飛行","あらかじめ届け出たリモートID特定区域の上空における飛行","最大離陸重量が25kg未満の機体による飛行"],"a":2,"e":"免除されるのは、制度施行前の事前登録期間中に登録した機体、届け出たリモートID特定区域上空の飛行、30m以内の紐等による係留飛行、警察庁・都道府県警察・海上保安庁の秘匿を要する業務のための飛行の4つです。重量による免除はありません。","id":24},{"ch":3,"sec":"3.1 定義と登録","q":"リモートIDの発信頻度として、正しいものを1つ選びなさい。","c":["1回/秒以上","1回/分以上","10回/秒以上"],"a":0,"e":"リモートIDの発信頻度は1秒間に1回以上と定められています。","id":25},{"ch":3,"sec":"3.2 特定飛行","q":"「特定飛行」の定義として、正しいものを1つ選びなさい。","c":["規制対象となる空域における飛行、又は規制対象となる方法による飛行のいずれかに該当する飛行","規制対象となる空域における飛行、かつ規制対象となる方法による飛行の両方に該当する飛行","国土交通大臣の許可を受けて行う飛行のみを指す"],"a":0,"e":"特定飛行とは、規制対象となる飛行の空域（4つ）における飛行、または規制対象となる飛行の方法（6つ）による飛行の「いずれか」に該当する飛行です。","id":26},{"ch":3,"sec":"3.2 特定飛行","q":"飛行禁止空域に該当しないものを1つ選びなさい。","c":["人口集中地区（DID）の上空","緊急用務空域","地表又は水面から100mの高さの空域（DID外・空港周辺外）"],"a":2,"e":"高度に関する飛行禁止空域は地表又は水面から150m以上です。100mは該当しません。","id":27},{"ch":3,"sec":"3.2 特定飛行","q":"高度150m以上の空域の判断基準として、正しいものを1つ選びなさい。","c":["海抜高度が150m以上かどうかで判断する","無人航空機の直下の地表又は水面からの高度差が150m以上かどうかで判断する","離陸地点の標高に150mを加えた高度で判断する"],"a":1,"e":"海抜高度ではなく、飛行している直下の地表又は水面からの高度差で判断します。山岳部など起伏の激しい地形では意図せず150m以上になるおそれがあり注意が必要です。","id":28},{"ch":3,"sec":"3.2 特定飛行","q":"緊急用務空域に関する記述として、正しいものを1つ選びなさい。","c":["他の空域についての許可を受けていれば飛行できる","飛行の前に指定の有無を確認することが義務付けられている","100g未満の模型航空機は対象外である"],"a":1,"e":"緊急用務空域は国土交通省のHPやXで公示され、飛行前の確認が義務です。他の空域の許可があっても飛行できず、100g未満の模型航空機も飛行禁止です。","id":29},{"ch":3,"sec":"3.2 特定飛行","q":"人口集中地区（DID）に関する記述として、正しいものを1つ選びなさい。","c":["毎年の住民基本台帳をもとに設定される","5年毎の国勢調査の結果をもとに設定される","都道府県知事が任意に指定する"],"a":1,"e":"DIDは5年毎の国勢調査の結果から設定されます。なお第5版では、都市計画法上の工業専用地域内の区域についてDIDに係る許可手続き等が不要となりました。","id":30},{"ch":3,"sec":"3.2 特定飛行","q":"承認が必要となる飛行の方法として、誤っているものを1つ選びなさい。","c":["夜間飛行","目視外飛行","第三者から50m離れた場所での飛行"],"a":2,"e":"距離に関する規制は、第三者又は第三者の物件との間に30m以上の距離を確保できない飛行です。50m離れていれば該当しません。","id":31},{"ch":3,"sec":"3.2 特定飛行","q":"「昼間」の定義として、正しいものを1つ選びなさい。","c":["国立天文台が発表する日の出から日の入りまでの間","午前6時から午後6時までの間","気象庁が発表する明るさの基準を満たす時間帯"],"a":0,"e":"昼間とは国立天文台が発表する日の出から日の入りまでの時刻の間を指します。日没後から日出までの飛行が夜間飛行として承認の対象になります。","id":32},{"ch":3,"sec":"3.2 特定飛行","q":"「目視により常時監視」に含まれるものを1つ選びなさい。","c":["眼鏡やコンタクトレンズを使用して自分の目で見ること","双眼鏡を使用して監視すること","モニター（FPVを含む）を通じて監視すること"],"a":0,"e":"目視とは飛行させる者が自分の目で見ることで、眼鏡・コンタクトレンズの使用は含まれます。双眼鏡・モニター（FPV含む）・補助者による監視は目視に含まれません。","id":33},{"ch":3,"sec":"3.2 特定飛行","q":"目視外飛行に関する記述として、正しいものを1つ選びなさい。","c":["バッテリー残量の確認等で一時的にモニターを見ることも目視外飛行に該当する","バッテリー残量の確認等で一時的にモニターを見ることは目視飛行の範囲内である","補助者が監視していれば目視飛行として扱われる"],"a":1,"e":"バッテリー残量の確認等で一時的にモニターを見ることは目視飛行の範囲内とされています。補助者による監視は目視に含まれません。","id":34},{"ch":3,"sec":"3.2 特定飛行","q":"30m未満の飛行に関する記述として、正しいものを1つ選びなさい。","c":["操縦者自身が所有し管理する自動車との距離が30m未満の場合も該当する","補助者との距離が30m未満の場合も該当する","第三者又は第三者の物件との直線距離が30m未満の場合に該当する"],"a":2,"e":"第三者又は第三者の物件との直線距離が30m未満の飛行が対象です。関係者や自ら管理する物件は該当しません。","id":35},{"ch":3,"sec":"3.2 特定飛行","q":"催し場所の上空における飛行として、該当しないものを1つ選びなさい。","c":["屋外コンサートやマラソン大会の上空","信号待ちや混雑により自然発生的に生じた人混みの上空","花火大会や街頭パレードの上空"],"a":1,"e":"催しとは特定の場所・日時に開催され多数の者が集まるものです。自然発生的な人混みや、関係者のみが参加する催しは該当しません。","id":36},{"ch":3,"sec":"3.2 特定飛行","q":"催し場所の上空で飛行を中止すべき風速として、正しいものを1つ選びなさい。","c":["3m/s以上","5m/s以上","10m/s以上"],"a":1,"e":"催し場所上空の飛行では、風速5m/s以上の場合は飛行を中止します。また接触時の危害を軽減する構造も必要です。","id":37},{"ch":3,"sec":"3.2 特定飛行","q":"危険物の輸送に該当しないものを1つ選びなさい。","c":["飛行のために必要な燃料や電池","散布用の農薬","高圧ガス"],"a":0,"e":"無人航空機の飛行のために必要な燃料・電池、パラシュートを開傘するために必要な火薬類等は、危険物の輸送の対象外です。","id":38},{"ch":3,"sec":"3.2 特定飛行","q":"物件の投下に該当するものを1つ選びなさい。","c":["輸送した物件を地表に置く行為","農薬等の液体や霧状のものの散布","地上の人員に物件を手渡す行為"],"a":1,"e":"水や農薬等の液体、霧状のものの散布は物件の投下に含まれます。地上の人員に受け渡す行為や、輸送物を地表に置く行為は投下に含まれません。","id":39},{"ch":3,"sec":"3.2 特定飛行","q":"航空法上の「物件」に該当しないものを1つ選びなさい。","c":["樹木や雑草などの自然物","電柱・電線・信号機・街灯","自動車・鉄道車両・船舶"],"a":0,"e":"土地や自然物（樹木、雑草等）は物件に該当しません。中に人が存在することが想定される機器や、相当の大きさを有する工作物が物件に当たります。","id":40},{"ch":3,"sec":"3.3 カテゴリー","q":"カテゴリーⅡ飛行とカテゴリーⅢ飛行を区分する基準として、正しいものを1つ選びなさい。","c":["機体の最大離陸重量が25kg以上かどうか","立入管理措置を講じるかどうか","飛行高度が150m以上かどうか"],"a":1,"e":"立入管理措置を講じて行う特定飛行がカテゴリーⅡ、立入管理措置を講じずに行う（第三者上空での）特定飛行がカテゴリーⅢです。","id":41},{"ch":3,"sec":"3.3 カテゴリー","q":"カテゴリーⅠ飛行の説明として、正しいものを1つ選びなさい。","c":["特定飛行に該当しない飛行であり、航空法上の手続きは不要である","立入管理措置を講じた特定飛行であり、許可・承認が必要である","第三者上空を飛行するため最も厳格な手続きが必要である"],"a":0,"e":"カテゴリーⅠ飛行は特定飛行に該当しない飛行で、航空法上の許可・承認の手続きは不要です。","id":42},{"ch":3,"sec":"3.3 カテゴリー","q":"カテゴリーⅡA飛行に該当しないものを1つ選びなさい。","c":["最大離陸重量25kg以上の機体による特定飛行","催し場所上空の飛行","夜間における目視内飛行"],"a":2,"e":"ⅡAは①空港等周辺、②高度150m以上、③催し場所上空、④危険物輸送、⑤物件投下、⑥最大離陸重量25kg以上の6つです。これ以外のカテゴリーⅡ飛行がⅡBです。","id":43},{"ch":3,"sec":"3.3 カテゴリー","q":"カテゴリーⅡB飛行について、技能証明と機体認証を有する場合の取扱いとして正しいものを1つ選びなさい。","c":["いかなる場合も許可・承認が必要である","特段の手続きなく飛行でき、飛行マニュアルの作成・遵守が義務となる","飛行マニュアルの作成も含め一切の義務が免除される"],"a":1,"e":"ⅡBは技能証明と機体認証があれば特段の手続きなく飛行できますが、その場合は飛行マニュアルの作成・遵守が義務となります。","id":44},{"ch":3,"sec":"3.3 カテゴリー","q":"カテゴリーⅢ飛行を行うために必要なものの組合せとして、正しいものを1つ選びなさい。","c":["二等無人航空機操縦士＋第二種機体認証＋許可・承認","一等無人航空機操縦士＋第一種機体認証＋許可・承認","一等無人航空機操縦士のみ"],"a":1,"e":"カテゴリーⅢ飛行には、一等無人航空機操縦士の技能証明、第一種機体認証、運航管理の方法についての許可・承認が必要です。","id":45},{"ch":3,"sec":"3.3 カテゴリー","q":"機体認証の有効期間の組合せとして、正しいものを1つ選びなさい。","c":["第一種1年・第二種3年","第一種3年・第二種1年","第一種・第二種とも3年"],"a":0,"e":"第一種機体認証の有効期間は1年、第二種機体認証は3年です。技能証明（一等・二等）と登録も3年で、1年なのは第一種機体認証だけです。","id":46},{"ch":3,"sec":"3.3 カテゴリー","q":"機体認証の検査及び技能証明の試験を行う主体の組合せとして、正しいものを1つ選びなさい。","c":["機体認証＝指定試験機関／技能証明＝国","機体認証＝国又は登録検査機関／技能証明＝指定試験機関","いずれも登録講習機関が行う"],"a":1,"e":"機体認証の検査は国または登録検査機関が、技能証明の試験は指定試験機関が実施します。","id":47},{"ch":3,"sec":"3.4 例外・特例","q":"捜索又は救助のための特例に関する記述として、正しいものを1つ選びなさい。","c":["個人や民間団体が独自の判断で行う捜索救助活動にも適用される","国又は地方公共団体、これらの者の依頼を受けた者が行う場合に空域と方法の規制が適用されない","空域の規制のみが適用除外となり、方法の規制は適用される"],"a":1,"e":"国・地方公共団体またはこれらから依頼を受けた者が、事故・災害に際し捜索救助を目的として飛行させる場合は、空域と方法の規制がすべて適用されません。独自の活動は対象外です。","id":48},{"ch":3,"sec":"3.4 例外・特例","q":"高度150m以上の空域に関する例外として、正しいものを1つ選びなさい。","c":["煙突や鉄塔等の高層構造物から30m以内の空域は飛行禁止空域から除外される","高層構造物から150m以内の空域は飛行禁止空域から除外される","高層構造物の周辺であればいかなる手続きも不要である"],"a":0,"e":"高層構造物の周辺は航空機の飛行が想定されないため、当該構造物から30m以内の空域は飛行禁止空域から除外されます。ただし構造物の関係者による飛行を除き、第三者の物件から30m以内の飛行に当たるため、その飛行方法の手続きは必要です。","id":49},{"ch":3,"sec":"3.4 例外・特例","q":"係留による例外に関する記述として、誤っているものを1つ選びなさい。","c":["30m以下の十分な強度を有する紐等で係留することが要件である","飛行可能な範囲への第三者の立入管理措置を講じることが要件である","人が紐を持って移動しながら飛行させる場合も係留に該当する"],"a":2,"e":"えい航（自動車や航空機等の移動する物件に紐を固定する、人が紐を持って移動する行為）は係留に該当しません。","id":50},{"ch":3,"sec":"3.4 例外・特例","q":"係留により手続きが不要となる飛行として、含まれないものを1つ選びなさい。","c":["人口集中地区（DID）上空の飛行","夜間飛行","催し場所上空の飛行"],"a":2,"e":"係留により手続きが不要となるのは、DID／夜間飛行／目視外飛行／30m未満の飛行／物件投下です。催し場所上空は含まれません。","id":51},{"ch":3,"sec":"3.4 例外・特例","q":"「第三者」に該当しない者（関与者）に関する記述として、正しいものを1つ選びなさい。","c":["飛行の様子を見物している通行人は間接関与者である","操縦者や補助者等、安全確保に必要な要員は直接関与者である","間接関与者であるためには操縦者の判断のみで足りる"],"a":1,"e":"直接関与者は操縦者・操縦する可能性のある者・補助者等です。間接関与者は、①操縦者が飛行目的に関与していると判断、②計画外の挙動時の指示や注意を受けている、③関与するかを自ら決定できる、の3条件すべてを満たす必要があります。","id":52},{"ch":3,"sec":"3.4 例外・特例","q":"「第三者上空」とみなさない場合として、正しいものを1つ選びなさい。","c":["屋内や停止中の車両等の内部にいるなど、遮蔽物に覆われて保護される状況にある場合","傘をさして歩行している場合","飛行経路から10m以上離れて歩行している場合"],"a":0,"e":"屋内や停止中の車両内部など遮蔽物に覆われて保護される状況、及び移動中の車両等の中にいてレベル3.5の要件を満たして一時的に上空を飛行する場合は第三者上空とみなしません。保護されない状況になれば第三者上空とみなされます。","id":53},{"ch":3,"sec":"3.4 例外・特例","q":"レベル3.5飛行に関する記述として、正しいものを1つ選びなさい。","c":["歩行者等の第三者上空の飛行が認められる","機上カメラにより補助者の配置や看板の設置を代替するもので、立入管理措置自体が不要になるわけではない","カテゴリーⅢ飛行に区分される"],"a":1,"e":"レベル3.5はカテゴリーⅡに含まれます。機上カメラが補助者配置や看板設置を代替するもので立入管理措置そのものが不要になるわけではなく、一時的な道路等の横断に限って移動中の車両等の上空を飛行できるだけで、歩行者等の第三者上空の飛行は認められません。","id":54},{"ch":3,"sec":"3.4 例外・特例","q":"レベル3.5飛行の要件として、誤っているものを1つ選びなさい。","c":["目視内飛行の限定解除を受けた技能証明を保有していること","十分な補償が可能な第三者賠償責任保険に加入していること","第一種機体認証を受けた機体であること"],"a":2,"e":"レベル3.5の要件は、①機上カメラ等で進行方向の飛行経路直下及び周辺に第三者の立入りが無いことを確認できることの事前確認、②目視内飛行の限定解除を受けた技能証明の保有、③十分な補償が可能な第三者賠償責任保険への加入です。","id":55},{"ch":3,"sec":"3.5 操縦者の義務","q":"アルコール又は薬物に関する規定として、正しいものを1つ選びなさい。","c":["体内にアルコールを保有する状態では、その濃度にかかわらず飛行させてはならない","呼気中アルコール濃度が0.15mg/L未満であれば飛行させてよい","「薬物」とは麻薬や覚せい剤等の規制薬物のみを指す"],"a":0,"e":"アルコール濃度の程度にかかわらず、体内にアルコールを保有する状態で飛行させてはなりません。「薬物」には規制薬物だけでなく医薬品も含まれます。","id":56},{"ch":3,"sec":"3.5 操縦者の義務","q":"飛行前の確認事項として、含まれないものを1つ選びなさい。","c":["リモートID機能の作動状況","燃料搭載量又はバッテリー残量","保険契約の更新日"],"a":2,"e":"飛行前確認は、(a)外部点検・作動点検、(b)空域及びその周囲の状況、(c)気象情報、(d)燃料搭載量又はバッテリー残量、(e)リモートID機能の作動状況です。","id":57},{"ch":3,"sec":"3.5 操縦者の義務","q":"航空機との衝突防止に関する記述として、正しいものを1つ選びなさい。","c":["飛行前に航行中の航空機を確認した場合は、高度を下げれば飛行してよい","飛行中に航行中の航空機を確認した場合は、地上に降下させる等の措置を取る","無人航空機が進路権を有するため、航空機側が回避する"],"a":1,"e":"飛行前に航行中の航空機を確認した場合は飛行を行わず、飛行中に確認した場合は地上に降下させる等の適切な措置を取ります。航空機が進路権を有します。","id":58},{"ch":3,"sec":"3.5 操縦者の義務","q":"他人に迷惑を及ぼすような方法での飛行として、該当しないものを1つ選びなさい。","c":["必要がないのに高調音を発すること","人に向かって急接近させること","飛行前に周囲の住民へ飛行予定を周知すること"],"a":2,"e":"必要がないのに高調音を発する、急降下する、人に向かって急接近させる等が迷惑飛行に該当します。事前の周知は望ましい対応です。","id":59},{"ch":3,"sec":"3.5 操縦者の義務","q":"航空法上の「事故」に該当するものを1つ選びなさい。","c":["無人航空機の制御が不能となった事態","第三者の所有物の損壊（損傷の規模や損害額を問わない）","飛行中に無人航空機が発火した事態"],"a":1,"e":"事故は①人の死傷（重傷以上）、②物件の損壊（第三者の所有物。規模や損害額を問わずすべて）、③航空機との衝突又は接触です。制御不能や発火は重大インシデントに当たります。","id":60},{"ch":3,"sec":"3.5 操縦者の義務","q":"「重大インシデント」に該当しないものを1つ選びなさい。","c":["重傷に至らない人の負傷","無人航空機の制御が不能となった事態","第三者の物件の損壊"],"a":2,"e":"第三者の物件の損壊は「事故」です。重大インシデントは、航空機との衝突・接触のおそれがあった事態、重傷に至らない負傷、制御不能となった事態、飛行中の発火です。","id":61},{"ch":3,"sec":"3.5 操縦者の義務","q":"飛行計画の通報に関する記述として、正しいものを1つ選びなさい。","c":["通報した計画に従って飛行しなければならない","事後の通報が原則であり、事前の通報は任意である","国土交通大臣から経路変更の指示を受けても従う必要はない"],"a":0,"e":"飛行計画はドローン情報基盤システムに事前通報するのが原則で（困難な場合は事後でも可）、通報した計画に従って飛行しなければなりません。大臣の変更指示には、安全確保のためやむを得ない場合を除き従います。","id":62},{"ch":3,"sec":"3.5 操縦者の義務","q":"飛行日誌に含まれる記録として、誤っているものを1つ選びなさい。","c":["飛行記録","日常点検記録","操縦者の健康診断記録"],"a":2,"e":"飛行日誌は飛行記録・日常点検記録・点検整備記録から成ります。紙でも電子データでもよいが、速やかに参照・提示できる状態にしておく必要があります。","id":63},{"ch":3,"sec":"3.5 操縦者の義務","q":"飛行記録に記載すべき事項として、適切でないものを1つ選びなさい。","c":["離着陸場所及び離着陸時刻","不具合及びその対応","使用したバッテリーの購入価格"],"a":2,"e":"飛行記録には、年月日、離着陸場所・時刻、飛行時間、飛行させた者の氏名、不具合とその対応を記載します。","id":64},{"ch":3,"sec":"3.5 操縦者の義務","q":"機体認証を受けた機体を飛行させる者の義務として、正しいものを1つ選びなさい。","c":["使用条件等指定書で指定された最大離陸重量・飛行可能高度・速度等の範囲内でしか特定飛行できない","機体認証を受けていれば整備は不要である","使用の条件は目安であり、超えて飛行させても差し支えない"],"a":0,"e":"使用条件等指定書で指定された範囲内でしか特定飛行できません。また無人航空機整備手順書に従って整備し、安全基準に適合するよう維持する義務があります。","id":65},{"ch":3,"sec":"3.6 罰則・行政処分","q":"事故が発生した場合に危険を防止するための措置を講じなかったときの罰則として、正しいものを1つ選びなさい。","c":["2年以下の懲役又は100万円以下の罰金","1年以下の懲役又は50万円以下の罰金","50万円以下の罰金"],"a":0,"e":"救護等の危険防止措置を講じなかった場合が最も重く、2年以下の懲役又は100万円以下の罰金です。","id":66},{"ch":3,"sec":"3.6 罰則・行政処分","q":"アルコール又は薬物の影響下で飛行させたときの罰則として、正しいものを1つ選びなさい。","c":["2年以下の懲役又は100万円以下の罰金","1年以下の懲役又は30万円以下の罰金","10万円以下の罰金"],"a":1,"e":"アルコール・薬物の影響下での飛行は1年以下の懲役又は30万円以下の罰金です。無登録飛行は1年以下の懲役又は50万円以下の罰金です。","id":67},{"ch":3,"sec":"3.6 罰則・行政処分","q":"飛行日誌を備えずに特定飛行を行った場合の罰則として、正しいものを1つ選びなさい。","c":["50万円以下の罰金","30万円以下の罰金","10万円以下の罰金"],"a":2,"e":"技能証明書を携帯せずに特定飛行、飛行日誌を備えずに特定飛行、飛行日誌の不記載・虚偽記載は10万円以下の罰金です。","id":68},{"ch":3,"sec":"3.6 罰則・行政処分","q":"行政処分の点数制において、技能証明の取消しとなる点数として正しいものを1つ選びなさい。","c":["12点以上","15点以上","20点以上"],"a":1,"e":"1〜2点で口頭注意、3〜5点で文書警告、6〜8点で効力停止3月、9〜11点で6月、12〜14点で1年、15点以上で取消しです。","id":69},{"ch":3,"sec":"3.6 罰則・行政処分","q":"行政処分の点数が最も高い（15点）処分事由として、正しいものを1つ選びなさい。","c":["飛行計画を通報しない特定飛行","アルコール又は薬物の影響下での飛行","技能証明書の不携帯"],"a":1,"e":"15点は、事故時に危険防止措置を講じない、アルコール・薬物の影響下での飛行、飛行計画の変更指示に従わない飛行です。飛行計画の未通報は10点、技能証明書不携帯は1点です。","id":70},{"ch":3,"sec":"3.7 技能証明制度","q":"技能証明を申請できる最低年齢として、正しいものを1つ選びなさい。","c":["16歳","18歳","20歳"],"a":0,"e":"技能証明は16歳以上で申請できます。16歳に満たない者は申請できません。","id":71},{"ch":3,"sec":"3.7 技能証明制度","q":"技能証明の更新に関する記述として、正しいものを1つ選びなさい。","c":["更新講習は申請日以前3月以内に修了し、有効期間満了日の6月前から1月前までに申請する","更新講習は申請日以前1年以内に修了し、有効期間満了後3月以内に申請する","更新講習の修了時期に定めはない"],"a":0,"e":"登録更新講習機関の更新講習を申請日以前3月以内に修了し、有効期間が満了する日の6月前から1月前までの間に更新を申請します（第5版で見直された箇所）。","id":72},{"ch":3,"sec":"3.7 技能証明制度","q":"技能証明を取得する流れとして、正しいものを1つ選びなさい。","c":["実地試験→学科試験→身体検査→交付申請","学科試験→実地試験→身体検査→交付申請","身体検査→学科試験→実地試験→交付申請"],"a":1,"e":"学科試験に合格しないと実地試験に進めません。学科試験→実地試験→身体検査→交付申請の順です。登録講習機関で講習を修了し修了審査に合格すると実地試験が免除されます。","id":73},{"ch":3,"sec":"3.7 技能証明制度","q":"技能証明の限定に関する記述として、正しいものを1つ選びなさい。","c":["無人航空機の種類の限定は3種類、飛行の方法の限定は6種類である","無人航空機の種類の限定は6種類、飛行の方法の限定は3種類である","いずれも3種類である"],"a":1,"e":"種類の限定は6種類（マルチローター・ヘリコプター・飛行機×重量制限なし／25kg未満）、飛行の方法の限定は3種類（昼間かつ目視内／昼間／目視内）です。","id":74},{"ch":3,"sec":"3.7 技能証明制度","q":"パワードリフト機を飛行させるために必要な限定として、正しいものを1つ選びなさい。","c":["回転翼航空機（マルチローター）の限定のみ","飛行機の限定のみ","回転翼航空機（マルチローター）と飛行機の両方の限定"],"a":2,"e":"パワードリフト機の飛行には、回転翼航空機（マルチローター）と飛行機の両方の種類の限定に係る資格が必要です。","id":75},{"ch":3,"sec":"3.7 技能証明制度","q":"技能証明を受けた者の義務として、誤っているものを1つ選びなさい。","c":["限定された種類・方法でなければ特定飛行を行ってはならない","眼鏡の着用等、身体状態に応じて付された条件の範囲内でしか特定飛行できない","技能証明書は自宅等で保管し、特定飛行時に携帯する必要はない"],"a":2,"e":"特定飛行を行う場合は技能証明書を携帯しなければなりません。不携帯は10万円以下の罰金、行政処分1点の対象です。","id":76},{"ch":3,"sec":"3.8 航空機の運航ルール","q":"IFR（計器飛行方式）の説明として、正しいものを1つ選びなさい。","c":["航空交通管制機関が与える指示等に常時従って行う飛行方式","操縦者の判断に基づいて行う飛行方式","空港周辺でのみ用いられる飛行方式"],"a":0,"e":"IFRは管制機関の指示等に常時従って行う飛行方式で、旅客機は通常IFRです。VFR（有視界飛行方式）はIFR以外の方式で、操縦者の判断に基づいて飛行します。","id":77},{"ch":3,"sec":"3.8 航空機の運航ルール","q":"航空交通管制区の下限高度として、正しいものを1つ選びなさい。","c":["地表又は水面から150m以上","地表又は水面から200m以上","地表又は水面から250m以上"],"a":1,"e":"航空交通管制区は地表又は水面から200m以上の高さの空域のうち国が指定した空域です。無人航空機の150m、模型航空機の届出基準250mと混同しないよう注意します。","id":78},{"ch":3,"sec":"3.8 航空機の運航ルール","q":"すべての空港に設定される制限表面の組合せとして、正しいものを1つ選びなさい。","c":["進入表面・水平表面・転移表面","円錐表面・延長進入表面・外側水平表面","進入表面・円錐表面・水平表面"],"a":0,"e":"すべての空港に設定されるのは進入表面・水平表面・転移表面の3つです。円錐表面・延長進入表面・外側水平表面は4大空港及び政令空港に追加で設定できます。","id":79},{"ch":3,"sec":"3.8 航空機の運航ルール","q":"航空機が高度150m以下を飛行することがある場合として、適切でないものを1つ選びなさい。","c":["ドクターヘリや捜索救助を任務とする公的機関の航空機","送電線巡視や薬剤散布のため低空飛行の許可を受けた航空機","IFRで巡航中の旅客機"],"a":2,"e":"離着陸に引き続く場合のほか、公的機関の捜索救助機、ドクターヘリ、低空飛行の許可を受けた航空機、人家のない地域や広い水面の上空では150m以下を飛行していることがあります。","id":80},{"ch":3,"sec":"3.8 航空機の運航ルール","q":"模型航空機（100g未満を含む）について、国土交通省への事前の届出が必要となる高度として正しいものを1つ選びなさい。","c":["高度150m以上","高度200m以上","高度250m以上"],"a":2,"e":"模型航空機は、空港等の周辺、航空路内の空域（高度150m以上）、高度250m以上の空域で飛行させる場合に事前の届出が必要です。","id":81},{"ch":3,"sec":"3.9 航空法以外の法令","q":"小型無人機等飛行禁止法の対象となる「小型無人機」に関する記述として、正しいものを1つ選びなさい。","c":["重量100g以上のものに限られる","大きさ・重さを問わず対象となる","最大離陸重量25kg以上のものに限られる"],"a":1,"e":"小型無人機等飛行禁止法の「小型無人機」は大きさ・重さに関係なく対象で、100g未満も含まれます。気球やハンググライダー等の特定航空用機器も対象です。","id":82},{"ch":3,"sec":"3.9 航空法以外の法令","q":"小型無人機等飛行禁止法におけるイエロー・ゾーンの範囲として、正しいものを1つ選びなさい。","c":["対象施設の敷地・区域の周囲おおむね300m","対象施設の敷地・区域の周囲おおむね1,000m","対象施設の敷地・区域の周囲おおむね3,000m"],"a":1,"e":"対象施設の敷地・区域の上空がレッド・ゾーン、その周囲おおむね1,000mの周辺地域の上空がイエロー・ゾーンです。","id":83},{"ch":3,"sec":"3.9 航空法以外の法令","q":"小型無人機等飛行禁止法の飛行禁止の例外に該当しないものを1つ選びなさい。","c":["対象施設の管理者又はその同意を得た者による飛行","土地の所有者等又はその同意を得た者が当該土地の上空で行う飛行","航空法に基づく飛行の許可・承認を受けた者による飛行"],"a":2,"e":"航空法の許可・承認や機体認証・技能証明を取得していても、小型無人機等飛行禁止法の対象区域は飛行できません。例外は、(a)施設管理者等の同意、(b)土地所有者等による当該土地上空の飛行、(c)国又は地方公共団体の業務の3つのみです。","id":84},{"ch":3,"sec":"3.9 航空法以外の法令","q":"小型無人機等飛行禁止法の例外に該当する場合の手続きとして、正しいものを1つ選びなさい。","c":["都道府県公安委員会等へ通報が必要である","国土交通大臣への届出が必要である","何ら手続きは必要ない"],"a":0,"e":"例外に当たる場合でも、都道府県公安委員会等への通報が必要です。また防衛関係施設・空港のレッドゾーンでは(b)(c)の場合でも管理者の同意が必要です。","id":85},{"ch":3,"sec":"3.9 航空法以外の法令","q":"無線局免許が不要な周波数帯と最大送信出力の組合せとして、正しいものを1つ選びなさい。","c":["920MHz帯・20mW","2.4GHz帯・1W","5.7GHz帯・1W"],"a":0,"e":"免許・登録を要しない無線局は73MHz帯等（微弱）、920MHz帯（20mW）、2.4GHz帯（10mW/MHz）です。2.4GHz帯・5.7GHz帯の1Wは携帯局（無人移動体画像伝送システム）で、無線局免許と第三級陸上特殊無線技士以上の資格が必要です。","id":86},{"ch":3,"sec":"3.9 航空法以外の法令","q":"無人移動体画像伝送システムの無線局を運用するために必要な無線従事者資格として、正しいものを1つ選びなさい。","c":["資格は不要である","第三級陸上特殊無線技士以上","第一級総合無線通信士"],"a":1,"e":"169MHz帯・2.4GHz帯・5.7GHz帯の携帯局（無人移動体画像伝送システム）は、無線局免許に加え第三級陸上特殊無線技士以上の資格が必要です。","id":87},{"ch":3,"sec":"3.9 航空法以外の法令","q":"アマチュア無線を無人航空機に利用する場合の記述として、正しいものを1つ選びなさい。","c":["営利目的の業務にも利用できる","金銭上の利益のためではない個人的興味による自己訓練・通信・技術研究のためのものである","無線局免許は不要である"],"a":1,"e":"アマチュア無線は金銭上の利益のためでなく個人的興味による自己訓練・通信・技術研究のためのもので、利益を目的とした業務には利用できません。アマチュア無線技士の資格と無線局免許が必要です。","id":88},{"ch":3,"sec":"3.9 航空法以外の法令","q":"携帯電話を上空で利用する場合の記述として、正しいものを1つ選びなさい。","c":["地上での利用が前提のため、機体搭載時は上空用プラン等の利用手続が必要である","機体に搭載する場合でも、地上と同じ契約のまま利用してよい","上空では電波が届かないため利用できない"],"a":0,"e":"携帯電話等は地上での利用を前提に設計されており、機体に搭載して利用する場合（SIMを挿入する場合を含む）は携帯電話事業者が提供する上空用プラン等の利用手続が必要です。","id":89},{"ch":3,"sec":"3.9 航空法以外の法令","q":"飛行自粛要請空域に関する記述として、正しいものを1つ選びなさい。","c":["航空法に基づく飛行禁止空域である","法令に基づく規制ではなく、関係省庁の要請に基づき国土交通省が飛行の自粛を要請するものである","小型無人機等飛行禁止法に基づく規制である"],"a":1,"e":"飛行自粛要請空域は法令に基づく規制ではなく、警備上の観点等から関係省庁の要請に基づき国土交通省が自粛を要請するものです。設定時は国交省HP・Xで公示されます。","id":90},{"ch":4,"sec":"4.1 機体の種類","q":"マルチローターの特徴として、誤っているものを1つ選びなさい。","c":["垂直離着陸やホバリングができる","エネルギー消費が少なく長時間の飛行に適する","風の影響を受けやすい"],"a":1,"e":"マルチローターは垂直離着陸・ホバリング・前後左右移動・水平回転ができる一方、エネルギー消費が大きく風の影響を受けやすい特徴があります。","id":91},{"ch":4,"sec":"4.1 機体の種類","q":"無人ヘリコプターの特徴として、正しいものを1つ選びなさい。","c":["1組のローターで効率よく揚力を得られるが、スワッシュプレートやテールローターが必要で構造が複雑である","ホバリングができない","滑走路が必要である"],"a":0,"e":"ヘリコプターは1組のローターで効率よく揚力を得られますが、スワッシュプレートやテールローターが必要なため構造が複雑です。","id":92},{"ch":4,"sec":"4.1 機体の種類","q":"飛行機（固定翼機）の特徴として、誤っているものを1つ選びなさい。","c":["高速・長時間・長距離の飛行に適する","推力を失っても滑空することができる","ホバリングや後退、横移動ができる"],"a":2,"e":"飛行機はホバリング・後退・横移動ができません。横移動はバンクターンで行います。また滑走路が必要で失速の危険があります。","id":93},{"ch":4,"sec":"4.1 機体の種類","q":"パワードリフト機の特徴として、正しいものを1つ選びなさい。","c":["垂直離着陸ができ、巡航中は飛行機のように前進飛行ができる","垂直離着陸のみができる","滑走路が必ず必要である"],"a":0,"e":"パワードリフト機は回転翼航空機のように垂直離着陸ができ、巡航中は飛行機のように前進飛行ができます。飛行にはマルチローターと飛行機の両方の限定が必要です。","id":94},{"ch":4,"sec":"4.1 機体の種類","q":"マルチローターを右方向に移動させるときのローターの回転数の変化として、正しいものを1つ選びなさい。","c":["右側の回転数を上げ、左側の回転数を下げる","右側の回転数を下げ、左側の回転数を上げる","すべてのローターの回転数を上げる"],"a":1,"e":"指示した側（右側）のローターの回転数を下げ、反対側（左側）を上げることで機体が右に傾き、推力の合力が傾いた方向に働いて移動します。","id":95},{"ch":4,"sec":"4.1 機体の種類","q":"マルチローターの水平回転（ヨー）の原理として、正しいものを1つ選びなさい。","c":["反トルクのバランスを崩すことで始まる","すべてのローターの回転数を同時に上げることで始まる","テールローターの推力を変化させることで始まる"],"a":0,"e":"マルチローターの水平回転は反トルクのバランスを崩すと始まります。指示した回転方向のローターの回転数が下がってバランスが崩れます。テールローターがあるのはヘリコプターです。","id":96},{"ch":4,"sec":"4.1 機体の種類","q":"マルチローターにおける「エルロン」の操作が生む動きとして、正しいものを1つ選びなさい。","c":["ピッチ方向の動きによる前後移動","ロール方向の動きによる左右移動","ヨー方向の動きによる機首の旋回"],"a":1,"e":"マルチローターではエルロン＝ロール方向で左右移動、エレベーター＝ピッチ方向で前後移動、ラダー＝ヨー方向で機首の左右旋回、スロットル＝上昇・降下です。","id":97},{"ch":4,"sec":"4.1 機体の種類","q":"飛行機における「エレベーター」の操作が生む動きとして、正しいものを1つ選びなさい。","c":["速度の変化","ピッチ方向の動きによる上昇・降下","ロール方向の動きによる左右旋回"],"a":1,"e":"飛行機ではエレベーター＝ピッチ方向で上昇・降下、スロットル＝推力の増減で速度変化、エルロン＝ロール方向で左右旋回、ラダー＝ヨー方向で左右旋回です。","id":98},{"ch":4,"sec":"4.1 機体の種類","q":"送信機のモード1とモード2の違いとして、正しいものを1つ選びなさい。","c":["スロットルとエレベーターの左右の配置が入れ替わる","エルロンとラダーの左右の配置が入れ替わる","すべての舵の配置が入れ替わる"],"a":0,"e":"モード1とモード2で変わるのはスロットルとエレベーターの左右だけです。エルロン（右スティック左右）とラダー（左スティック左右）は共通です。","id":99},{"ch":4,"sec":"4.1 機体の種類","q":"夜間飛行を行う場合に機体に求められる装備として、正しいものを1つ選びなさい。（飛行範囲が照明等で十分に照らされていないものとする。）","c":["機体の姿勢及び方向が正確に視認できる灯火","障害物との衝突を防止する赤外線センサ","機体を認識しやすい塗色"],"a":0,"e":"夜間飛行では機体の姿勢及び方向が正確に視認できる灯火が必要です。塗色は補助者を配置しない目視外飛行で求められる要件です。","id":100},{"ch":4,"sec":"4.1 機体の種類","q":"補助者を配置しない目視外飛行において機体に追加で求められる要件として、誤っているものを1つ選びなさい。","c":["航空機からの視認を容易にする灯火又は認識しやすい塗色","飛行経路全体の航空機の状況が常に確認できるカメラ等","最大離陸重量が25kg未満であること"],"a":2,"e":"補助者を配置しない目視外飛行では、視認性を高める灯火・塗色、飛行経路全体の航空機の状況を確認できるカメラ等、第三者に危害を加えないことを製造事業者等が証明した機能、針路・姿勢・高度・速度・周辺気象を把握できる操縦装置等が求められます。重量要件はありません。","id":101},{"ch":4,"sec":"4.2 飛行原理","q":"飛行機に働く4つの力の組合せとして、正しいものを1つ選びなさい。","c":["揚力・重力・推力・抗力","揚力・重力・遠心力・摩擦力","推力・抗力・浮力・重力"],"a":0,"e":"揚力・重力・推力・抗力の4つの力が釣り合うと定常飛行（釣り合い飛行）となります。","id":102},{"ch":4,"sec":"4.2 飛行原理","q":"機体の3軸と運動の組合せとして、正しいものを1つ選びなさい。","c":["左右軸まわり＝ロール／前後軸まわり＝ピッチ","左右軸まわり＝ピッチ／前後軸まわり＝ロール／上下軸まわり＝ヨー","上下軸まわり＝ピッチ／左右軸まわり＝ヨー"],"a":1,"e":"左右軸まわりがピッチ、前後軸まわりがロール、上下軸まわりがヨーです。角度はピッチ角・ロール角（バンク角）・ヨー角（方位角）、角速度はピッチング・ローリング・ヨーイングと呼びます。","id":103},{"ch":4,"sec":"4.2 飛行原理","q":"失速に関する記述として、正しいものを1つ選びなさい。","c":["迎角が大きすぎると流れが翼表面から剥離し、揚力が減って抗力が増大する","迎角を大きくすればするほど揚力は増加し続ける","失速しても舵の効きは変わらない"],"a":0,"e":"一般に迎角が増すと揚力・抗力とも増加しますが、迎角が大きすぎると流れが翼表面から剥離して失速します。飛行中に失速すると急降下を始め舵が効かなくなります。","id":104},{"ch":4,"sec":"4.2 飛行原理","q":"揚力と抗力の説明として、正しいものを1つ選びなさい。","c":["流れと垂直方向に働く力が揚力、流れの方向に働く力が抗力である","流れの方向に働く力が揚力、垂直方向に働く力が抗力である","揚力と抗力はいずれも流れの方向に働く"],"a":0,"e":"流れと垂直方向に働く力が揚力、流れの方向に働く力が抗力です。上面の湾曲が下面より大きい翼型は効率よく揚力を発生できます。","id":105},{"ch":4,"sec":"4.2 飛行原理","q":"反トルクの処理方法として、正しいものを1つ選びなさい。","c":["マルチローターは偶数個のプロペラを半数ずつ異なる向きに回転させて相殺する","マルチローターはテールローターで相殺する","ヘリコプターはプロペラを逆向きに回転させて相殺する"],"a":0,"e":"マルチローターはCWとCCWのプロペラを半数ずつ配置して反トルクを相殺します。ヘリコプターはメインローターの反トルクをテールローターで相殺し、テールローターの推力を変えてヨーを制御します。","id":106},{"ch":4,"sec":"4.2 飛行原理","q":"ペイロード搭載時の注意として、誤っているものを1つ選びなさい。","c":["機体重量が変わると安定性・飛行性能・運動性能が変化する","重心位置の変化は飛行特性に大きく影響する","最大積載量と飛行性能は飛行高度や大気状態にかかわらず一定である"],"a":2,"e":"最大積載量と飛行性能は飛行高度・大気状態によって異なり、飛行機では離着陸エリアの広さでも変わります。ペイロードの有無で重心が著しく変化しないようにします。","id":107},{"ch":4,"sec":"4.3 機体の構成","q":"ジャイロセンサが測定するものとして、正しいものを1つ選びなさい。","c":["回転角速度","直交3軸方向の加速度","地磁気"],"a":0,"e":"ジャイロセンサは回転角速度（単位時間当たりの回転角度の変化）を測定します。加速度センサは直交3軸方向の並進運動の加速度を測定し、地磁気センサは機体の向きを取得します。","id":108},{"ch":4,"sec":"4.3 機体の構成","q":"IMUの説明として、正しいものを1つ選びなさい。","c":["3軸のジャイロセンサと3方向の加速度センサ等により3次元の角速度と加速度を検出する装置","人工衛星の電波を受信して位置を取得する装置","モーターの回転数を制御する装置"],"a":0,"e":"IMUは3軸のジャイロセンサと3方向の加速度センサ等により3次元の角速度と加速度を検出します。メーカーによっては気圧センサを含みます。","id":109},{"ch":4,"sec":"4.3 機体の構成","q":"高度センサの計測方式の組合せとして、誤っているものを1つ選びなさい。","c":["気圧センサ＝歪みゲージで気圧変化を読む","超音波センサ＝音波の反射時間を計測する","LiDAR＝地磁気の変化を計測する"],"a":2,"e":"LiDARはレーザー光（赤外線）の反射時間を計測します。地磁気を用いるのは地磁気センサです。","id":110},{"ch":4,"sec":"4.3 機体の構成","q":"リチウムポリマーバッテリーの1セルあたりの電圧として、正しいものを1つ選びなさい。","c":["1.2V","3.7V","12V"],"a":1,"e":"リチウムポリマーバッテリーは1セルあたり3.7Vです。バッテリー全体の電圧はセル当たりの電圧×セル数で求めます。","id":111},{"ch":4,"sec":"4.3 機体の構成","q":"バッテリーの「容量」の単位と求め方の組合せとして、正しいものを1つ選びなさい。","c":["Ah＝電流×時間","W＝放電時電圧×電流","Wh＝電流×時間"],"a":0,"e":"容量はAhで電流×時間、出力はWで放電時電圧×電流、エネルギー容量はWhで放電時電圧×電流×時間です。","id":112},{"ch":4,"sec":"4.3 機体の構成","q":"リチウムポリマーバッテリーの特徴として、誤っているものを1つ選びなさい。","c":["エネルギー密度が高く、自己放電が少ない","メモリ効果が小さい","電解質が不燃性である"],"a":2,"e":"リチウムポリマーバッテリーはゲル状のポリマー電解質を採用しており、電解質は可燃物です。エネルギー密度・電圧が高く、自己放電が少なくメモリ効果が小さい特徴があります。","id":113},{"ch":4,"sec":"4.3 機体の構成","q":"バッテリーの取扱いに関する記述として、正しいものを1つ選びなさい。","c":["過放電・過充電の状態ではガスが多く発生し膨らむ原因となる","充電器は必ず満充電で停止するため過充電の心配はない","複数セルのバッテリーはバランスコネクタを接続せずに充電する"],"a":0,"e":"過放電・過充電は急速な劣化と寿命短縮を招き、ガスの発生により膨らむ原因になります。充電器は満充電で停止しますが過充電となる場合があり、複数セルはバランスコネクタを充電器へ接続してセル間のバランスを補正します。","id":114},{"ch":4,"sec":"4.3 機体の構成","q":"冬季のバッテリーに関する記述として、正しいものを1つ選びなさい。","c":["気温が低下すると放電能力が極端に低下し、飛行時間が半減することがある","気温が低下すると放電能力が向上し飛行時間が延びる","気温はバッテリー性能に影響しない"],"a":0,"e":"冬季は気温低下により放電能力が極端に低下し、飛行時間が半減することがあります。残量が減って電圧が低下すると急激に出力が弱くなり墜落の原因になります。","id":115},{"ch":4,"sec":"4.3 機体の構成","q":"ブラシレスモーター及びESCに関する記述として、正しいものを1つ選びなさい。","c":["ブラシレスモーターはメンテナンスが煩雑で寿命が短い","ESCがモーターの回転数を制御し、揚力や推力を変化させる","ローターは回転方向にかかわらず同一形状のものを使用する"],"a":1,"e":"ESC（エレクトロニックスピードコントローラー）がモーターの回転数を制御します。ブラシレスモーターはメンテナンスが容易で静音・長寿命、ローターはCW／CCWの回転方向に合わせた形状で取り付け方向に注意が必要です。","id":116},{"ch":4,"sec":"4.3 機体の構成","q":"電動機とエンジン機の比較として、正しいものを1つ選びなさい。","c":["電動は振動・騒音が少なく軽量化できるが飛行時間が短い","電動は長時間・長距離の飛行に適するが騒音が大きい","エンジンは振動・騒音が少なく軽量化できる"],"a":0,"e":"電動は振動・騒音が少なく軽量化できる一方で飛行時間が短く、エンジンは長時間・長距離が可能ですが騒音が大きくなります。","id":117},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"電波の回折に関する記述として、正しいものを1つ選びなさい。","c":["周波数が低い（波長が長い）ほど障害物を回り込みやすい","周波数が高いほど障害物を回り込みやすい","周波数は回折に影響しない"],"a":0,"e":"周波数が低い（波長が長い）ほど回折しやすく障害物を回り込めます。2.4GHzは回折しにくく直進性が高いため障害物の影響を受けやすくなります。","id":118},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"電波の減衰に関する記述として、正しいものを1つ選びなさい。","c":["進行距離に反比例して電力密度が減少する","進行距離の2乗に反比例して電力密度が減少する","進行距離にかかわらず電力密度は一定である"],"a":1,"e":"電波の電力密度は進行距離の2乗に反比例して減少します。距離が2倍になると電力密度は1/4になります。水中では吸収され大きく減衰します。","id":119},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"マルチパスに関する記述として、正しいものを1つ選びなさい。","c":["反射・屈折により複数の経路を通った電波がわずかに遅れて届き、一時的に操縦不能になる要因となる","電波が複数の周波数に分かれて伝わる現象である","電波が水中で吸収される現象である"],"a":0,"e":"マルチパスは反射・屈折で複数経路を通った電波がわずかな時間差で到達する現象で、一時的に操縦不能になる要因となります。GNSSの測位精度にも影響します。","id":120},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"フレネルゾーンに関する記述として、正しいものを1つ選びなさい。","c":["周波数が高く距離が短いほど半径は小さくなる","周波数が高く距離が短いほど半径は大きくなる","周波数や距離に関係なく半径は一定である"],"a":0,"e":"フレネルゾーンの半径は周波数が高いほど、また距離が短いほど小さくなります。アンテナの高さを確保して地面をゾーン外にすることが重要です。","id":121},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"地磁気センサに影響を与えるものとして、適切でないものを1つ選びなさい。","c":["高圧線・変電所・電波塔","鉄材を多く使用した建物や鉄道","晴天時の強い日射"],"a":2,"e":"地磁気センサは高圧線・変電所・電波塔・鉄材を多く使用した建物・鉄道・自動車・鉄板などの影響を受けます。日射は直接の影響要因ではありません。","id":122},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"磁気キャリブレーションの説明として、正しいものを1つ選びなさい。","c":["飛行前にその場所の地磁気を検出して方位を取得し、GNSS機能やメインコントローラーに認識させること","バッテリーの残量を正確に表示させるための調整","モーターの回転数を均一にするための調整"],"a":0,"e":"磁気キャリブレーションは飛行前にその場所の地磁気を検出して方位を取得させる作業です。正しく行われないと意図しない方向へ飛行する可能性があります。","id":123},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"GNSSの測位に最低限必要な衛星数として、正しいものを1つ選びなさい。","c":["2基以上","3基以上","4基以上"],"a":2,"e":"GNSSは最低4基以上の衛星からの信号を同時受信して位置を計算します。安定した飛行にはより多くの衛星を捕捉することが望ましいとされます。","id":124},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"GNSSの測位精度に関する記述として、正しいものを1つ選びなさい。","c":["一般に高度方向より水平方向の誤差が大きい","一般に水平方向より高度方向の誤差が大きい","水平方向と高度方向の誤差はほぼ等しい"],"a":1,"e":"一般に水平方向より高度方向の誤差が大きくなります。単独測位の精度は数十m、RTKやDGPSでは数cm〜数mです。","id":125},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"GNSSに含まれる測位衛星システムとして、誤っているものを1つ選びなさい。","c":["GPS（米国）","Galileo（欧州）","LiDAR（日本）"],"a":2,"e":"GNSSはGPS（米）、GLONASS（露）、Galileo（欧）、準天頂衛星QZSS（日）等の総称です。LiDARはレーザーによる測距技術で衛星測位システムではありません。","id":126},{"ch":4,"sec":"4.5 整備・保管","q":"リチウムポリマーバッテリーを長期間使用しない場合の保管充電量の目安として、正しいものを1つ選びなさい。","c":["満充電","60%程度","完全に放電した状態"],"a":1,"e":"長期保管は充電60%を目安とします。満充電での保管も飛行後の放電状態での保管も劣化が進み膨らんで使用不可になることが多くなります。","id":127},{"ch":4,"sec":"4.5 整備・保管","q":"バッテリーの保管に関する記述として、誤っているものを1つ選びなさい。","c":["発火しても安全を保てる不燃性のケースに入れて保管する","機体のコネクタに接続したまま保管すると管理しやすく望ましい","35℃を超える高温になる環境では保管しない"],"a":1,"e":"端子が短絡しないよう細心の注意が必要で、機体コネクタと接続したままにしてはいけません。不燃性のケースに入れ、35℃を超える高温環境を避けて保管します。","id":128},{"ch":4,"sec":"4.5 整備・保管","q":"膨らんだバッテリーへの対応として、正しいものを1つ選びなさい。","c":["過充電等で内部に可燃性ガスが発生している可能性があるため早めに交換する","膨らみが小さいうちは問題がないため使用を継続する","穴を開けてガスを抜いてから使用する"],"a":0,"e":"バッテリーが膨らんでいる場合は過充電等により内部に可燃性ガスが発生している可能性があるため、早めに交換します。","id":129},{"ch":4,"sec":"4.5 整備・保管","q":"事業で用いたバッテリーの廃棄に関する記述として、正しいものを1つ選びなさい。","c":["家庭ごみとして廃棄する","産業廃棄物として廃棄する","自然に放置して分解させる"],"a":1,"e":"廃棄は各地方自治体のルールに従いますが、事業で用いたバッテリーは産業廃棄物として廃棄します。","id":130},{"ch":4,"sec":"4.5 整備・保管","q":"整備点検の実施時期に関する記述として、正しいものを1つ選びなさい。","c":["飛行前後に加え、機体ごとに定められた一定の期間・一定の総飛行時間ごとに実施する","飛行前の点検のみで足りる","不具合が発生したときだけ実施すればよい"],"a":0,"e":"運航者は飛行前後だけでなく、機体ごとに定められた一定の期間・一定の総飛行時間ごとに整備点検を行います。知識・技能が不足する場合は専門の整備業者に依頼します。","id":131},{"ch":4,"sec":"4.3 機体の構成","q":"物件投下のための機器に関する記述として、誤っているものを1つ選びなさい。","c":["ウインチ機構で吊り下げる場合は物件の揺れと投下前後の重心の変化に注意する","農薬散布装置は対象区域外への飛散に注意する必要がある","物件投下装置は意図せず落下しない構造のため、投下手順を把握する必要はない"],"a":2,"e":"物件投下装置は意図せず物件が落下しない構造ですが、搭載方法や投下手順が定められているため、その特性と機能を熟知する必要があります。","id":132},{"ch":4,"sec":"4.3 機体の構成","q":"メインコントローラーの役割として、正しいものを1つ選びなさい。","c":["各種センサ情報と送信機の指令をもとに機体の姿勢を制御する","バッテリーのセルバランスを補正する","モーターへ供給する電流を直接生成する"],"a":0,"e":"メインコントローラーは各種センサ情報と送信機の指令をもとに機体の姿勢を制御します。モーターの回転数制御はESCが行います。","id":133},{"ch":5,"sec":"5.1 点検プロセス","q":"運航時の点検プロセスの数として、正しいものを1つ選びなさい。","c":["4つ","6つ","8つ"],"a":1,"e":"点検プロセスは、①飛行前の準備、②飛行前の点検、③飛行中の監視、④飛行後の点検、⑤運航終了後の点検、⑥異常事態発生時の点検の6つです。","id":134},{"ch":5,"sec":"5.1 点検プロセス","q":"点検プロセスの実施方法として、正しいものを1つ選びなさい。","c":["操縦者が独自に定めた手順で実施する","機体メーカーの指示する内容に従って実施する","点検項目は国が一律に定めており、機体による違いはない"],"a":1,"e":"点検プロセスは機体メーカーの指示する内容に従って実施し、プロセスごとに点検項目を設定します。","id":135},{"ch":5,"sec":"5.1 点検プロセス","q":"飛行前の準備において確認すべき事項として、適切でないものを1つ選びなさい。","c":["機体の登録・機体認証の有効期間と使用の条件","操縦者の技能証明の等級・限定・条件・有効期間","操縦者の過去3年間の飛行回数の公表"],"a":2,"e":"飛行前の準備では、機体の確認、操縦者の確認、飛行空域及びその周囲、気象状況、必要な手続き、立入管理措置・安全確保措置、飛行計画の策定及び通報を確認します。","id":136},{"ch":5,"sec":"5.1 点検プロセス","q":"飛行前の点検項目として、適切でないものを1つ選びなさい。","c":["リモートID機能が正常に作動しているか","登録記号が表示されているか","飛行後の機体の洗浄が済んでいるか"],"a":2,"e":"飛行前の点検は、各機器の取付け状態、発動機・モーターの異音、機体の損傷やゆがみ、燃料・バッテリー残量、通信系統・推進系統・電源系統・自動制御系統の作動、登録記号の表示、リモートID機能の作動確認です。","id":137},{"ch":5,"sec":"5.1 点検プロセス","q":"飛行中の監視項目として、適切でないものを1つ選びなさい。","c":["計画通りの経路・高度・速度が維持されているか","飛行空域及び周囲の気象の変化","次回の飛行計画の作成状況"],"a":2,"e":"飛行中の監視は、機体の異常の有無と計画通りの経路・高度・速度の維持状況、気象の変化、航空機及び他の無人航空機の有無、第三者の有無です。","id":138},{"ch":5,"sec":"5.2 操縦知識","q":"ボルテックス・リング・ステートの発生条件として、正しいものを1つ選びなさい。","c":["垂直降下や降下を伴う低速前進のとき","高速で水平前進しているとき","上昇しているとき"],"a":0,"e":"垂直降下時に吹きおろした空気が再び吸い込まれ、回転翼の上下で空気の再循環が発生して急激に揚力を失う現象です。降下を伴う低速前進でも発生します。","id":139},{"ch":5,"sec":"5.2 操縦知識","q":"ボルテックス・リング・ステートの予防として、正しいものを1つ選びなさい。","c":["降下の際に水平方向の移動を合わせて操作する","降下速度をさらに上げる","ローターの回転数を一定に保ち垂直に降下する"],"a":0,"e":"降下の際に水平方向の移動を合わせて操作する（前進させながら降下する）ことが予防になります。","id":140},{"ch":5,"sec":"5.2 操縦知識","q":"ヘリコプターの離着陸地点の選定として、適切でないものを1つ選びなさい。","c":["水平な場所を選ぶ","滑りやすい場所を避ける","ダウンウォッシュで砂埃が立ちやすい乾燥した砂地を選ぶ"],"a":2,"e":"傾斜地はテール部が接触するおそれ、滑りやすい場所はヨー軸まわりに回転するおそれ、砂や乾燥した土はダウンウォッシュで砂埃が舞うため避けます。","id":141},{"ch":5,"sec":"5.2 操縦知識","q":"ヘリコプターの離陸に関する記述として、正しいものを1つ選びなさい。","c":["離陸後は速やかに地面効果外まで上昇する","地面効果範囲内でホバリングを続けて機体の状況を確認する","垂直方向に急上昇するのが望ましい"],"a":0,"e":"離陸後は速やかに地面効果外まで上昇し、機体状況の確認は地面効果外で行います。垂直方向の急上昇は避け、前進させながら上昇した方が必要パワーを削減できます。","id":142},{"ch":5,"sec":"5.2 操縦知識","q":"飛行機（固定翼機）の離着陸の方向として、正しいものを1つ選びなさい。","c":["追い風方向を原則とする","向かい風方向を原則とする","風向にかかわらず滑走路の方向に従う"],"a":1,"e":"離着陸は向かい風が原則です。追い風は失速の危険があり、失速しない速度にすると滑走路を逸脱する危険があります。","id":143},{"ch":5,"sec":"5.2 操縦知識","q":"手動操縦の特徴として、誤っているものを1つ選びなさい。","c":["高度の微調整や遠隔地での高精度な着陸など細かな操作ができる","GNSS受信機や気圧センサが機能不全に陥ったときの危険回避に必須である","高い再現性を求められる飛行に適している"],"a":2,"e":"手動操縦は高い再現性を求められる操縦には不向きです。再現性が必要な飛行には自動操縦が適しています。","id":144},{"ch":5,"sec":"5.2 操縦知識","q":"手動操縦で起こりやすいヒューマンエラーとして、正しいものを1つ選びなさい。","c":["操縦者の視線と機体の正面方向が異なる場合に意図しない方向へ飛びやすい","ウェイポイント設定時の障害物の確認不足","地図情報の読み違い"],"a":0,"e":"手動操縦では操縦者の視線と機体の正面方向が異なる場合に意図しない方向へ飛びやすく、距離が離れると障害物との距離差がつかみにくくなります。ウェイポイントの確認不足は自動操縦のヒューマンエラーです。","id":145},{"ch":5,"sec":"5.2 操縦知識","q":"自動操縦の特徴として、誤っているものを1つ選びなさい。","c":["ウェイポイントでは位置だけでなく機体の向き・高度・速度も設定できる","再現性の高い飛行ができるため経過観察が必要な用地等で利用される","設定した経路上の障害物は機体のセンサが必ず回避するため事前確認は不要である"],"a":2,"e":"自動操縦のヒューマンエラーとしてウェイポイント設定時の飛行経路上の障害物の確認不足が挙げられます。設定経路上の障害物は事前に現地で確認する必要があります。","id":146},{"ch":5,"sec":"5.2 操縦知識","q":"緊急時の対応の大原則として、正しいものを1つ選びなさい。","c":["離陸地点に戻すことを前提とせず、速やかに近くの安全な無人地帯へ不時着させる","いかなる場合も離陸地点まで帰還させる","その場でホバリングを続けて状況の回復を待つ"],"a":0,"e":"緊急時には離陸地点などに戻すことを前提とせず、速やかに近くの安全な無人地帯へ不時着させることが大原則です。","id":147},{"ch":5,"sec":"5.2 操縦知識","q":"フェールセーフ機能の説明として、正しいものを1つ選びなさい。","c":["送信電波や電源容量の減少で飛行継続が困難な場合に自動帰還モード等へ切り替わる機能","機体の重量を自動的に軽減する機能","飛行禁止空域を自動的に解除する機能"],"a":0,"e":"送信電波や電源容量の減少で飛行が継続できない場合（またはその予想がある場合）に自動帰還モードへ切り替わります。バッテリー残量が極端に少ない場合などはその場で自動着陸を試みます。","id":148},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"操縦者のパフォーマンスに関する記述として、正しいものを1つ選びなさい。","c":["操縦者は疲労を感じても飛行を継続してしまう傾向があるため、適切に飛行時間を管理する","疲労を感じたときだけ休憩すればよく、事前の時間管理は不要である","ストレスは操縦技量には影響しない"],"a":0,"e":"操縦者は疲労を感じても飛行を継続してしまう傾向があるため、適切な飛行時間の管理が必要です。高いストレスも安全な飛行を妨げます。","id":149},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"補助者の役割として、適切でないものを1つ選びなさい。","c":["飛行経路の安全管理と第三者の立入管理","危険予知の警告や緊急着陸地点への誘導","操縦者に代わって操縦装置を操作すること"],"a":2,"e":"補助者は飛行準備、飛行経路の安全管理、第三者の立入管理、地上・空域の安全確認、危険予知の警告、緊急着陸地点への誘導、着陸後の機体回収や安全点検の補助などを行います。","id":150},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"CRM（Crew Resource Management）の説明として、正しいものを1つ選びなさい。","c":["利用可能な人的リソース・ハードウェア・情報を全て活用する概念である","操縦技量を高めるための訓練手法である","機体の整備手順を標準化する手法である"],"a":0,"e":"CRMは全ての利用可能な人的リソース・ハードウェア・情報を活用する概念です。操縦技量（テクニカルスキル）だけではヒューマンエラーは無くせません。","id":151},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"5つのCRMスキル（ノンテクニカルスキル）に含まれないものを1つ選びなさい。","c":["状況認識","ワークロード管理","操縦技量"],"a":2,"e":"5つのCRMスキルは、状況認識・意思決定・ワークロード管理・チームワーク・コミュニケーションです。操縦技量はテクニカルスキルです。","id":152},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"TEMにおける連鎖の順序として、正しいものを1つ選びなさい。","c":["スレット → エラー → UAS（安全マージンの低下した状態）→ 事故","エラー → スレット → 事故 → UAS","UAS → スレット → エラー → 事故"],"a":0,"e":"TEM（Threat and Error Management）は、スレット（気象の変化・疲労・機材不具合等）がエラーを誘発し、UAS（Undesired Aircraft State＝安全マージンの低下した状態）を経て事故に至る連鎖を断ち切る考え方です。","id":153},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"飲酒に関する記述として、正しいものを1つ選びなさい。","c":["前夜の飲酒でも翌日の操縦時までアルコールの影響を受けている可能性がある","前夜の飲酒であれば翌日の飛行に影響はない","アルコール検知器は実地試験でのみ使用する"],"a":0,"e":"前夜に飲酒した場合でも翌日の操縦時までアルコールの影響を受けている可能性があり、アルコール検知器の活用も有用とされています。","id":154},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"「ハザード」と「リスク」の説明として、正しいものを1つ選びなさい。","c":["ハザード＝事故等につながる可能性のある危険要素／リスク＝運航の安全に影響を与える事象が発生する可能性","ハザード＝事象が発生する可能性／リスク＝危険要素","両者は同じ意味である"],"a":0,"e":"ハザードは潜在的なものを含む危険要素、リスクは運航の安全に影響を与える事象が発生する可能性です。リスクは「予測される頻度×結果の重大性」で計量します。","id":155},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"リスクの計量方法として、正しいものを1つ選びなさい。","c":["予測される頻度（被害の発生確率）×結果の重大性（被害の大きさ）","飛行時間×機体重量","飛行高度÷飛行距離"],"a":0,"e":"リスクは予測される頻度（被害の発生確率）と結果の重大性（被害の大きさ）の積で計量します。","id":156},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"「パラシュートにより地上の被害を低減する」対策の位置づけとして、正しいものを1つ選びなさい。","c":["事象の発生確率を低減する対策","事象発生による被害を軽減する対策","ハザードを特定する作業"],"a":1,"e":"信頼性の高い機材の使用は発生確率の低減、パラシュートによる被害低減は被害の軽減にあたります。両方を検討したうえで必要な対策をとります。","id":157},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"飛行領域に加える「危険半径」の考え方として、正しいものを1つ選びなさい。","c":["高度と同じ数値または30mのいずれか長い方","高度と同じ数値または30mのいずれか短い方","一律に50m"],"a":0,"e":"飛行領域に危険半径（高度と同じ数値または30mのいずれか長い方）を加えた範囲を、立入管理措置を講じて無人地帯としたうえで飛行します。","id":158},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"飛行の逸脱防止のための機能として、正しいものを1つ選びなさい。","c":["ジオフェンス機能により飛行禁止空域を設定する","リモートID機能により飛行範囲を制限する","フェールセーフ機能により飛行禁止空域を解除する"],"a":0,"e":"ジオフェンス機能で飛行禁止空域を設定し、機体に取り付けたセンサによる衝突防止機能で周囲の障害物を認識・回避します。","id":159},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"運航体制に関する記述として、正しいものを1つ選びなさい。","c":["操縦と安全管理の役割を分割する目的で、操縦者に加えて安全管理者を配置することが望ましい","操縦者が安全管理も兼ねることが望ましい","安全管理者の配置は法律で義務付けられている"],"a":0,"e":"操縦と安全管理の役割を分割する目的で、操縦者に加えて安全管理者（運航管理者）を配置することが望ましいとされています。","id":160},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"飛行計画策定時に離着陸場について確認すべき事項として、適切でないものを1つ選びなさい。","c":["人の立入りや騒音の影響","コンパスエラーの原因となる構造物の有無","付近の商業施設の営業時間"],"a":2,"e":"離着陸場については、人の立入り・騒音・コンパスエラーの原因となる構造物がないかを確認します。","id":161},{"ch":6,"sec":"6.2 気象","q":"北半球における高気圧の風の吹き方として、正しいものを1つ選びなさい。","c":["反時計回りに中心へ吹き込む","時計回りに中心から外へ吹き出す","中心へ向かって直線的に吹き込む"],"a":1,"e":"北半球の高気圧は時計回りに中心から外へ吹き出し（等圧線と約30度）、中心部は下降気流のため一般に天気はよくなります。低気圧は反時計回りに吹き込み、中心部は上昇気流で天気が悪くなります。","id":162},{"ch":6,"sec":"6.2 気象","q":"標準大気圧（1気圧）として、正しいものを1つ選びなさい。","c":["1003hPa","1013hPa","1113hPa"],"a":1,"e":"標準大気圧（1気圧）は1013hPaです。等圧線の間隔が狭いほど風は強くなります。","id":163},{"ch":6,"sec":"6.2 気象","q":"寒冷前線の特徴として、正しいものを1つ選びなさい。","c":["発達した積乱雲により突風や雷を伴い、短時間で断続的に強い雨が降る","層状の厚い雲が次第に広がり、弱い雨が絶え間なく降る","気団同士の勢力が変わらずほぼ同じ位置に留まる"],"a":0,"e":"寒冷前線は積乱雲により突風や雷を伴い短時間で強い雨が降ります。通過後は風が西〜北西よりに急変し気温が下がります。層状の雲と弱い雨は温暖前線の特徴です。","id":164},{"ch":6,"sec":"6.2 気象","q":"閉塞前線の説明として、正しいものを1つ選びなさい。","c":["寒冷前線が温暖前線に追いついた前線","温暖前線が寒冷前線から離れた前線","気団同士の勢力が変わらず留まる前線"],"a":0,"e":"閉塞前線は寒冷前線が温暖前線に追いついた前線で、閉塞が進むと低気圧の勢力が弱くなります。気団の勢力が変わらず留まるのは停滞前線です。","id":165},{"ch":6,"sec":"6.2 気象","q":"停滞前線に該当するものを1つ選びなさい。","c":["梅雨前線・秋雨前線","寒冷前線","閉塞前線"],"a":0,"e":"梅雨前線や秋雨前線は停滞前線です。気団同士の勢力が変わらずほぼ同じ位置に留まり、長雨をもたらします。","id":166},{"ch":6,"sec":"6.2 気象","q":"「北の風」が意味するものとして、正しいものを1つ選びなさい。","c":["北へ向かって吹く風","北から南へ吹いてくる風","北の地域で観測された風"],"a":1,"e":"風向は風が吹いてくる方向を表します。「北の風」は北から南へ吹く風です。360度を16等分して表し、観測は16または36方位、予報は8方位で表します。","id":167},{"ch":6,"sec":"6.2 気象","q":"気象庁の定義における「風速」として、正しいものを1つ選びなさい。","c":["観測時の前10分間における平均風速","観測時の瞬間の風速","観測時の前1時間における平均風速"],"a":0,"e":"風速は観測時の前10分間における平均風速です。平均風速の最大値が最大風速、瞬間風速の最大値が最大瞬間風速で、単位はm/sです。","id":168},{"ch":6,"sec":"6.2 気象","q":"気象庁の風力階級（ビューフォート風力階級）の階級数として、正しいものを1つ選びなさい。","c":["0〜10の11階級","0〜12の13階級","1〜12の12階級"],"a":1,"e":"風力階級は0〜12の13階級です。","id":169},{"ch":6,"sec":"6.2 気象","q":"高度による風速の変化に関する記述として、正しいものを1つ選びなさい。","c":["風は地面の摩擦を受けるため、上空では強く地表に近づくにつれ弱くなる","風は地表に近いほど強く、上空では弱くなる","風速は高度によって変化しない"],"a":0,"e":"風は地面の摩擦を受けるため上空では強く、地表に近づくにつれ弱くなります。地表の粗度が大きいほど高さによる変化は大きくなります。","id":170},{"ch":6,"sec":"6.2 気象","q":"海陸風に関する記述として、正しいものを1つ選びなさい。","c":["日中は陸に向かって、夜間は海に向かって吹く","日中は海に向かって、夜間は陸に向かって吹く","一日を通じて陸から海へ吹き続ける"],"a":0,"e":"海陸風は日中は陸に向かって、夜間は海に向かって吹きます。入れ替わりの時間帯はほぼ無風となり、朝凪・夕凪と呼ばれます。","id":171},{"ch":6,"sec":"6.2 気象","q":"山谷風に関する記述として、正しいものを1つ選びなさい。","c":["昼間は谷を這い上がる谷風、夜間は山から降りる山風が吹く","昼間は山から降りる山風、夜間は谷を這い上がる谷風が吹く","昼夜を通じて同じ方向に吹く"],"a":0,"e":"昼間は谷を這い上がる谷風、夜間は山から降りてくる山風が吹きます。","id":172},{"ch":6,"sec":"6.2 気象","q":"ダウンバーストに関する記述として、正しいものを1つ選びなさい。","c":["積乱雲内の強烈な下降流が地表にぶつかり水平にドーナツ状に広がる現象である","高気圧の中心付近で発生する穏やかな下降流である","海陸風の入れ替わり時に発生する現象である"],"a":0,"e":"ダウンバーストは積乱雲内の強烈な下降流が地表にぶつかり水平にドーナツ状に広がる現象で、大きさは数百m〜10km、発生時間は数分〜10分程度です。直径4km程度以下のものをマイクロバーストと呼びます。","id":173},{"ch":6,"sec":"6.2 気象","q":"雲の10種雲形のうち上層雲に分類されるものを1つ選びなさい。","c":["巻雲・巻層雲・巻積雲","高層雲・乱層雲・高積雲","積雲・積乱雲・層積雲"],"a":0,"e":"上層雲は巻雲・巻層雲・巻積雲、中層雲は高層雲・乱層雲・高積雲、低層雲と下層から発達する雲は積雲・積乱雲・層積雲・層雲です。","id":174},{"ch":6,"sec":"6.2 気象","q":"「目視により常時監視して飛行させること」と気象の関係として、正しいものを1つ選びなさい。","c":["近距離であっても雲中や濃霧等、目視で確認できない気象状態では飛行させてはならない","目視可能な距離内であれば濃霧の中でも飛行できる","気象状態は目視の要件とは関係がない"],"a":0,"e":"目視の要件は、目視可能な距離外での飛行を禁止するだけでなく、近距離であっても雲中や濃霧等、目視で確認できない気象状態では飛行させてはならないことを意味します。","id":175},{"ch":6,"sec":"6.2 気象","q":"地表面の状態と気流に関する記述として、正しいものを1つ選びなさい。","c":["広い面積の太陽光パネルやアスファルトの市街地では上昇気流の発生に注意する","アスファルトの地表面が暖められると下降気流が発生し機体が減速する","高温時は空気密度が増加し飛行性能が向上する"],"a":0,"e":"地表面が暖められると上昇気流が発生します。広い面積の太陽光パネルやアスファルト・コンクリートの市街地、強い日射の運動場ではつむじ風の発生にも注意します。","id":176},{"ch":6,"sec":"6.3 機体別のリスク","q":"離着陸地点と操縦者・補助者との推奨距離の組合せとして、正しいものを1つ選びなさい。","c":["マルチローター3m以上／飛行機・ヘリコプター20m以上","マルチローター20m以上／飛行機・ヘリコプター3m以上","いずれも30m以上"],"a":0,"e":"操縦者・補助者との距離はマルチローターで3m以上、飛行機・ヘリコプターで20m以上が推奨されます。周囲の物件との距離はいずれも30m以上です。","id":177},{"ch":6,"sec":"6.3 機体別のリスク","q":"飛行機（固定翼機）の運航上の特徴として、誤っているものを1つ選びなさい。","c":["ホバリングができないため上空待機はサークルを描く旋回飛行となる","緊急着陸は滑空で行うため広範囲のエリアが必要である","最小旋回半径が小さく狭い場所でも旋回できる"],"a":2,"e":"飛行機は回転翼機より広い離着陸エリアが必要で、飛行中の最小旋回半径も大きくなります。地上風速だけでなく上空の風速の確認も重要です。","id":178},{"ch":6,"sec":"6.3 機体別のリスク","q":"オートローテーション機構に関する記述として、正しいものを1つ選びなさい。","c":["動力が停止しても軟着陸が可能となる機構で、必要な操作・高度範囲・速度範囲がある","動力停止時に自動的にパラシュートを展開する機構である","マルチローター特有の姿勢制御機構である"],"a":0,"e":"ヘリコプターのオートローテーション機構があれば動力停止でも軟着陸が可能ですが、必要な操作・高度範囲・速度範囲があります。","id":179},{"ch":6,"sec":"6.3 機体別のリスク","q":"最大離陸重量25kg以上の大型機の運航上の注意として、正しいものを1つ選びなさい。","c":["慣性力が大きく増速・減速・上昇・降下に要する時間と距離が長いため障害物回避に特に注意する","慣性力が小さいため小型機より障害物回避が容易である","騒音が小さいため事前説明は不要である"],"a":0,"e":"大型機は事故発生時の影響が大きく、慣性力が大きいため増速・減速・上昇・降下に要する時間と距離が長くなります。緊急着陸地点は河川敷や農用地など第三者の進入が少ない場所を選び、近隣エリアへの事前説明・調整も計画します。","id":180},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"夜間飛行における注意として、誤っているものを1つ選びなさい。","c":["原則として目視外飛行は実施しない","離着陸地点や緊急着陸予定地点には照明が必要である","昼間より周囲が静かなため、事前の訓練は不要である"],"a":2,"e":"夜間飛行は機体の姿勢・方向の視認や周囲の安全確認が昼間より困難です。操縦者は事前に第三者の立入りの無い安全な場所で訓練を実施します。","id":181},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"目視外飛行（補助者あり）で求められる機体の要件として、誤っているものを1つ選びなさい。","c":["自動操縦システムを装備し、機体外の様子を監視できるカメラ等を有すること","地上において機体の位置及び異常の有無を把握できること","第三者に危害を加えないことを製造事業者等が証明した機能を有すること"],"a":2,"e":"製造事業者等による危害防止機能の証明は、補助者を配置しない目視外飛行で追加される要件です。補助者ありの場合は自動操縦システム、監視カメラ等、地上での位置・異常の把握、フェールセーフ機能の正常作動が求められます。","id":182},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"目視外飛行におけるフェールセーフ機能の例として、適切でないものを1つ選びなさい。","c":["電波が断絶した場合の自動帰還又は空中での位置維持","GNSSの異常時における位置維持や安全な自動着陸","バッテリー残量が減少した場合の飛行速度の自動上昇"],"a":2,"e":"フェールセーフの例は、電波断絶時の自動帰還・位置維持、GNSS異常時の位置維持や安全な自動着陸、電池の電圧・容量・温度異常時の発煙発火防止と自動帰還又は安全な自動着陸です。","id":183},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機を飛行させる者が最も優先すべき事項として、正しいものを1つ選びなさい。","c":["依頼主から求められた撮影内容を完遂すること","第三者に危害を及ぼさないよう安全を確保すること","機体の性能を最大限に引き出して飛行させること"],"a":1,"e":"操縦者はいかなる場合も安全の確保を最優先します。依頼内容の達成や機体性能の発揮は、安全が確保されたうえではじめて追求すべきものです。","id":184},{"ch":2,"sec":"2.1 役割と責任","q":"補助者を配置して飛行させる場合の考え方として、正しいものを1つ選びなさい。","c":["補助者を置けば、飛行の安全に関する責任は補助者と折半になる","補助者を置いても、飛行の安全に関する最終的な責任は操縦者が負う","補助者を置いた場合、操縦者は機体の操作のみに責任を負う"],"a":1,"e":"補助者は操縦者を補助する立場であり、飛行の安全に関する最終的な責任は操縦者が負います。補助者を置くこと自体は責任の移転を意味しません。","id":185},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の飛行に関して操縦者が遵守すべき法令の範囲として、正しいものを1つ選びなさい。","c":["航空法のみを遵守すればよい","航空法のほか、電波法、道路交通法、民法、各自治体の条例等も遵守する","国の法律のみが対象であり、自治体の条例は対象外である"],"a":1,"e":"無人航空機の飛行には航空法以外にも、電波法、小型無人機等飛行禁止法、道路交通法、民法、個人情報保護法、各自治体の条例などが関係します。飛行場所ごとに確認が必要です。","id":186},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機による撮影を行う際のプライバシーへの配慮として、正しいものを1つ選びなさい。","c":["屋外での撮影であれば、住宅内部が写り込んでも問題はない","住宅内部やそこに居る人が写り込まないよう、撮影方法に配慮する","公道上空からの撮影であれば、被写体の同意は一切不要である"],"a":1,"e":"上空からの撮影は住宅内部が写り込みやすく、プライバシーや肖像権の侵害となるおそれがあります。撮影角度や公開時の加工など、あらかじめ配慮が必要です。","id":187},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の飛行に伴う損害賠償への備えとして、正しいものを1つ選びなさい。","c":["賠償責任保険への加入が推奨されている","機体認証を受けていれば保険は不要である","技能証明を保有していれば賠償責任は免除される"],"a":0,"e":"第三者に損害を与えた場合に備え、賠償責任保険への加入が推奨されています。機体認証や技能証明は安全性や技能を証明するものであり、賠償責任を免除するものではありません。","id":188},{"ch":2,"sec":"2.1 役割と責任","q":"操縦者が飛行を中止すべき判断について、正しいものを1つ選びなさい。","c":["飛行計画が立てられている以上、多少の不安要素があっても実施する","安全上の疑義が生じた時点で、ためらわず飛行を中止する","依頼主の了承が得られなければ中止してはならない"],"a":1,"e":"安全に疑義が生じた場合は、速やかに飛行を中止する判断が求められます。中止の判断は操縦者の権限であり、依頼主の了承を要件とするものではありません。","id":189},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の飛行に関する情報収集について、正しいものを1つ選びなさい。","c":["一度取得した知識は変わらないため、更新の必要はない","制度や運用は改正されることがあるため、常に最新の情報を確認する","技能証明の有効期間中は情報更新の必要がない"],"a":1,"e":"航空法や関連する制度は改正されることがあります。操縦者は常に最新の法令・通達・教則の内容を確認し、知識を更新し続ける必要があります。","id":190},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機を飛行させる場所の選定について、正しいものを1つ選びなさい。","c":["飛行経路下に第三者が立ち入らないよう、あらかじめ措置を検討する","広い場所であれば、立入りへの措置は不要である","第三者が立ち入った場合は、その者の自己責任となる"],"a":0,"e":"飛行経路下に第三者が入らないよう、立入管理措置をあらかじめ検討します。第三者の立入りによる危険を防ぐ責任は、飛行させる側にあります。","id":191},{"ch":2,"sec":"2.1 役割と責任","q":"操縦者の心得として、機体の取扱説明書の扱いで正しいものを1つ選びなさい。","c":["操作に慣れていれば読む必要はない","記載された制限事項や手順を理解したうえで飛行させる","製造事業者向けの文書であり、操縦者は対象外である"],"a":1,"e":"取扱説明書には機体固有の制限事項や点検手順、推奨される運用条件が記載されています。操縦者はこれを理解したうえで飛行させる必要があります。","id":192},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の飛行が社会に与える影響について、正しいものを1つ選びなさい。","c":["個々の操縦者の行動が、無人航空機全体の社会的信用に影響する","個人の飛行は社会的影響を持たない","業務目的の飛行のみが社会的影響を持つ"],"a":0,"e":"一人の不適切な飛行が、無人航空機の活用全体に対する社会の信頼を損なうことがあります。操縦者は自らの行動が業界全体に影響することを自覚する必要があります。","id":193},{"ch":2,"sec":"2.1 役割と責任","q":"飛行に先立つ周辺住民等への配慮として、最も適切なものを1つ選びなさい。","c":["法令上の義務がなければ、周知は一切不要である","必要に応じて事前に周知し、理解を得るよう努める","飛行後に事後報告すればよい"],"a":1,"e":"法令上の義務でなくとも、飛行の目的や時間帯をあらかじめ周辺へ周知することで、不安や苦情を防ぐことができます。円滑な運航のために望ましい対応です。","id":194},{"ch":2,"sec":"2.1 役割と責任","q":"複数人で運航体制を組む場合の役割分担として、正しいものを1つ選びなさい。","c":["役割は現場で臨機応変に決めればよい","操縦者・補助者等の役割と連絡手段を飛行前に明確にする","全員が操縦者として同等の権限を持つようにする"],"a":1,"e":"誰が操縦者であるか、補助者は何を担当するか、連絡手段は何かを飛行前に明確にしておきます。あいまいなまま飛行を開始すると、緊急時の対応が遅れます。","id":195},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の飛行に関する記録について、正しいものを1つ選びなさい。","c":["飛行日誌への記載は、特定飛行を行う場合に義務付けられている","飛行日誌はすべての飛行で任意の記録である","飛行日誌は機体製造事業者が作成するものである"],"a":0,"e":"特定飛行を行う場合、飛行記録・日常点検記録・点検整備記録からなる飛行日誌の携行と記載が義務付けられています。","id":196},{"ch":2,"sec":"2.1 役割と責任","q":"操縦者が自らの技量を評価する姿勢として、正しいものを1つ選びなさい。","c":["飛行経験が長ければ、技量の確認は不要である","自らの技量を客観的に把握し、能力を超える飛行は行わない","技能証明を保有していれば、あらゆる条件で飛行できる"],"a":1,"e":"経験の長さや資格の保有は、あらゆる条件下での安全を保証しません。自らの技量の限界を把握し、それを超える条件での飛行は避ける必要があります。","id":197},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の飛行によって発生した損害の民事上の責任について、正しいものを1つ選びなさい。","c":["国の許可・承認を受けていれば民事責任は生じない","許可・承認の有無にかかわらず、損害を与えれば民事上の責任を負い得る","損害額が少額であれば責任は生じない"],"a":1,"e":"国の許可・承認は航空法上の手続きであり、民事上の損害賠償責任を免除するものではありません。第三者に損害を与えれば賠償責任を負い得ます。","id":198},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の飛行における操縦者の権限について、正しいものを1つ選びなさい。","c":["飛行の実施・中止の最終判断は操縦者が行う","飛行の実施・中止は運航管理者のみが決定する","飛行の実施・中止は依頼主が決定する"],"a":0,"e":"現場の状況を最もよく把握しているのは操縦者であり、飛行の実施・継続・中止の最終判断は操縦者が行います。","id":199},{"ch":2,"sec":"2.1 役割と責任","q":"個人情報の取扱いについて、無人航空機で撮影した映像の扱いとして正しいものを1つ選びなさい。","c":["撮影した映像に個人が特定できる情報が含まれる場合、適切に管理する","映像データは個人情報に該当しないため、自由に公開してよい","撮影機器内に保存している限り、管理の必要はない"],"a":0,"e":"撮影した映像に特定の個人を識別できる情報が含まれる場合は個人情報として適切に管理し、公開に際しては必要な加工や同意取得を検討します。","id":200},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の騒音への配慮として、正しいものを1つ選びなさい。","c":["騒音規制法の対象外であるため、時間帯を問わず飛行してよい","住宅地に近い場所や早朝・夜間の飛行では、騒音への配慮が必要である","小型機であれば騒音への配慮は不要である"],"a":1,"e":"無人航空機の回転音は近隣にとって騒音となり得ます。住宅地の近くや早朝・夜間の飛行では、時間帯や高度、経路に配慮することが求められます。","id":201},{"ch":2,"sec":"2.1 役割と責任","q":"操縦者が負う刑事上の責任について、正しいものを1つ選びなさい。","c":["無人航空機による事故では刑事責任を問われることはない","過失により人を死傷させた場合、刑事責任を問われることがある","技能証明を保有する者は刑事責任を免除される"],"a":1,"e":"無人航空機の操縦上の過失により人を死傷させた場合には、刑事上の責任を問われることがあります。資格の保有は免責の理由になりません。","id":202},{"ch":2,"sec":"2.1 役割と責任","q":"他人の土地の上空を飛行させる場合の考え方として、正しいものを1つ選びなさい。","c":["上空は誰のものでもないため、常に自由に飛行できる","土地所有権は上空にも及ぶとされ、必要に応じて土地所有者の了解を得る","航空法上の許可があれば、土地所有者の了解は一切不要である"],"a":1,"e":"民法上、土地の所有権はその上下に及ぶとされています。低い高度で他人の土地上空を飛行する場合は、土地所有者の了解を得ることが望まれます。","id":203},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機を他人に貸与する場合の心得として、正しいものを1つ選びなさい。","c":["貸与すれば、以後の飛行に関する責任は一切生じない","機体の状態や使用上の注意を伝え、適切に使用されるよう配慮する","貸与先が資格を持っていれば、機体の状態を伝える必要はない"],"a":1,"e":"機体を貸与する場合も、機体の整備状態や制限事項、注意点を適切に伝える配慮が必要です。整備不良を隠したまま貸与すれば、貸与側の責任も問われ得ます。","id":204},{"ch":2,"sec":"2.1 役割と責任","q":"操縦者の心得としての「飛行の目的」の考え方について、正しいものを1つ選びなさい。","c":["業務目的の飛行は趣味の飛行より高い安全水準が求められる","趣味の飛行は業務目的より低い安全水準でよい","飛行目的にかかわらず、求められる安全水準は同じである"],"a":2,"e":"求められる安全水準は飛行の目的によって変わりません。趣味であっても業務であっても、第三者に危害を及ぼさないための準備と配慮は同じ水準で必要です。","id":205},{"ch":2,"sec":"2.1 役割と責任","q":"無人航空機の運航に関する組織的な安全管理について、正しいものを1つ選びなさい。","c":["ヒヤリハット事例を共有し、再発防止に活かすことが望ましい","事故に至らなかった事例は記録する必要がない","安全管理は操縦者個人の心掛けのみで足りる"],"a":0,"e":"事故に至らなかったヒヤリハット事例にも、重大事故につながる要因が含まれています。組織として共有・分析し、手順の見直しに活かすことが望まれます。","id":206},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"アルコールの影響下における無人航空機の飛行について、正しいものを1つ選びなさい。","c":["体内にアルコールを保有する状態では飛行させてはならない","基準値未満の血中濃度であれば飛行させてよい","飛行前に休憩を取れば、飲酒後でも飛行させてよい"],"a":0,"e":"航空法は、アルコールまたは薬物の影響により正常な飛行ができないおそれがある間の飛行を禁止しています。無人航空機では体内にアルコールを保有する状態での飛行が禁止されており、基準値の定めはありません。","id":207},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"薬物の影響と無人航空機の飛行について、正しいものを1つ選びなさい。","c":["医師から処方された薬であれば、影響を考慮する必要はない","眠気等の副作用がある薬を服用している場合は飛行を控える","市販薬は副作用がないため考慮不要である"],"a":1,"e":"処方薬・市販薬を問わず、眠気や集中力低下といった副作用がある薬を服用している場合は、正常な飛行ができないおそれがあるため飛行を控えます。","id":208},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"操縦者の体調管理について、正しいものを1つ選びなさい。","c":["疲労や睡眠不足は操縦に影響しないため考慮不要である","疲労、睡眠不足、ストレス等は判断力を低下させるため、飛行前に自己評価する","体調不良でも短時間の飛行であれば問題ない"],"a":1,"e":"疲労・睡眠不足・ストレス・空腹などは注意力や判断力を低下させます。飛行前に自らの状態を評価し、万全でなければ飛行を見合わせます。","id":209},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行前に確認すべき事項として、正しいものを1つ選びなさい。","c":["機体の状況、気象、周囲の状況、電波の状況などを確認する","機体のバッテリー残量のみ確認すればよい","前回の飛行で異常がなければ確認は不要である"],"a":0,"e":"飛行前には機体の状況、当該空域の気象、周囲の安全、電波の状況、燃料やバッテリーの搭載量などを確認することが義務付けられています。","id":210},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行中に他の無人航空機を発見した場合の対応として、正しいものを1つ選びなさい。","c":["互いに右に回避することが法令で定められている","衝突を予防するため、地上に降下させるなど適切な措置をとる","先に飛行していた側に進路権があるため、そのまま飛行を続ける"],"a":1,"e":"航空法は衝突
