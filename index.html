/* ---------- session ---------- */
function startSession(o){
  const ids = o.ids.slice(0, o.limit || o.ids.length);
  session = { mode:o.mode, title:o.title, back:o.back||"home",
    items: ids.map(id=>({id, order:shuffle([0,1,2]), pick:null})),
    i:0, revealed:false, done:false, left: o.mode==="mock"? MOCK_SEC : null, startedAt: Date.now(),
    qAt: Date.now(), pace: [] };
  if(timerId){ clearInterval(timerId); timerId=null; }
  if(session.mode==="mock"){
    timerId = setInterval(()=>{
      if(!session || session.done){ clearInterval(timerId); timerId=null; return; }
      session.left--;
      if(session.left<=0){ finishMock(); return; }
      const t=$("#tmr"); if(t){ t.textContent=mmss(session.left); t.classList.toggle("hot", session.left<=300); }
    },1000);
  }
  keepAwake(session.mode==="mock");
  markDay(); render(); window.scrollTo(0,0);
}
function answer(k){
  const it = session.items[session.i], q = byId(it.id);
  if(session.mode==="mock") session.pace[session.i] = Math.round((Date.now()-session.qAt)/1000);
  it.pick = k;
  if(session.mode==="mock"){ nextQ(); return; }
  session.revealed = true;
  const r = qs(it.id); r.s=1; const ok = (k===q.a); ok ? r.o++ : r.x++; schedule(r, ok); save();
  setBadge();
  render();
}
function nextQ(){
  if(session.i < session.items.length-1){ session.i++; session.revealed=false; session.qAt=Date.now(); render(); window.scrollTo(0,0); }
  else if(session.mode==="mock") finishMock();
  else { session.done=true; if(timerId){clearInterval(timerId);timerId=null;} setBadge(); render(); window.scrollTo(0,0); }
}
function finishMock(){
  if(timerId){ clearInterval(timerId); timerId=null; }
  keepAwake(false);
  let score=0;
  session.items.forEach(it=>{ const q=byId(it.id), r=qs(it.id); r.s=1; const ok=(it.pick===q.a); if(ok){score++;r.o++;} else r.x++; schedule(r, ok); });
  session.done=true; session.score=score;
  S.mocks.push({d:today(), s:score, n:session.items.length, t:Math.round((Date.now()-session.startedAt)/1000),
    p: session.pace.map(v=> (typeof v==="number" && v>=0 && v<600) ? v : 0)});
  S.mocks = S.mocks.slice(-30); save(); setBadge(); render(); window.scrollTo(0,0);
}

/* ---------- components ---------- */
function gauge(){
  const cx=66, cy=68, r=46, C=2*Math.PI*r, SW=C*(240/360), GAP=2.5;
  const total = DATA.Q.length;
  let acc=0, segs="", ticks="";
  for(let i=0;i<=8;i++){
    const a=(150+i*30)*Math.PI/180, maj=i%2===0, r1=r+8, r2=r+(maj?13:10);
    ticks += '<line x1="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r1).toFixed(1)
          +'" x2="'+(cx+Math.cos(a)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r2).toFixed(1)
          +'" stroke="'+(maj?"var(--muted)":"var(--rule)")+'" stroke-width="'+(maj?1.3:1)+'" stroke-linecap="round"/>';
  }
  const arc=(off,len,col,cls)=>'<circle'+(cls?' class="'+cls+'"':'')+' cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col
    +'" stroke-width="10" stroke-dasharray="'+Math.max(0,len).toFixed(1)+' '+C.toFixed(1)
    +'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(150 '+cx+' '+cy+')"/>';
  [2,3,4,5,6].forEach(ch=>{
    const c=chStats(ch), seg=SW*(c.n/total), len=Math.max(0,seg-GAP);
    segs += arc(acc, len, 'var(--c'+ch+'w)');
    segs += arc(acc, len*(c.seen/c.n), 'var(--c'+ch+')', 'arcv');
    acc += seg;
  });
  const o = overall();
  return '<svg viewBox="0 0 132 108" role="img" aria-label="習得度 '+o.mastery+'パーセント">'+ticks+segs
    + '<text x="'+cx+'" y="'+(cy-1)+'" text-anchor="middle" fill="var(--ink)" font-family="UA Mono, monospace" font-size="30" font-weight="700" letter-spacing="-1">'+o.mastery+'</text>'
    + '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" fill="var(--muted)" font-family="UA Mono, monospace" font-size="8.5" letter-spacing="1.8">MASTERY %</text></svg>';
}
const bar = p => '<div class="bar"><i style="width:'+p+'%"></i></div>';
function chrows(get){
  return [2,3,4,5,6].map(ch=>{
    const c = chStats(ch), o = get? get(ch):null;
    const tag = o? 'button class="chrow" '+o+' '+chv(ch) : 'div class="chrow" '+chv(ch);
    return '<'+tag+'><span class="idx">'+pad2(ch)+'</span>'
      + '<span><span class="nm"><span>'+CH[ch]+'</span><em>'+c.seen+'/'+c.n+'</em></span>'+bar(c.seen/c.n*100)+'</span>'
      + '<span class="pct">'+(c.seen?c.rate+"%":"—")+'</span></'+(o?'button':'div')+'>';
  }).join("");
}

function numParse(s){
  s = String(s||"").replace(/[０-９．－]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，、\s]/g,"");
  const m = s.match(/-?\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}
function nmRec(c){
  if(!S.nm || typeof S.nm!=="object") S.nm = {};
  return S.nm[c] || (S.nm[c] = {o:0,x:0,l:null});
}
const numMissIds = () => NUM.filter(n=>{ const r=S.nm&&S.nm[n.c]; return r && r.l===0; }).map(n=>n.c);
function numNew(kind){
  const ids = kind==="miss" ? numMissIds() : NUM.map(n=>n.c);
  if(!ids.length) return null;
  return {ids:shuffle(ids), i:0, vals:null, res:null, ok:0, log:[], done:false, focus:false};
}
function numCheck(give){
  const n = NUM.find(x=>x.c===numS.ids[numS.i]);
  const vals = Array.from(document.querySelectorAll(".numin")).map(x=>x.value.trim());
  if(!give && vals.every(v=>!v)){ toast("数値を入力してください"); return; }
  const res = n.a.map((a,k)=> Math.abs(numParse(vals[k]) - a[1]) < 1e-9);
  const ok = res.every(Boolean);
  numS.vals = vals; numS.res = res; numS.log.push(ok); if(ok) numS.ok++;
  const r = nmRec(n.c); ok ? r.o++ : r.x++; r.l = ok ? 1 : 0;
  save(); markDay(); numS.focus = true; render();
}

function mockInsight(){
  const n = session.items.length;
  const lines = [];
  const pace = session.pace || [];
  const used = pace.reduce((a,b)=>a+(b||0),0);
  /* 時間を使いすぎた上位5問 */
  const slow = session.items.map((it,i)=>({i, s: pace[i]||0}))
    .filter(o=>o.s >= TARGET_SEC*2).sort((a,b)=>b.s-a.s).slice(0,5);
  const r = readiness();
  const rows = slow.map(o=>{
    const q = byId(session.items[o.i].id);
    return '<button class="chrow" data-jump="'+o.i+'" '+chv(q.ch)+'>'
      + '<span class="idx">'+mmss(o.s)+'</span>'
      + '<span><span class="nm"><span>'+esc(q.q.length>34 ? q.q.slice(0,34)+"…" : q.q)+'</span><em>第'+o.i+'問</em></span></span>'
      + '<span class="pct">'+o.s+'s</span></button>';
  }).join("");
  const paceRow = '<div class="pacerow"><span class="mono">平均 '+Math.round(used/Math.max(1,n))+'s</span>'
    + '<span class="mono">目安 '+TARGET_SEC+'s</span>'
    + '<span class="mono">60s超 '+pace.filter(s=>s>=60).length+'問</span></div>';

    + '<p class="sub" style="margin:0 0 4px">1問あたりの目安は '+TARGET_SEC+' 秒。時間を使った問題は、読み方の見直し対象です。</p>'

function readinessBlock(r){

  const signs = [0,1,2].map(i=>'<span class="sg'+(i<=r.level?" on "+cls:"")+'"></span>').join("");
  const t = r.trend>0 ? "直近3回は上向き（+"+r.trend+"pt）" : r.trend<0 ? "直近3回は下向き（"+r.trend+"pt）" : "直近3回は横ばい";

    + '<div><div class="lg b" style="margin-bottom:4px">READINESS</div>'
    + '<b style="font-family:var(--fd);font-size:16px">'+label+'</b>'
    + '<div class="sub">直近'+r.n+'回の平均 <b class="mono">'+r.avg+'%</b> ／ '+t+'</div></div>'
    + '<div class="sgs">'+signs+'</div></div>'
    + '<p class="note" style="margin:12px 0 0">過去の模試の平均にもとづく目安です。本番の合否を保証するものではありません。</p></div>';

/* ================= 試験日カウントダウン ================= */
function daysTo(d){
  if(!d) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const x=new Date(d+"T00:00:00"); if(isNaN(x)) return null;
  return Math.round((x-t)/86400000);
}
function countdown(){
  const d = daysTo(S.exam);
  if(d===null) return '<button class="navrow" data-go="settings" style="--cc:var(--c3);--cw:var(--c3w)">'
    + '<span class="idx">'+svg("mock",19)+'</span><span><b>試験日を設定する</b>'
    + '<span class="mt">残り日数と毎日のリマインダーが使えます</span></span><span class="ar">→</span></button>';
  if(d<0) return '';
  const label = d===0 ? "本日が試験日です" : (d===1 ? "試験は明日です" : "試験日まで");
  return '<div class="cd'+(d<=1?" today":"")+'"><div><div class="t">'+(d===0?"TODAY":"D-"+d)+'</div>'
    + '<div class="d">'+(d===0?"当日":d)+(d>0?'<small>日</small>':'')+'</div></div>'
    + '<div><b style="font-family:var(--fd);font-size:15px;display:block">'+label+'</b>'
    + '<div class="s">'+esc(S.exam)+(d>0?' ／ 1日 '+Math.max(1,Math.ceil((DATA.Q.length-overall().seen)/Math.max(1,d)))+' 問ペースで全問踏破':'')+'</div></div></div>';
}

/* ================= 通知（学習リマインダー） ================= */
function notifState(){
  if(!("Notification" in window)) return "unsupported";
  return Notification.permission;  // default / granted / denied
}
async function askNotif(){
  if(!("Notification" in window)) return "unsupported";
  try{ return await Notification.requestPermission(); }catch(e){ return "denied"; }
}
async function showNotif(title, body){
  if(notifState()!=="granted") return false;
  const opts = {body:body, icon:"icons/icon-192.png", badge:"icons/icon-192.png",
    tag:"drone2-reminder", lang:"ja", requireInteraction:false};
  try{
    const reg = await (navigator.serviceWorker ? navigator.serviceWorker.ready : null);
    if(reg && reg.showNotification){ await reg.showNotification(title, opts); return true; }
  }catch(e){}
  try{ new Notification(title, opts); return true; }catch(e){ return false; }
}
function studiedToday(){ return S.days[S.days.length-1]===today(); }
function reminderText(){
  const d = daysTo(S.exam), wk = weakIds().length;
  if(d!==null && d>=0 && d<=7) return d===0 ? "今日が試験日です。落ち着いていきましょう。" : "試験まであと"+d+"日。総まとめの時間です。";
  if(wk) return "苦手な問題が"+wk+"問たまっています。10分だけ回しませんか。";
  return "今日の学習がまだです。10問だけでも進めましょう。";
}
/* アプリを開いた時 / 開いている間 に時刻が来たら通知する */
let rtimer=null;
function scheduleReminder(){
  if(rtimer){ clearTimeout(rtimer); rtimer=null; }
  if(!S.remind || notifState()!=="granted") return;
  const [h,m] = (S.rtime||"20:00").split(":").map(Number);
  const now = new Date(), at = new Date();
  at.setHours(h||20, m||0, 0, 0);
  if(at<=now){
    if(S.rlast!==today() && !studiedToday()){ S.rlast=today(); save(); showNotif("学科試験ドリル", reminderText()); }
    at.setDate(at.getDate()+1);
  }
  const ms = at-now;
  if(ms>0 && ms<2147483647) rtimer = setTimeout(()=>{
    if(S.remind && !studiedToday()){ S.rlast=today(); save(); showNotif("学科試験ドリル", reminderText()); }
    scheduleReminder();
  }, ms);
}
/* 端末がアプリを閉じていても働く定期同期（対応端末のみ） */
async function syncReminderToSW(){
  try{
    const reg = await navigator.serviceWorker.ready;
    if(reg.active) reg.active.postMessage({type:"reminder", on:!!S.remind, time:S.rtime||"20:00",
        lastDay:S.days[S.days.length-1]||"", body:reminderText()});
    if(S.remind && "periodicSync" in reg){
      const st = await navigator.permissions.query({name:"periodic-background-sync"});
      if(st.state==="granted") await reg.periodicSync.register("study-reminder", {minInterval:12*60*60*1000});
    }
  }catch(e){}
}

/* ================= 学習記録の書き出し・読み込み ================= */
function exportData(){
  const json = JSON.stringify({app:"drone2-gakka", ver:1, saved:new Date().toISOString(), data:S}, null, 2);
  /* 埋め込み表示ではファイル保存が使えないため、クリップボードに切り替える */
  let embedded = false;
  try{ embedded = window.self !== window.top; }catch(e){ embedded = true; }
  if(embedded){
    navigator.clipboard.writeText(json)
      .then(()=> toast("学習記録をクリップボードにコピーしました"))
      .catch(()=> toast("この表示ではファイルに保存できません"));
    return;
  }
  const blob = new Blob([json], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "学科試験_学習記録_"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("学習記録を書き出しました");
}
function importData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      const d = j && j.data ? j.data : j;
      if(!d || typeof d.q !== "object") throw 0;
      if(!confirm("読み込むと今の学習記録は置き換わります。よろしいですか？")) return;
      S = Object.assign(blank(), d); save(); applyTheme(); setBadge(); render();
      toast("学習記録を読み込みました");
    }catch(e){ toast("このファイルは読み込めませんでした"); }
  };
  r.readAsText(file);
}
function toast(msg){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role","status"); el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

    + '<div class="r"><span class="lb"><b>毎日のリマインダー</b><span class="h">その日まだ学習していなければ知らせます</span></span>'
      + '<button class="sw" role="switch" aria-checked="'+(S.remind?"true":"false")+'" data-remind="1" aria-label="リマインダー"></button></div>'
    + '<div class="r"><span class="lb"><b>通知する時刻</b><span class="h">毎日この時刻に確認します</span></span>'
      + '<input type="time" id="remindTime" value="'+esc(S.rtime||"20:00")+'"></div>'
    + '<div class="r"><span class="lb"><b>テスト通知</b><span class="h">いま届くか試してみる</span></span>'
      + '<button class="btn" data-testn="1">送ってみる</button></div>'
  + '</div>'
  + '<p class="sub" style="margin:9px 2px 0">Androidやパソコンにインストールした場合は、アプリを閉じていても届きます。iPhoneではアプリを開いている間の通知になります。</p></section>'

  + '<section><div class="lg v">学習記録</div><div class="set">'
    + '<div class="r"><span class="lb"><b>書き出し</b><span class="h">JSONファイルとして保存します</span></span>'
      + '<button class="btn" data-export="1">書き出す</button></div>'
    + '<div class="r"><span class="lb"><b>読み込み</b><span class="h">別の端末やブラウザの記録を引き継げます</span></span>'
      + '<label class="btn" for="impFile" style="cursor:pointer">ファイルを選ぶ</label>'
      + '<input type="file" id="impFile" accept="application/json,.json" hidden></div>'
    + '<div class="r"><span class="lb"><b>すべて消す</b><span class="h">解答履歴・模試結果・ブックマークを削除します</span></span>'
      + '<button class="btn" data-reset="1">リセット</button></div>'
  + '</div></section>'

  + '<section><div class="lg">STATUS</div><div class="set">'
    + '<div class="r"><span class="lb"><b>オフライン対応</b><span class="h">電波がなくても全機能が使えます</span></span>'
      + (navigator.serviceWorker && navigator.serviceWorker.controller ? '<span class="pill on">有効</span>' : '<span class="pill off">待機中</span>')+'</div>'
    + '<div class="r"><span class="lb"><b>インストール状態</b><span class="h">ホーム画面から全画面で起動できます</span></span>'
      + (inst? '<span class="pill on">アプリとして起動中</span>':'<span class="pill off">ブラウザで表示中</span>')+'</div>'
    + '<div class="r"><span class="lb"><b>収録数</b><span class="h">教則 第5版（令和8年7月14日適用）準拠</span></span>'
      + '<span class="mono" style="font-size:12.5px">問題'+DATA.Q.length+' / カード'+DATA.C.length+' / 数値'+NUM.length+'</span></div>'
    + '<div class="r"><span class="lb"><b>復習の進み具合</b><span class="h">1→3→7→14→30→60日の間隔で出し直します</span></span>'
      + '<span class="mono" style="font-size:12.5px">今日'+dueIds().length+' / 定着'+settled()+'</span></div>'
    + '<div class="r"><span class="lb"><b>つまずきの傾向</b><span class="h">間違えた理由の記録から集計します</span></span>'
      + '<span class="mono" style="font-size:12.5px">'+(function(){const t=topReason(); return t? esc(t.label)+" "+t.pct+"%" : "記録なし";})()+'</span></div>'
    + '<div class="r"><span class="lb"><b>1問あたりの目安</b><span class="h">本番は50問30分。時間配分の基準にします</span></span>'
      + '<span class="mono" style="font-size:12.5px">'+TARGET_SEC+' 秒</span></div>'
  + '</div></section></div>';
}

/* ---------- events ---------- */
$("#view").addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-ch],[data-size],[data-mix],[data-fresh],[data-startmock],[data-rev],[data-reset],[data-cat],[data-cnav],[data-cshuffle],[data-pick],[data-next],[data-prev],[data-quit],[data-bm],[data-jump],[data-again],[data-share],[data-askn],[data-testn],[data-remind],[data-export],[data-examclear],[data-due],[data-secx],[data-rz],[data-daily],[data-pace],[data-tlink],[data-print],[data-miss],[data-clearz],[data-cmode],[data-ncheck],[data-nnext],[data-nstart],[data-numgo]");
  if(!t) return;
  const d = t.dataset;
  if(session){
    if(d.rz){
      const r = qs(session.items[session.i].id);
      if(r.rz===d.rz){ r.rz=null; r.nz=0; } else { r.rz=d.rz; r.nz=(r.nz||0)+1; }
      save(); render(); return;
    }
    if(d.pick!==undefined){ answer(+d.pick); return; }
    if(d.next){ nextQ(); return; }
    if(d.prev){ if(session.i>0){ session.i--; session.revealed=false; session.qAt=Date.now(); render(); window.scrollTo(0,0);} return; }
    if(d.bm){ const r=qs(session.items[session.i].id); r.b = r.b?0:1; save(); render(); return; }
    if(d.jump!==undefined){ session.done=false; session.i=+d.jump; session.revealed=true; session.mode="drill"; render(); window.scrollTo(0,0); return; }
    if(d.share){
      const sc = session.items.filter(it=>it.pick===byId(it.id).a).length;
      shareResult(sc, session.items.length, session.mode==="mock"); return;
    }
    if(d.again){ startSession({mode:session.mode, title:session.title, back:session.back, ids:shuffle(session.items.map(it=>it.id))}); return; }
    if(d.quit){
      if(session.mode==="mock" && !session.done && !confirm("模擬試験を中断します。解答は保存されません。")) return;
      if(timerId){ clearInterval(timerId); timerId=null; }
      keepAwake(false); go(session.back||"home"); return;
    }
    return;
  }
  if(d.due){
    const ids = dueIds();
    if(!ids.length){ toast("今日の復習はありません"); return; }
    startSession({mode:"drill", title:"今日の復習", ids:shuffle(ids), back:"home"}); return;
  }
  if(d.secx!==undefined){
    const o = secStats()[+d.secx];
    if(o) startSession({mode:"drill", title:"第"+o.ch+"章 "+o.sec, ids:shuffle(o.ids), limit:10, back:"review"});
    return;
  }
  if(d.daily){
    const ids = daily20();
    if(!ids.length){ toast("今日の20問はありません"); return; }
    startSession({mode:"drill", title:"今日の20問", ids:ids, back:"home"}); return;
  }
  if(d.pace){
    const s = paceStats();
    if(!s){ toast("模試を受けると記録されます"); return; }
    showSheet("時間配分", paceBody());
    return;
  }
  if(d.tlink){
    const ch = +d.tlink;
    const idx = textChIndex(ch);
    if(idx<0){ toast("教則ダイジェストに該当章がありません"); return; }
    pendingTextCh = ch; go("text"); return;
  }
  if(d.clearz){
    if(!confirm("記録した誤答の理由をすべて消しますか？")) return;
    DATA.Q.forEach(q=>{ const r=S.q[q.id]; if(r){ r.rz=null; r.nz=0; } });
    save(); render(); toast("理由の記録を消しました"); return;
  }
  if(d.miss){
    const ids = wrongIds();
    if(!ids.length){ toast("間違えた問題はまだありません"); return; }
    showSheet("間違えた問題", '<p class="sub" style="margin:0 0 10px">全 '+ids.length+' 問。印刷後は閉じてください。</p>'
      + '<div class="misslist">'+ids.map(id=>{
          const q = byId(id);
          return '<div class="missitem"><p>'+esc(q.q)+'</p><em>'+esc(q.c[q.a])+' ／ CH.'+pad2(q.ch)+' '+esc(q.sec)+'</em></div>';
        }).join("")+'</div>');
    return;
  }
  if(d.cmode){ cardMode = d.cmode==="num" ? "num" : "flip"; cardFlip=false; render(); return; }
  if(d.numgo){ cardMode="num"; numS=numNew("all"); go("card"); return; }
  if(d.nstart){
    const ns = numNew(d.nstart);
    if(!ns){ toast("まちがえた数値はありません"); return; }
    numS = ns; numS.focus = true; render(); window.scrollTo(0,0); return;
  }
  if(d.ncheck){ if(numS && !numS.vals) numCheck(d.ncheck==="give"); return; }
  if(d.nnext){
    if(!numS) return;
    if(numS.i < numS.ids.length-1){ numS.i++; numS.vals=null; numS.res=null; numS.focus=true; }
    else numS.done = true;
    render(); window.scrollTo(0,0); return;
  }
  if(d.print){ window.print(); return; }
  if(d.go){ go(d.go); return; }
  if(d.askn){ askNotif().then(()=>{ scheduleReminder(); syncReminderToSW(); render(); }); return; }
  if(d.testn){
    (notifState()==="granted" ? Promise.resolve("granted") : askNotif()).then(st=>{
      if(st!=="granted"){ toast("通知が許可されていません"); render(); return; }
      showNotif("学科試験ドリル", reminderText()).then(ok=> toast(ok? "通知を送りました":"通知を出せませんでした"));
      render();
    });
    return;
  }
  if(d.remind){
    if(!S.remind && notifState()!=="granted"){
      askNotif().then(st=>{ if(st==="granted"){ S.remind=1; save(); scheduleReminder(); syncReminderToSW(); }
                            else toast("通知が許可されていません"); render(); });
      return;
    }
    S.remind = S.remind?0:1; save(); scheduleReminder(); syncReminderToSW(); render(); return;
  }
  if(d.export){ exportData(); return; }
  if(d.examclear){ S.exam=""; save(); render(); return; }
  if(d.size!==undefined){ drillSize = +d.size; render(); return; }
  if(d.ch){
    const ch=+d.ch, pool=shuffle(DATA.Q.filter(q=>q.ch===ch).map(q=>q.id));
    startSession({mode:"drill", title:"第"+ch+"章 "+CH[ch], ids:pool, limit: drillSize||pool.length, back:"drill"}); return;
  }
  if(d.mix){ startSession({mode:"drill", title:"全章ランダム", ids:shuffle(DATA.Q.map(q=>q.id)), limit:+d.mix, back:"drill"}); return; }
  if(d.fresh){ startSession({mode:"drill", title:"未解答から", ids:shuffle(freshIds()), limit:20, back:"drill"}); return; }
  if(d.startmock){
    let ids=[];
    Object.keys(MOCK_MIX).forEach(ch=>{ ids = ids.concat(shuffle(DATA.Q.filter(q=>q.ch===+ch).map(q=>q.id)).slice(0,MOCK_MIX[ch])); });
    startSession({mode:"mock", title:"模擬試験", ids:shuffle(ids), back:"mock"}); return;
  }
  if(d.rev){
    const m = {due:dueIds, wrong:wrongIds, weak:weakIds, bm:bmIds, fresh:freshIds}[d.rev];
    const names = {due:"今日の復習", wrong:"間違えた問題", weak:"苦手な問題", bm:"ブックマーク", fresh:"未解答"};
    startSession({mode:"drill", title:names[d.rev], ids:shuffle(m()), back:"review"}); return;
  }
  if(d.reset){
    if(confirm("解答履歴・模試結果・ブックマークをすべて消します。よろしいですか？")){ const th=S.theme; S=blank(); S.theme=th; save(); render(); }
    return;
  }
  if(d.cat!==undefined){ cardCat=d.cat; cardIdx=0; cardFlip=false; cardOrder=null; render(); return; }
  if(d.cnav){ const pool=cardPool(); cardIdx=(cardIdx + +d.cnav + pool.length)%pool.length; cardFlip=false; render(); return; }
  if(d.cshuffle){ cardPool(); cardOrder=shuffle(cardOrder); cardOrder.cat=cardCat; cardIdx=0; cardFlip=false; markDay(); render(); return; }
});

function afterRender(){
  const v = $("#view"), fc = $("#fc");
  const ed = $("#examDate");
  if(ed) ed.addEventListener("change", ()=>{ S.exam = ed.value || ""; save(); toast(S.exam? "試験日を設定しました":"試験日を消しました"); render(); });
  const rt = $("#remindTime");
  if(rt) rt.addEventListener("change", ()=>{ S.rtime = rt.value || "20:00"; S.rlast=""; save(); scheduleReminder(); syncReminderToSW(); toast("通知時刻を "+S.rtime+" にしました"); });
  const imp = $("#impFile");
  if(imp) imp.addEventListener("change", ()=>{ if(imp.files && imp.files[0]) importData(imp.files[0]); imp.value=""; });
  if(fc){
    const flip = ()=>{ cardFlip=!cardFlip; fc.classList.toggle("flip", cardFlip); markDay(); };
    fc.addEventListener("click", flip);
    fc.addEventListener("keydown", ev=>{ if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); flip(); } });
  }
  const nins = Array.from(v.querySelectorAll(".numin:not(:disabled)"));
  nins.forEach((inp,k)=>inp.addEventListener("keydown", ev=>{
    if(ev.key!=="Enter" || ev.isComposing) return;
    ev.preventDefault();
    if(k < nins.length-1) nins[k+1].focus(); else numCheck(false);
  }));
  if(numS && numS.focus){
    numS.focus = false;
    const f = nins[0] || v.querySelector("[data-nnext]");
    if(f) f.focus({preventScroll:true});
  }
  v.querySelectorAll(".tbody table").forEach(tb=>{
    if(tb.parentElement.classList.contains("tbl-scroll")) return;
    const w=document.createElement("div"); w.className="tbl-scroll"; tb.parentNode.insertBefore(w,tb); w.appendChild(tb);
  });
}

/* ---------- boot ---------- */
(function(){
  var q = new URLSearchParams(location.search).get("go");
  if(q === "mock"){
    route = "mock";
    var ids = [];
    Object.keys(MOCK_MIX).forEach(function(ch){
      ids = ids.concat(shuffle(DATA.Q.filter(function(x){return x.ch === +ch;}).map(function(x){return x.id;})).slice(0, MOCK_MIX[ch]));
    });
    startSession({mode:"mock", title:"模擬試験", ids:shuffle(ids), back:"mock"});
  } else if(q === "drill"){
    route = "drill";
    startSession({mode:"drill", title:"今日の演習", ids:shuffle(DATA.Q.map(function(x){return x.id;})), limit:10, back:"home"});
  } else if(q === "daily"){
    route = "home";
    var d20 = daily20();
    if(d20.length) startSession({mode:"drill", title:"今日の20問", ids:d20, back:"home"});
    else render();
  } else if(q === "review"){
    route = "review";
    var dids = dueIds();
    if(dids.length) startSession({mode:"drill", title:"今日の復習", ids:shuffle(dids), back:"home"});
    else render();
  } else if(q === "card"){ route = "card"; render(); }
  else { render(); }
  setBadge();
  scheduleReminder();
  if(navigator.serviceWorker) navigator.serviceWorker.ready.then(syncReminderToSW).catch(function(){});
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){ scheduleReminder(); setBadge(); }
  });
})();
</script>
<script>
(function(){
  var ib = document.getElementById('installBtn'), dp = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); dp = e; if(ib) ib.hidden = false; });
  if(ib) ib.addEventListener('click', function(){
    if(!dp) return; ib.hidden = true; dp.prompt(); dp.userChoice.then(function(){ dp = null; });
  });
  window.addEventListener('appinstalled', function(){ dp = null; if(ib) ib.hidden = true; });
  /* 更新通知: 新しい版の sw.js を検知したらバーを出す。押したときだけ再読み込みする */
  function updBar(onGo){
    if(document.getElementById('updbar')) return;
    var bar = document.createElement('div');
    bar.id = 'updbar'; bar.setAttribute('role','status');
    bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:var(--rp);background:var(--ink);color:var(--paper);box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px;max-width:560px;margin:0 auto';
    bar.innerHTML = '<span style="flex:1">アプリの新しい版があります</span>'
      + '<button type="button" id="updgo" style="border:0;border-radius:var(--rp);padding:8px 16px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer">更新する</button>'
      + '<button type="button" id="updno" aria-label="閉じる" style="border:0;background:none;color:inherit;font-size:18px;padding:4px 8px;cursor:pointer">×</button>';
    document.body.appendChild(bar);
    document.getElementById('updno').onclick = function(){ bar.remove(); };
    document.getElementById('updgo').onclick = function(){
      if(typeof session!=='undefined' && session && session.mode==='mock' && !session.done
         && !confirm('模擬試験の途中です。更新すると今回の解答は保存されません。更新しますか？')) return;
      bar.remove(); onGo();
    };
  }
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', function(){
      var wantReload = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(wantReload){ wantReload = false; location.reload(); }
      });
      navigator.serviceWorker.register('./sw.js', {scope:'./', updateViaCache:'none'}).then(function(reg){
        function offer(w){
          if(!w || !navigator.serviceWorker.controller) return;   // 初回インストール時は出さない
          updBar(function(){ wantReload = true; w.postMessage({type:'skipWaiting'}); });
        }
        if(reg.waiting) offer(reg.waiting);
        reg.addEventListener('updatefound', function(){
          var n = reg.installing; if(!n) return;
          n.addEventListener('statechange', function(){ if(n.state === 'installed') offer(n); });
        });
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') reg.update().catch(function(){});
        });
      }).catch(function(){});
    });
  }
})();
</script>
