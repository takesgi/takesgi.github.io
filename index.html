<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="無人航空機の飛行の安全に関する教則 第5版に準拠した、二等無人航空機操縦士 学科試験の対策アプリ。183問の問題演習、本番形式の模擬試験、苦手復習、暗記カード、教則ダイジェストを収録。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15242f" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/jp-400.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/jp-700.woff" as="font" type="font/woff" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学科試験">
<style>@supports(padding:env(safe-area-inset-top)){.topbar{padding-top:calc(9px + env(safe-area-inset-top))}@media(min-width:920px){.tabbar{padding-top:calc(70px + env(safe-area-inset-top))}}}#installBtn{border-color:var(--blue);color:var(--blue);background:var(--blue-wash)}</style>
<title>二等無人航空機操縦士学科試験</title>
<style>
@font-face{font-family:'UA Gothic';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/jp-400.woff') format('woff')}
@font-face{font-family:'UA Gothic';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/jp-700.woff') format('woff')}
@font-face{font-family:'UA Gothic';font-style:normal;font-weight:900;font-display:swap;src:url('fonts/jp-900.woff') format('woff')}
@font-face{font-family:'UA Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/mono-400.woff') format('woff')}
@font-face{font-family:'UA Mono';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/mono-700.woff') format('woff')}

/* ============ tokens ============ */
:root{
  --paper:#eef5f9; --panel:#ffffff; --panel2:#f3f9fc; --sink:#e2eef4;
  --ink:#0b1a24; --ink2:#2f4657; --muted:#6c8698;
  --rule:#c8dae4; --rule2:#e1ecf2; --grid:rgba(16,90,130,.055);
  --blue:#0d7fb8; --blue-ink:#ffffff; --blue-wash:#dceffa;
  --mag:#d6246b; --mag-wash:#fde2ec;
  --ok:#0f9066; --ok-wash:#dbf5ea; --ng:#d43c2e; --ng-wash:#fde5e1;
  --warn:#c08c06; --warn-wash:#fbf0d3;
  --c2:#e2860b; --c2w:#fdf0d8; --c3:#d6246b; --c3w:#fde2ec;
  --c4:#0d8fc7; --c4w:#dbeffb; --c5:#6a4ad6; --c5w:#e9e3fc;
  --c6:#0d9a74; --c6w:#d8f5ec;
  --r:3px;
  --fd:"UA Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --fb:"UA Gothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --fm:"UA Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b1721; --panel:#15242f; --panel2:#1d303d; --sink:#112029;
  --ink:#e9f3f8; --ink2:#bad0dc; --muted:#849cad;
  --rule:#2a4051; --rule2:#203444; --grid:rgba(120,190,230,.06);
  --blue:#4bb8ea; --blue-ink:#04212e; --blue-wash:#123244;
  --mag:#ff80b1; --mag-wash:#36212d;
  --ok:#3fd0a0; --ok-wash:#0e3128; --ng:#f48a7c; --ng-wash:#321e1b;
  --warn:#e7c05d; --warn-wash:#2e2619;
  --c2:#f9ba4b; --c2w:#352a11; --c3:#ff80b1; --c3w:#37222d;
  --c4:#4fc3ed; --c4w:#123342; --c5:#ab96f9; --c5w:#272242;
  --c6:#40d7ab; --c6w:#0e332b;
}}
:root[data-theme="dark"]{
  --paper:#0b1721; --panel:#15242f; --panel2:#1d303d; --sink:#112029;
  --ink:#e9f3f8; --ink2:#bad0dc; --muted:#849cad;
  --rule:#2a4051; --rule2:#203444; --grid:rgba(120,190,230,.06);
  --blue:#4bb8ea; --blue-ink:#04212e; --blue-wash:#123244;
  --mag:#ff80b1; --mag-wash:#36212d;
  --ok:#3fd0a0; --ok-wash:#0e3128; --ng:#f48a7c; --ng-wash:#321e1b;
  --warn:#e7c05d; --warn-wash:#2e2619;
  --c2:#f9ba4b; --c2w:#352a11; --c3:#ff80b1; --c3w:#37222d;
  --c4:#4fc3ed; --c4w:#123342; --c5:#ab96f9; --c5w:#272242;
  --c6:#40d7ab; --c6w:#0e332b;
}

*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.8;
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:30px 30px;background-position:-1px -1px;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--fd);text-wrap:balance;margin:0;letter-spacing:.005em}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ shell ============ */
#shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:12px;padding:9px 16px 8px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;
  background:linear-gradient(90deg,var(--c2) 0 20%,var(--c3) 20% 40%,var(--c4) 40% 60%,var(--c5) 60% 80%,var(--c6) 80% 100%)}
.mark{width:26px;height:26px;flex:none;color:var(--blue)}
.brandtxt{min-width:0}
.brandtxt b{display:block;font-family:var(--fd);font-weight:900;font-size:clamp(13px,3.6vw,17px);
  line-height:1.3;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
.brandtxt span{display:block;font-family:var(--fm);font-weight:400;font-size:9.5px;letter-spacing:.16em;color:var(--muted);line-height:1.4}
.spacer{flex:1}
.hud{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-align:right;line-height:1.35;display:none}
.hud b{display:block;font-size:15px;font-weight:700;color:var(--blue);letter-spacing:.02em}
@media(min-width:460px){.hud{display:block}}
.iconbtn{background:var(--panel2);border:1px solid var(--rule);border-radius:var(--r);width:33px;height:33px;
  display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--blue);border-color:var(--blue)}
main{flex:1;width:100%;max-width:800px;margin:0 auto;padding:22px 16px 116px}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--panel);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--fm);font-size:9.5px;font-weight:500;letter-spacing:.04em;color:var(--muted);
  border-top:2px solid transparent;margin-top:-1px}
.tabbar button svg{width:20px;height:20px}
.tabbar button[aria-current="true"]{color:var(--blue);border-top-color:var(--blue);background:var(--blue-wash)}
@media(min-width:920px){
  .tabbar{top:0;bottom:auto;right:auto;width:98px;height:100vh;border-top:0;border-right:1px solid var(--rule);
    grid-template-columns:1fr;grid-auto-rows:max-content;align-content:start;padding-top:70px}
  .tabbar button{padding:13px 4px;font-size:10px;border-top:0;border-left:2px solid transparent}
  .tabbar button[aria-current="true"]{border-top-color:transparent;border-left-color:var(--blue)}
  #shell{padding-left:98px}
  main{padding-bottom:52px}
}

/* ============ primitives ============ */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.lg{display:flex;align-items:center;gap:9px;font-family:var(--fm);font-size:10px;font-weight:700;
  letter-spacing:.2em;color:var(--mag);margin-bottom:11px}
.lg::before{content:"";width:7px;height:7px;flex:none;background:currentColor}
.lg::after{content:"";flex:1;height:1px;background:var(--rule2)}
.lg.b{color:var(--blue)} .lg.g{color:var(--c6)} .lg.v{color:var(--c5)} .lg.o{color:var(--c2)}
h2.page{font-size:22px;font-weight:900;line-height:1.5;margin:0 0 4px}
.sub{color:var(--muted);font-size:12.5px;line-height:1.75}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);padding:9px 15px;
  font-family:var(--fm);font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.1);color:var(--blue-ink)}
.btn.wide{width:100%;padding:13px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.seg{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;border-left:1px solid var(--rule2);background:none;padding:8px 10px;white-space:nowrap;
  font-family:var(--fm);font-size:11.5px;letter-spacing:.05em;color:var(--muted)}
.seg button:first-of-type{border-left:0}
.seg button[aria-pressed="true"]{background:var(--sw,var(--blue-wash));color:var(--sc,var(--blue));font-weight:700;
  box-shadow:inset 0 -3px 0 var(--sc,var(--blue))}
.seg .cap{font-family:var(--fm);font-size:10px;letter-spacing:.12em;color:var(--muted);padding:8px 11px;
  background:var(--panel2);border-right:1px solid var(--rule);white-space:nowrap;align-self:stretch;display:flex;align-items:center}
.segscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ============ gauge ============ */
.gauge{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
@media(max-width:400px){.gauge{grid-template-columns:114px 1fr;gap:12px}}
.gauge svg{width:100%;height:auto;display:block}
.gauge .arcv{transition:stroke-dasharray .6s cubic-bezier(.3,.85,.3,1)}

/* ============ readout ============ */
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.readout div{padding:12px 8px;text-align:center;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--rw);border-top:3px solid var(--rc)}
.readout b{display:block;font-family:var(--fm);font-size:22px;font-weight:700;line-height:1.15;color:var(--rc)}
.readout span{font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--muted)}

/* ============ activity ============ */
.act{display:flex;gap:3px;margin-top:4px}
.act s{flex:1;height:22px;border-radius:2px;background:var(--sink);border:1px solid var(--rule2);text-decoration:none}
.act s.on{background:var(--c6);border-color:var(--c6)}
.act s.tdy{outline:2px solid var(--mag);outline-offset:1px}
.actlab{display:flex;justify-content:space-between;font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--muted);margin-top:6px}

/* ============ chapter rows ============ */
.chrow{display:grid;grid-template-columns:30px 1fr 44px;gap:11px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule2);padding:11px 0}
.chrow:last-child{border-bottom:0}
.chrow .idx{font-family:var(--fm);font-size:11px;font-weight:700;color:var(--cc);background:var(--cw);
  border:1px solid var(--cc);border-radius:var(--r);height:26px;display:grid;place-items:center}
.chrow .nm{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.chrow .nm em{font-style:normal;font-family:var(--fm);font-size:10.5px;color:var(--muted)}
.chrow .pct{font-family:var(--fm);font-size:13px;font-weight:700;text-align:right;color:var(--cc)}
.bar{height:6px;background:var(--sink);border:1px solid var(--rule2);position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--cc,var(--blue))}
button.chrow:hover .idx{background:var(--cc);color:var(--panel)}

.navrow{display:grid;grid-template-columns:38px 1fr 14px;gap:13px;align-items:center;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:13px 14px}
.navrow:hover{border-color:var(--cc)}
.navrow .idx{width:38px;height:38px;display:grid;place-items:center;background:var(--cw);
  color:var(--cc);border:1px solid var(--cc);border-radius:var(--r)}
.navrow b{display:block;font-family:var(--fd);font-weight:700;font-size:14.5px;line-height:1.5}
.navrow .mt{font-family:var(--fm);font-size:10.5px;letter-spacing:.02em;color:var(--muted)}
.navrow .ar{color:var(--cc);font-family:var(--fm);font-size:13px}

/* ============ flight strip ============ */
.strip{display:flex;align-items:flex-end;gap:2px;height:16px;padding:3px 0;overflow:hidden}
.strip s{display:block;flex:1;min-width:2px;height:7px;background:var(--rule2);text-decoration:none;border-radius:1px}
.strip s.a{background:var(--blue)}
.strip s.o{background:var(--ok)}
.strip s.x{background:var(--ng)}
.strip s.cur{background:var(--mag);height:14px}

/* ============ quiz ============ */
.qtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.qtop .n{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.04em}
.tmr{font-family:var(--fm);font-weight:700;font-size:14px;letter-spacing:.06em;padding:2px 9px;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);color:var(--ink)}
.tmr.hot{background:var(--ng-wash);border-color:var(--ng);color:var(--ng)}
.qsec{display:inline-flex;align-items:center;gap:7px;font-family:var(--fm);font-size:10px;letter-spacing:.1em;
  color:var(--cc);background:var(--cw);border:1px solid var(--cc);border-radius:var(--r);padding:3px 9px;margin:18px 0 10px}
.qtext{font-family:var(--fd);font-weight:700;font-size:17.5px;line-height:1.78;margin:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:13px 14px;
  font-size:14.5px;line-height:1.75}
.opt .k{font-family:var(--fm);font-weight:700;font-size:12px;width:28px;height:28px;border-radius:var(--r);
  display:grid;place-items:center;background:var(--panel2);border:1px solid var(--rule);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:hover:not(:disabled) .k{border-color:var(--blue);color:var(--blue);background:var(--blue-wash)}
.opt.sel{border-color:var(--blue);background:var(--blue-wash)}
.opt.sel .k{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-wash)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ng{border-color:var(--ng);background:var(--ng-wash)}
.opt.ng .k{background:var(--ng);border-color:var(--ng);color:#fff}
.opt:disabled{cursor:default}
.expl{margin-top:16px;border:1px solid var(--rule);border-top-width:3px;border-radius:var(--r);
  background:var(--panel);padding:13px 15px}
.expl.right{border-top-color:var(--ok);background:var(--ok-wash)}
.expl.wrong{border-top-color:var(--ng);background:var(--ng-wash)}
.expl .v{font-family:var(--fm);font-weight:700;font-size:11px;letter-spacing:.16em;margin-bottom:7px;
  display:flex;align-items:center;gap:10px}
.expl.right .v{color:var(--ok)} .expl.wrong .v{color:var(--ng)}
.expl .v em{font-style:normal;color:var(--muted);font-weight:400;letter-spacing:.06em}
.expl p{margin:0;font-size:13.5px;line-height:1.85;color:var(--ink2)}
.qfoot{display:flex;gap:8px;margin-top:18px;align-items:stretch}
.bmk{border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);width:42px;
  display:grid;place-items:center;color:var(--muted);flex:none}
.bmk.on{color:var(--warn);border-color:var(--warn);background:var(--warn-wash)}

/* ============ result ============ */
.verdict{border:1px solid var(--rule);border-top:4px solid var(--blue);border-radius:var(--r);
  background:var(--panel);padding:22px 18px;text-align:center}
.verdict.pass{border-top-color:var(--ok);background:var(--ok-wash)}
.verdict.fail{border-top-color:var(--ng);background:var(--ng-wash)}
.verdict .score{font-family:var(--fm);font-size:48px;font-weight:700;line-height:1;letter-spacing:-.03em}
.verdict.pass .score{color:var(--ok)} .verdict.fail .score{color:var(--ng)}
.verdict .score small{font-size:17px;color:var(--muted);letter-spacing:0}
.verdict .tag{font-family:var(--fm);font-weight:700;font-size:12px;letter-spacing:.22em;margin-top:12px}
.verdict.pass .tag{color:var(--ok)} .verdict.fail .tag{color:var(--ng)}
.scale{margin:18px 4px 0;position:relative;height:34px}
.scale .trk{position:absolute;top:0;left:0;right:0;height:10px;background:var(--sink);border:1px solid var(--rule2);border-radius:2px}
.scale .fil{position:absolute;top:0;left:0;height:10px;background:var(--blue);border-radius:2px}
.scale .fil.pass{background:var(--ok)} .scale .fil.fail{background:var(--ng)}
.scale .thr{position:absolute;top:-4px;width:2px;height:18px;background:var(--mag)}
.scale .thrlab{position:absolute;top:19px;transform:translateX(-100%);padding-right:7px;font-family:var(--fm);font-size:9.5px;
  letter-spacing:.06em;color:var(--mag);white-space:nowrap}
.scale .ends{position:absolute;top:19px;left:0;right:0;display:flex;justify-content:space-between;
  font-family:var(--fm);font-size:9.5px;color:var(--muted)}

.revitem{display:grid;grid-template-columns:24px 1fr;gap:11px;width:100%;text-align:left;align-items:start;
  background:none;border:0;border-bottom:1px solid var(--rule2);padding:11px 0}
.revitem:last-child{border-bottom:0}
.revitem .mk{width:22px;height:22px;display:grid;place-items:center;border-radius:var(--r);
  font-family:var(--fm);font-size:12px;font-weight:700;line-height:1}
.revitem .mk.ok{background:var(--ok);color:#fff} .revitem .mk.ng{background:var(--ng);color:#fff}
.revitem p{margin:0;font-size:13.5px;line-height:1.7}
.revitem em{font-style:normal;display:block;font-family:var(--fm);font-size:10px;letter-spacing:.03em;color:var(--cc);margin-top:3px}
.revitem:hover p{color:var(--blue)}

.hrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--rule2);font-size:13px}
.hrow:last-child{border-bottom:0}
.hrow .b{padding:2px 8px;border-radius:var(--r);font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.1em;flex:none}
.b.pass{background:var(--ok);color:#fff} .b.fail{background:var(--ng-wash);color:var(--ng);border:1px solid var(--ng)}

/* ============ flashcards ============ */
.fcwrap{perspective:1500px}
.fc{position:relative;min-height:255px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.85,.3,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fcface{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--panel);border-top:4px solid var(--cc);padding:28px 22px;
  display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.fcback{transform:rotateY(180deg);background:var(--cw)}
.fcface .q{font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.7}
.fcface .a{font-size:15px;line-height:1.9;color:var(--ink2)}
.fcface .hint{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.fcback .hint:first-child{color:var(--cc);font-weight:700}

/* ============ textbook ============ */
.tsec{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.tsec+.tsec{margin-top:-1px}
.tsec>summary{cursor:pointer;list-style:none;padding:13px 15px;font-family:var(--fd);font-weight:700;font-size:14px;
  display:flex;align-items:center;gap:10px}
.tsec>summary::before{content:"";width:4px;height:15px;flex:none;background:var(--cc);border-radius:1px}
.tsec>summary::-webkit-details-marker{display:none}
.tsec>summary::after{content:"+";margin-left:auto;font-family:var(--fm);color:var(--muted);font-size:14px}
.tsec[open]>summary::after{content:"−"}
.tsec[open]>summary{border-bottom:1px solid var(--rule2);color:var(--cc)}
.tbody{padding:6px 15px 18px;font-size:13.5px;line-height:1.95;color:var(--ink2)}
.tbody h4{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;color:var(--cc);margin:20px 0 6px;font-weight:700}
.tbody ul,.tbody ol{margin:8px 0;padding-left:1.3em}
.tbody li{margin:4px 0}
.tbody li::marker{color:var(--cc)}
.tbody b{color:var(--ink);font-weight:700}
.tbody p{margin:8px 0}
.tbody table{width:100%;border-collapse:collapse;font-size:12px;margin:11px 0;line-height:1.65}
.tbody th,.tbody td{border:1px solid var(--rule2);padding:7px 9px;text-align:left;vertical-align:top}
.tbody th{background:var(--cw);font-weight:700;color:var(--ink);font-family:var(--fm);font-size:10.5px;letter-spacing:.04em}
.tbl-scroll{overflow-x:auto}
.cal{background:var(--cw);border:1px solid var(--rule2);border-left:3px solid var(--cc);border-radius:var(--r);
  padding:12px 14px;margin:13px 0;font-size:13px;line-height:1.85}
.cal.warn{background:var(--warn-wash);border-left-color:var(--warn)}
.steps{counter-reset:s;list-style:none;padding-left:0}
.steps li{position:relative;padding-left:30px;margin:11px 0}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;left:0;top:4px;
  font-family:var(--fm);font-size:10px;font-weight:700;color:var(--cc);letter-spacing:.04em}

.note{font-family:var(--fm);font-size:10px;line-height:1.9;letter-spacing:.02em;color:var(--muted);
  text-align:center;padding:20px 4px 0}
.chtitle{font-family:var(--fd);font-size:15px;font-weight:900;margin:20px 0 9px;display:flex;align-items:center;gap:9px}
.chtitle i{font-family:var(--fm);font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--panel);
  font-weight:700;background:var(--cc);padding:3px 7px;border-radius:var(--r)}

/* ============ countdown ============ */
.cd{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;
  border:1px solid var(--rule);border-top:4px solid var(--c3);border-radius:var(--r);
  background:var(--c3w);padding:15px 16px}
.cd .d{font-family:var(--fm);font-weight:700;font-size:40px;line-height:1;color:var(--c3);letter-spacing:-.03em}
.cd .d small{font-size:14px;letter-spacing:.08em;margin-left:3px}
.cd .t{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--c3);font-weight:700}
.cd .s{font-size:12.5px;color:var(--ink2);line-height:1.65}
.cd.today{--c3:var(--ok);border-top-color:var(--ok);background:var(--ok-wash)}
.cd.today .d,.cd.today .t{color:var(--ok)}

/* ============ settings ============ */
.set{border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);overflow:hidden}
.set .r{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid var(--rule2);flex-wrap:wrap}
.set .r:first-child{border-top:0}
.set .r .lb{flex:1;min-width:130px}
.set .r b{display:block;font-size:13.5px;font-weight:700;font-family:var(--fd)}
.set .r span.h{display:block;font-size:11.5px;color:var(--muted);line-height:1.6}
.set input[type=date],.set input[type=time]{font:inherit;font-family:var(--fm);font-size:13px;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--panel2);color:var(--ink);padding:7px 10px}
.sw{position:relative;width:46px;height:26px;border-radius:99px;border:1px solid var(--rule);
  background:var(--sink);flex:none;padding:0;transition:background .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.pill{font-family:var(--fm);font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 8px;border-radius:var(--r)}
.pill.on{background:var(--ok-wash);color:var(--ok);border:1px solid var(--ok)}
.pill.off{background:var(--sink);color:var(--muted);border:1px solid var(--rule)}
.pill.warn{background:var(--warn-wash);color:var(--warn);border:1px solid var(--warn)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--paper);font-size:13px;padding:10px 16px;border-radius:var(--r);
  box-shadow:0 6px 24px rgba(0,0,0,.28);max-width:88vw;text-align:center}
@media(min-width:920px){.toast{bottom:24px}}
</style>

</head>
