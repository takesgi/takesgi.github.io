予防の義務を定めており、他の無人航空機や航空機との衝突のおそれがある場合は、地上に降下させるなど衝突を避けるための措置をとります。","id":211},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"航空機を目視により確認した場合の無人航空機側の対応として、正しいものを1つ選びなさい。","c":["高度を維持したまま、航空機の通過を待つ","速やかに降下させるなどして、航空機との衝突を回避する","航空機に向けてライトを点滅させ、存在を知らせる"],"a":1,"e":"航空機が進路権を有します。航空機側から無人航空機を視認して回避することは困難であるため、無人航空機側が速やかに降下するなどして回避します。","id":212},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"人や物件に接近する飛行についての考え方として、正しいものを1つ選びなさい。","c":["接近しても衝突しなければ問題はない","人や物件との間に安全な距離を保ち、必要以上に接近しない","風下側であれば接近してもよい"],"a":1,"e":"無人航空機は不意の制御不能や突風により意図しない挙動をすることがあります。人や物件とは常に安全な距離を保ち、必要以上に接近させないことが求められます。","id":213},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"無人航空機の飛行における危険な飛行の禁止について、正しいものを1つ選びなさい。","c":["他人に迷惑を及ぼすような方法での飛行は禁止されている","無許可の飛行のみが禁止されている","私有地内であれば、どのような飛行方法でもよい"],"a":0,"e":"航空法は、他人に迷惑を及ぼすような方法で無人航空機を飛行させることを禁止しています。急降下や人への接近など、飛行場所にかかわらず適用されます。","id":214},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行中のバッテリー残量の管理について、正しいものを1つ選びなさい。","c":["警告が出てから帰投を開始すれば十分である","帰投に必要な残量を見込み、余裕をもって飛行を終了する","残量がゼロになる直前まで飛行してよい"],"a":1,"e":"帰投には往路以上の電力を要することがあり、向かい風ではさらに消費が増えます。警告を待たず、帰投に必要な余裕を見込んで飛行を終了します。","id":215},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"目視外での飛行についての心得として、正しいものを1つ選びなさい。","c":["カメラの映像で機体が見えていれば「目視」に該当する","双眼鏡を用いた監視は「目視」に該当する","目視とは、操縦者が自分の目で機体とその周囲を常時監視することをいう"],"a":2,"e":"目視とは操縦者自身が肉眼で機体とその周辺を常時監視することをいいます。モニターや双眼鏡、補助者による監視は目視には該当しません。","id":216},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行中に機体の異常を感じた場合の対応として、正しいものを1つ選びなさい。","c":["原因がはっきりするまで飛行を続けて観察する","速やかに安全な場所へ着陸させ、点検を行う","高度を上げて様子を見る"],"a":1,"e":"異常を感じた時点で速やかに安全な場所へ着陸させます。飛行を継続して観察することは、制御不能や墜落のリスクを高めます。","id":217},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行前の気象確認について、正しいものを1つ選びなさい。","c":["飛行地点の予報だけでなく、当日の実際の状況も現地で確認する","前日の予報を確認していれば当日の確認は不要である","晴天であれば風の確認は不要である"],"a":0,"e":"予報は広域の傾向を示すものであり、現地の風況は地形や建物の影響で大きく異なります。当日、現地での実測と目視による確認が必要です。","id":218},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"無人航空機の飛行に使用する電波について、飛行前に確認すべき事項として正しいものを1つ選びなさい。","c":["周囲に電波を発する設備がないか、混信のおそれがないかを確認する","電波は目に見えないため、確認のしようがない","機体が起動すれば電波状況は問題ない"],"a":0,"e":"高圧線、変電所、無線施設、携帯電話基地局の近くなどでは電波障害が生じることがあります。飛行前に周囲の状況を確認し、影響が疑われる場所を避けます。","id":219},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行の安全を確保するための手順書について、正しいものを1つ選びなさい。","c":["手順書は形式的なものであり、現場では臨機応変に判断すればよい","手順書に基づいて点検・飛行・記録を行い、必要に応じて見直す","手順書は許可申請時のみ必要な書類である"],"a":1,"e":"飛行マニュアルや手順書は、実際の運航で遵守することに意味があります。運用の中で不都合が見つかれば、その都度見直して改善します。","id":220},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行経路下への第三者の立入りに備えた措置として、正しいものを1つ選びなさい。","c":["立入管理区画を設定し、看板やコーン等で明示する","第三者が入らないよう口頭で注意するだけでよい","飛行高度を上げれば立入管理は不要である"],"a":0,"e":"立入管理措置では、飛行経路下に立入管理区画を設定し、標識やコーン、補助者の配置などにより第三者が立ち入らないよう明示的に管理します。","id":221},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行終了後に行うべきこととして、正しいものを1つ選びなさい。","c":["機体の状態を確認し、飛行日誌に記録する","次回の飛行前にまとめて確認すればよい","異常がなければ何も行う必要はない"],"a":0,"e":"飛行後は機体各部の損傷や異常の有無を確認し、飛行の記録を残します。異常の早期発見は次回以降の事故防止につながります。","id":222},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行の安全に関する情報共有について、正しいものを1つ選びなさい。","c":["補助者との間で、中止の合図や連絡手段を事前に取り決めておく","緊急時は大声で知らせればよく、事前の取決めは不要である","補助者への連絡は操縦者の判断で随時行えばよい"],"a":0,"e":"緊急時に確実に意思疎通ができるよう、中止の合図、使用する無線機やその周波数、呼びかけの方法を飛行前に取り決めておきます。","id":223},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"強風時の飛行判断について、正しいものを1つ選びなさい。","c":["機体の耐風性能の範囲内であっても、突風に備えて余裕をもって判断する","カタログ上の耐風性能まではそのまま飛行してよい","風速計の数値が性能値以下なら安全である"],"a":0,"e":"カタログ値は理想条件での数値であり、実際には突風や地形による乱れが加わります。性能値に対して余裕をもった判断が必要です。","id":224},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"夜間に飛行させる場合の心得として、正しいものを1つ選びなさい。","c":["機体の姿勢や向きの把握が困難になるため、より慎重な運航が求められる","灯火があれば昼間と同じ感覚で飛行できる","夜間は人が少ないため、昼間より安全である"],"a":0,"e":"夜間は機体の姿勢や向き、周囲の障害物の把握が著しく困難になります。灯火を装備していても、昼間より慎重な運航と十分な事前準備が必要です。","id":225},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行前に行う機体の外観点検について、正しいものを1つ選びなさい。","c":["プロペラの傷や変形、各部の緩みやがたつきを確認する","飛行に支障がなければ外観の傷は確認不要である","点検は整備事業者のみが行うものである"],"a":0,"e":"プロペラの欠けや傷、フレームの亀裂、ネジの緩み、配線の損傷などは飛行中の重大なトラブルにつながります。飛行前の外観点検で確認します。","id":226},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"バッテリーの取扱いについて、安全上正しいものを1つ選びなさい。","c":["膨張や変形が見られるバッテリーは使用しない","膨張していても充電できれば使用してよい","変形は外観上の問題であり、性能には影響しない"],"a":0,"e":"リチウムポリマーバッテリーの膨張や変形は内部劣化のサインであり、発煙・発火の危険があります。使用せず、適切に廃棄します。","id":227},{"ch":2,"sec":"2.2 安全な飛行の確保","q":"飛行中に操縦者が保つべき姿勢として、正しいものを1つ選びなさい。","c":["機体の監視に加え、周囲の人や航空機の接近にも注意を払う","機体の監視に専念し、周囲は補助者に任せきりにする","モニターの映像に集中する"],"a":0,"e":"操縦者は機体の状態と同時に、周囲への第三者の立入りや航空機の接近にも注意を払う必要があります。補助者がいても最終的な責任は操縦者にあります。","id":228},{"ch":2,"sec":"2.3 事故時の対応","q":"航空法上、無人航空機の「事故」に該当するものとして正しいものを1つ選びなさい。","c":["飛行中に一時的に通信が途切れたが、復帰して着陸した","無人航空機の飛行により人が負傷した","飛行中にバッテリー警告が表示された"],"a":1,"e":"航空法上の事故とは、人の死傷、第三者の物件の損壊、航空機との衝突または接触をいいます。通信の一時的な途絶や警告表示はこれに該当しません。","id":229},{"ch":2,"sec":"2.3 事故時の対応","q":"無人航空機の事故が発生した場合の報告先として、正しいものを1つ選びなさい。","c":["国土交通大臣","機体の製造事業者","指定試験機関"],"a":0,"e":"無人航空機の事故が発生した場合、飛行させた者は国土交通大臣に報告しなければなりません。報告は事故の発生を知った後、直ちに行います。","id":230},{"ch":2,"sec":"2.3 事故時の対応","q":"事故発生時に操縦者がまず行うべきこととして、正しいものを1つ選びなさい。","c":["機体の回収を最優先する","負傷者の救護と危険の防止のために必要な措置を講じる","撮影した映像の保全を最優先する"],"a":1,"e":"事故が発生した場合、飛行させた者は直ちに飛行を中止し、負傷者の救護、危険防止のための措置を講じる義務があります。機体の回収や記録の保全はその後です。","id":231},{"ch":2,"sec":"2.3 事故時の対応","q":"航空法上の「重大インシデント」に該当するものとして、正しいものを1つ選びなさい。","c":["飛行中に航空機との衝突のおそれがあったと認められる事態","飛行中にカメラの映像が乱れた事態","飛行前点検で異常を発見した事態"],"a":0,"e":"重大インシデントには、航空機との衝突または接触のおそれがあったと認められる事態、無人航空機の制御が不能となった事態、機体が発火した事態などが含まれます。","id":232},{"ch":2,"sec":"2.3 事故時の対応","q":"重大インシデントが発生した場合の対応として、正しいものを1つ選びなさい。","c":["人身被害がなければ報告の必要はない","事故に準じて、国土交通大臣に報告しなければならない","製造事業者に連絡すれば足りる"],"a":1,"e":"重大インシデントは事故には至らなかったものの重大な結果を招くおそれがあった事態であり、事故と同様に国土交通大臣への報告が義務付けられています。","id":233},{"ch":2,"sec":"2.3 事故時の対応","q":"無人航空機の制御が不能となった場合について、正しいものを1つ選びなさい。","c":["自動で帰還したのであれば、いかなる場合も報告不要である","制御不能となった事態は重大インシデントに該当し得る","操縦者の技量不足が原因であれば報告義務はない"],"a":1,"e":"飛行中に無人航空機の制御が不能となった事態は重大インシデントに該当し得ます。原因が操縦者側にあるかどうかは報告義務の有無に影響しません。","id":234},{"ch":2,"sec":"2.3 事故時の対応","q":"事故により第三者の物件を損壊した場合について、正しいものを1つ選びなさい。","c":["損害額にかかわらず、国土交通大臣への報告が必要である","少額の損害であれば報告は不要である","当事者間で示談が成立すれば報告は不要である"],"a":0,"e":"第三者の物件の損壊は航空法上の事故に該当し、損害額の多寡や示談の成否にかかわらず国土交通大臣への報告が必要です。","id":235},{"ch":2,"sec":"2.3 事故時の対応","q":"事故発生時に警察への通報が必要となる場合について、正しいものを1つ選びなさい。","c":["国土交通大臣に報告すれば、警察への通報は一切不要である","人身事故や物損が生じた場合は、警察への通報も検討する","警察への通報は任意であり、通常は行わない"],"a":1,"e":"国土交通大臣への報告は航空法上の義務であり、これとは別に、人身事故や物件の損壊が生じた場合には警察への通報も必要となり得ます。","id":236},{"ch":2,"sec":"2.3 事故時の対応","q":"事故現場での証拠の保全について、正しいものを1つ選びなさい。","c":["安全確保を優先しつつ、可能な範囲で機体や記録を保全する","ただちに機体を分解して原因を特定する","記録は上書きして構わない"],"a":0,"e":"救護と危険防止を優先したうえで、可能な範囲で機体の状態、飛行記録、映像などを保全します。原因究明と再発防止のために重要です。","id":237},{"ch":2,"sec":"2.3 事故時の対応","q":"無人航空機の事故報告に含めるべき内容として、正しいものを1つ選びなさい。","c":["日時、場所、機体、飛行の概要、事故の状況、被害の状況等","操縦者の氏名のみ","撮影した映像のみ"],"a":0,"e":"報告には発生日時・場所、無人航空機の種類・登録記号、飛行の目的と概要、事故等の概要と原因、負傷者や物件の損壊の状況などを記載します。","id":238},{"ch":2,"sec":"2.3 事故時の対応","q":"事故を起こした操縦者が負う責任の組合せとして、正しいものを1つ選びなさい。","c":["刑事責任のみ","民事責任のみ","刑事責任、民事責任、行政処分等"],"a":2,"e":"事故を起こした場合、過失による刑事責任、損害賠償に関する民事責任、航空法に基づく技能証明の取消しや効力停止等の行政処分を受けることがあります。","id":239},{"ch":2,"sec":"2.3 事故時の対応","q":"事故後の再発防止について、正しいものを1つ選びなさい。","c":["原因を分析し、手順や体制の見直しに反映させる","原因が特定できれば、手順の見直しまでは不要である","再発防止は製造事業者が行うものである"],"a":0,"e":"事故やインシデントの原因を分析し、点検手順、飛行手順、運航体制の見直しに反映させることで、同種の事故の再発を防ぎます。","id":240},{"ch":2,"sec":"2.3 事故時の対応","q":"飛行中に機体を見失った場合の対応として、正しいものを1つ選びなさい。","c":["自動帰還機能に任せ、待機する以外に行うことはない","捜索とともに、周囲の安全確保と関係機関への連絡を検討する","発見できるまで飛行を続ける"],"a":1,"e":"機体を見失った場合は制御不能の状態であり、地上の人や物件に危害が及ぶおそれがあります。周囲の安全確保を図り、状況に応じて関係機関へ連絡します。","id":241},{"ch":2,"sec":"2.3 事故時の対応","q":"墜落した機体のバッテリーの取扱いについて、正しいものを1つ選びなさい。","c":["衝撃を受けたバッテリーは発火のおそれがあるため、慎重に取り扱う","墜落しても外観に異常がなければ通常どおり再使用してよい","すぐに充電して状態を確認する"],"a":0,"e":"衝撃を受けたリチウムポリマーバッテリーは内部が損傷し、時間差で発煙・発火することがあります。再使用せず、安全な場所で経過を観察したうえで適切に廃棄します。","id":242},{"ch":2,"sec":"2.3 事故時の対応","q":"第三者が負傷した場合の初動として、最も適切なものを1つ選びなさい。","c":["救急車の要請など、救護を最優先で行う","まず保険会社に連絡する","まず機体を回収して安全な状態にする"],"a":0,"e":"人命の保護が最優先です。救急車の要請や応急手当など救護を第一に行い、そのうえで危険の防止、関係機関への連絡、報告の順に対応します。","id":243},{"ch":2,"sec":"2.3 事故時の対応","q":"事故等の報告を怠った場合について、正しいものを1つ選びなさい。","c":["報告義務違反として罰則の対象となる","努力義務であるため罰則はない","次回の飛行申請時に注意を受けるのみである"],"a":0,"e":"事故等の報告は航空法上の義務であり、怠った場合や虚偽の報告をした場合は罰則の対象となります。","id":244},{"ch":2,"sec":"2.3 事故時の対応","q":"飛行中に機体の一部が落下した場合について、正しいものを1つ選びなさい。","c":["落下物が小さければ問題にならない","無人航空機の部品が落下した事態は、重大インシデントに該当し得る","部品の落下は機体の不具合であり、報告の対象外である"],"a":1,"e":"飛行中に無人航空機の部品が脱落した事態は、地上の人や物件に危害を及ぼすおそれがあり、重大インシデントに該当し得ます。","id":245},{"ch":2,"sec":"2.3 事故時の対応","q":"事故時の連絡体制について、正しいものを1つ選びなさい。","c":["緊急連絡先や連絡手順を、飛行前にあらかじめ定めておく","事故が起きてから連絡先を調べればよい","連絡は操縦者以外が行ってはならない"],"a":0,"e":"救急・消防・警察、関係機関、依頼主などの緊急連絡先と連絡手順は、飛行前にあらかじめ定め、関係者間で共有しておきます。","id":246},{"ch":2,"sec":"2.3 事故時の対応","q":"飛行中に機体が発火した場合の対応として、正しいものを1つ選びなさい。","c":["水をかけて消火することが最も有効である","周囲の安全を確保し、延焼防止の措置をとりつつ消防へ連絡する","自然鎮火を待つのが最も安全である"],"a":1,"e":"リチウムポリマーバッテリーの火災は激しく燃焼し、注水では消火が困難です。周囲の可燃物を遠ざけ、延焼防止を図りつつ消防へ連絡します。","id":247},{"ch":2,"sec":"2.3 事故時の対応","q":"事故の報告義務を負う者として、正しいものを1つ選びなさい。","c":["無人航空機を飛行させた者","機体の所有者のみ","飛行を依頼した者"],"a":0,"e":"報告義務を負うのは、事故等を発生させた無人航空機を飛行させた者です。所有者や依頼主とは区別されます。","id":248},{"ch":2,"sec":"2.3 事故時の対応","q":"航空機との接触があった場合の取扱いとして、正しいものを1つ選びなさい。","c":["人の死傷がなければ事故には該当しない","航空機との衝突または接触は、それ自体が事故に該当する","航空機側に損傷がなければ報告不要である"],"a":1,"e":"無人航空機と航空機との衝突または接触は、人の死傷や物件の損壊の有無にかかわらず、それ自体が航空法上の事故に該当します。","id":249},{"ch":2,"sec":"2.3 事故時の対応","q":"事故等の報告と飛行日誌の関係について、正しいものを1つ選びなさい。","c":["事故等が発生した場合、その内容を飛行日誌にも記載する","飛行日誌は通常の飛行のみを記録するものである","事故を起こした飛行は日誌に記載しない"],"a":0,"e":"飛行日誌の飛行記録には、飛行の実績に加えて不具合やその処置、事故等の発生とその内容も記載します。","id":250},{"ch":2,"sec":"2.3 事故時の対応","q":"事故につながりかねなかった事例（ヒヤリハット）の扱いについて、正しいものを1つ選びなさい。","c":["法令上の報告対象でなくとも、記録し組織内で共有することが望ましい","報告対象でないため記録の必要はない","次に同じ状況が起きてから対処すればよい"],"a":0,"e":"ヒヤリハットは重大事故の予兆です。法令上の報告対象でなくとも記録・共有し、手順の改善に活かすことが安全管理上望まれます。","id":251},{"ch":2,"sec":"2.3 事故時の対応","q":"事故発生後の飛行再開の判断について、正しいものを1つ選びなさい。","c":["原因の特定と是正がなされるまで、同型機の飛行は慎重に判断する","報告さえ済ませれば直ちに飛行を再開してよい","機体を交換すれば原因究明は不要である"],"a":0,"e":"原因が特定されないまま飛行を再開すると、同じ事故を繰り返すおそれがあります。原因の究明と是正措置を経てから再開を判断します。","id":252},{"ch":3,"sec":"3.1 定義と登録","q":"最大離陸重量25kg未満の無人航空機に表示する登録記号の文字の高さとして、正しいものを1つ選びなさい。","c":["3mm以上","10mm以上","25mm以上"],"a":0,"e":"登録記号の文字の高さは、最大離陸重量25kg未満の機体では3mm以上、25kg以上の機体では25mm以上と定められています。","id":253},{"ch":3,"sec":"3.1 定義と登録","q":"リモートIDの発信間隔として、正しいものを1つ選びなさい。","c":["1分に1回以上","1秒に1回以上","10秒に1回以上"],"a":1,"e":"リモートID機能は、登録記号などの識別情報を1秒に1回以上発信します。所有者の氏名や住所は含まれません。","id":254},{"ch":3,"sec":"3.2 特定飛行","q":"航空交通管制区の高度として、正しいものを1つ選びなさい。","c":["地表または水面から150メートル以上の空域","地表または水面から200メートル以上の空域","地表または水面から250メートル以上の空域"],"a":1,"e":"航空交通管制区は、地表または水面から200メートル以上の高さの空域のうち、国が指定した空域をいいます。","id":255},{"ch":3,"sec":"3.2 特定飛行","q":"「高度150メートル以上の空域」の高さの基準として、正しいものを1つ選びなさい。","c":["海抜高度","機体の直下の地表または水面からの高度差","離陸地点からの高度差"],"a":1,"e":"高度150メートル以上の飛行禁止空域は、海抜高度でも離陸地点基準でもなく、飛行中の機体の直下の地表または水面からの高度差で判断します。山岳部では意図せず超えるおそれがあります。","id":256},{"ch":3,"sec":"3.4 例外・特例","q":"係留による飛行で認められる紐の長さとして、正しいものを1つ選びなさい。","c":["10メートル以内","30メートル以内","50メートル以内"],"a":1,"e":"十分な強度を有する長さ30メートル以内の紐等で係留し、飛行可能な範囲内への第三者の立入りを管理する措置を講じた場合、一部の特定飛行に係る手続きが不要となります。","id":257},{"ch":3,"sec":"3.6 罰則・行政処分","q":"技能証明の効力の停止期間として定められているものを1つ選びなさい。","c":["1年、6月、3月のいずれか","1年または2年","3月または1月"],"a":0,"e":"技能証明を受けた者が一定の事由に該当する場合、技能証明の取消し、または1年・6月・3月のいずれかの期間の効力の停止が行われることがあります。","id":258},{"ch":3,"sec":"3.7 技能証明制度","q":"技能証明の更新の申請ができる期間として、正しいものを1つ選びなさい。","c":["有効期間が満了する日の6月前から1月前までの間","有効期間が満了した後3月以内","有効期間が満了する日の1年前から"],"a":0,"e":"技能証明の更新は、有効期間が満了する日の6月前から1月前までの間に申請します。あわせて、申請日以前3月以内に無人航空機更新講習を修了している必要があります。","id":259},{"ch":3,"sec":"3.7 技能証明制度","q":"技能証明を取り消された者が、再び技能証明を受けることができない期間として正しいものを1つ選びなさい。","c":["取り消された日から1年以内","取り消された日から2年以内","取り消された日から3年以内"],"a":1,"e":"技能証明を取り消された日から2年以内の者は、技能証明を受けることができません。なお、技能証明を拒否された場合は、その日から1年以内が対象となります。","id":260},{"ch":4,"sec":"4.1 機体の種類","q":"最大離陸重量25kg以上の飛行機の特徴として、正しいものを1つ選びなさい。","c":["主翼面積が大きく、より大きなペイロードを搭載できる","25kg未満の機体に比べて風の影響を受けやすい","事故発生時の影響は25kg未満の機体と同程度である"],"a":0,"e":"大型の飛行機は主翼面積が大きいためペイロードを多く搭載でき、25kg未満の機体に比べて風の影響を受けにくくなります。一方、事故時の影響は大きくなります。","id":261},{"ch":4,"sec":"4.1 機体の種類","q":"最大離陸重量25kg以上の回転翼航空機（ヘリコプター）の特徴として、正しいものを1つ選びなさい。","c":["慣性力が大きく、操舵に対する機体の応答が遅れる傾向がある","慣性力が小さいため、機敏に姿勢を変えられる","慣性力は機体重量に影響されない"],"a":0,"e":"大型機は慣性力が大きいため、操舵してから機体が反応するまでに時間を要します。この特性を理解し、余裕をもった操作が必要です。","id":262},{"ch":4,"sec":"4.1 機体の種類","q":"回転翼航空機（ヘリコプター）の反トルクの処理について、正しいものを1つ選びなさい。","c":["メインローターを2枚に増やして相殺する","テールローターにより反トルクを相殺する","機体の重量配分により相殺する"],"a":1,"e":"シングルローター式のヘリコプターでは、メインローターの回転によって生じる反トルクをテールローターの推力で相殺し、機首方位を保持します。","id":263},{"ch":4,"sec":"4.1 機体の種類","q":"回転翼航空機（ヘリコプター）のメインローターの制御について、正しいものを1つ選びなさい。","c":["1回転する間にブレードのピッチ角を周期的に変化させる","ブレードのピッチ角は常に一定である","回転数のみで機体の姿勢を制御する"],"a":0,"e":"ヘリコプターはメインローターが1回転する間にブレードのピッチ角を周期的に変化させることで、揚力の発生位置を変え、機体を前後左右に傾けて移動します。","id":264},{"ch":4,"sec":"4.1 機体の種類","q":"回転翼航空機（マルチローター）の姿勢制御の方法として、正しいものを1つ選びなさい。","c":["各ローターの回転数を個別に変化させて姿勢を制御する","ブレードのピッチ角を周期的に変化させて制御する","尾翼の舵面を動かして制御する"],"a":0,"e":"マルチローターは、複数のローターの回転数をそれぞれ独立に変化させることで揚力の配分を変え、機体の姿勢と移動を制御します。","id":265},{"ch":4,"sec":"4.1 機体の種類","q":"飛行機（固定翼機）とマルチローターの比較として、正しいものを1つ選びなさい。","c":["飛行機は空中で停止（ホバリング）できる","飛行機は同じ電力でより長い距離を飛行できる傾向がある","マルチローターの方が長距離飛行に適している"],"a":1,"e":"飛行機は主翼で揚力を得るため飛行効率が高く、同じ電力でより長い距離・時間を飛行できます。一方、空中で停止することはできません。","id":266},{"ch":4,"sec":"4.2 飛行原理","q":"高度が1000メートル増加したときの空気密度の変化として、正しいものを1つ選びなさい。","c":["約0.9倍になる","約0.5倍になる","変化しない"],"a":0,"e":"標準大気では、高度が1000メートル増加するごとに空気密度は約0.9倍になります。高地では揚力や推力が低下します。","id":267},{"ch":4,"sec":"4.2 飛行原理","q":"標準大気において、高度3000メートルでの空気密度は高度0メートルと比べて何倍になるか、正しいものを1つ選びなさい。","c":["0.74倍","0.90倍","0.50倍"],"a":0,"e":"高度3000メートルでの空気密度は、高度0メートルと比べて約0.74倍になります。同じ速度では揚力も0.74倍となります。","id":268},{"ch":4,"sec":"4.2 飛行原理","q":"飛行機の機体重量が2倍になったときに必要となる揚力について、正しいものを1つ選びなさい。","c":["2倍の揚力が必要になる","1.4倍の揚力が必要になる","4倍の揚力が必要になる"],"a":0,"e":"水平飛行では揚力と重量が釣り合うため、機体重量が2倍になれば必要な揚力も2倍になります。同じ迎角で飛ぶには約1.4倍の速度が必要です。","id":269},{"ch":4,"sec":"4.2 飛行原理","q":"飛行機の機体重量が2倍になったときの最低速度（失速速度）の変化として、正しいものを1つ選びなさい。","c":["約1.4倍になる","2倍になる","変化しない"],"a":0,"e":"必要な揚力が2倍になると、同じ迎角で飛ぶために必要な速度は√2すなわち約1.4倍になります。したがって最低速度も約1.4倍に上がります。","id":270},{"ch":4,"sec":"4.2 飛行原理","q":"回転翼航空機の機体重量が2倍になったときの消費パワーの変化として、正しいものを1つ選びなさい。","c":["約2.8倍になる","2倍になる","1.4倍になる"],"a":0,"e":"重量が2倍になると推力も2倍必要となり、そのためのプロペラ回転角速度は約1.4倍になります。推力と速度の積である消費パワーは約2.8倍に増加します。","id":271},{"ch":4,"sec":"4.2 飛行原理","q":"飛行機の迎角と揚力の関係について、正しいものを1つ選びなさい。","c":["迎角を大きくしていけば、揚力は限りなく増加する","迎角がある角度を超えると失速し、揚力が急激に減少する","迎角は揚力に影響しない"],"a":1,"e":"迎角を増すと揚力は増加しますが、ある角度を超えると翼上面の空気の流れが剥離して失速し、揚力が急激に失われます。","id":272},{"ch":4,"sec":"4.2 飛行原理","q":"飛行機が旋回する際に必要となる揚力について、正しいものを1つ選びなさい。","c":["水平飛行時より大きな揚力が必要になる","水平飛行時と同じ揚力でよい","水平飛行時より小さい揚力でよい"],"a":0,"e":"旋回中は機体を傾けるため、揚力の鉛直成分が減少します。高度を保つには、水平飛行時より大きな揚力すなわち大きな迎角または速度が必要です。","id":273},{"ch":4,"sec":"4.2 飛行原理","q":"高地や高温時における無人航空機の飛行性能について、正しいものを1つ選びなさい。","c":["空気密度が低下し、揚力や推力が得にくくなる","空気密度が上昇し、性能が向上する","気温は飛行性能に影響しない"],"a":0,"e":"高地や高温の環境では空気密度が低下します。同じ回転数では得られる揚力・推力が減少するため、上昇性能やペイロードに制限が生じます。","id":274},{"ch":4,"sec":"4.2 飛行原理","q":"マルチローターのホバリング中に働く力の関係として、正しいものを1つ選びなさい。","c":["ローターの推力の合計と機体重量が釣り合っている","推力が重量を常に上回っている","推力は重量と無関係である"],"a":0,"e":"ホバリング中はローターが発生する推力の合計と機体に働く重力が釣り合い、上下方向の加速度がゼロの状態にあります。","id":275},{"ch":4,"sec":"4.2 飛行原理","q":"地面効果について、正しいものを1つ選びなさい。","c":["地面付近では吹き下ろしが妨げられ、同じ出力でも揚力が増加する","地面付近では揚力が減少する","地面効果は高度に関係なく発生する"],"a":0,"e":"地面に近い高度では、ローターの吹き下ろし気流が地面に妨げられ、同じ出力でも揚力が増加します。離着陸時の挙動に影響します。","id":276},{"ch":4,"sec":"4.2 飛行原理","q":"ボルテックスリングステート（セットリングウィズパワー）について、正しいものを1つ選びなさい。","c":["自らの吹き下ろし気流の中を降下することで、揚力を失う現象である","前進飛行中に発生しやすい現象である","出力を上げれば必ず回復できる現象である"],"a":0,"e":"低速で垂直に降下すると、自らの吹き下ろし気流の渦の中に入り、揚力が急減します。出力を上げるとかえって悪化するため、前進して気流から離脱します。","id":277},{"ch":4,"sec":"4.3 機体の構成","q":"フライトコントローラーの役割として、正しいものを1つ選びなさい。","c":["各種センサーの情報をもとに、機体の姿勢と飛行を制御する","バッテリーの充電を制御する","映像を記録する"],"a":0,"e":"フライトコントローラーは、慣性計測装置や気圧センサー、測位装置などからの情報をもとに各モーターの出力を調整し、機体の姿勢と飛行を制御します。","id":278},{"ch":4,"sec":"4.3 機体の構成","q":"ESC（スピードコントローラー）の役割として、正しいものを1つ選びなさい。","c":["モーターの回転数を制御する","プロペラの角度を制御する","通信の暗号化を行う"],"a":0,"e":"ESCはフライトコントローラーからの指令を受け、モーターに供給する電力を調整して回転数を制御します。","id":279},{"ch":4,"sec":"4.3 機体の構成","q":"IMU（慣性計測装置）が検出するものとして、正しいものを1つ選びなさい。","c":["機体の加速度と角速度","機体の位置情報","周囲の気温"],"a":0,"e":"IMUは加速度センサーと角速度センサー（ジャイロ）から構成され、機体の加速度と角速度を検出して姿勢の推定に用いられます。","id":280},{"ch":4,"sec":"4.3 機体の構成","q":"気圧センサーの用途として、正しいものを1つ選びなさい。","c":["高度の測定","水平位置の測定","風向の測定"],"a":0,"e":"気圧センサーは大気圧の変化から高度を推定します。気圧は気象条件によって変化するため、長時間の飛行では誤差が生じることがあります。","id":281},{"ch":4,"sec":"4.3 機体の構成","q":"プロペラの取扱いについて、正しいものを1つ選びなさい。","c":["わずかな欠けや傷でも振動の原因となるため、交換を検討する","小さな欠けであれば性能に影響しない","傷があっても回転させれば問題ない"],"a":0,"e":"プロペラのわずかな欠けや変形は回転バランスを崩し、異常振動やセンサー誤差、モーターの過負荷を招きます。異常があれば交換します。","id":282},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"無人航空機の操縦に多く用いられる2.4GHz帯の電波の性質として、正しいものを1つ選びなさい。","c":["回折しにくく直進性が高いため、障害物の影響を受けやすい","回折しやすく、障害物の影響をほとんど受けない","水分に吸収されない"],"a":0,"e":"2.4GHz帯の電波は波長が短く直進性が高いため回折しにくく、建物や樹木などの障害物により遮られやすい性質があります。","id":283},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"無人航空機の運航で用いられる周波数帯のうち、主にバックアップ回線として用いられるものを1つ選びなさい。","c":["169MHz帯","5.7GHz帯","2.4GHz帯"],"a":0,"e":"169MHz帯は、主に2.4GHz帯および5.7GHz帯のバックアップ回線として用いられます。","id":284},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"5.7GHz帯を無人移動体画像伝送システムとして使用する場合について、正しいものを1つ選びなさい。","c":["無線局の免許が必要である","免許は不要で、誰でも自由に使用できる","アマチュア無線技士の資格のみで使用できる"],"a":0,"e":"5.7GHz帯の無人移動体画像伝送システムは、無線局の免許を受けたうえで使用する必要があります。2.4GHz帯の免許不要局とは異なります。","id":285},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"アマチュア無線を用いたFPV飛行について、正しいものを1つ選びなさい。","c":["業務目的の飛行に使用できる","アマチュア無線は金銭上の利益のための通信に使用できない","免許は不要である"],"a":1,"e":"アマチュア無線は個人的な興味による無線通信のための業務であり、金銭上の利益を目的とする業務用途に使用することはできません。","id":286},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"5GHz帯のアマチュア無線の周波数割当てについて、正しいものを1つ選びなさい。","c":["二次業務に割り当てられており、一次業務に妨害を与えてはならない","一次業務に割り当てられている","割当区分はない"],"a":0,"e":"5GHz帯のアマチュア無線は周波数割当計画上、二次業務に割り当てられています。同一帯域を使用する一次業務の無線局の運用に妨害を与えないよう運用する必要があります。","id":287},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"フレネルゾーンについて、実用上確保すべき割合として正しいものを1つ選びなさい。","c":["フレネルゾーン半径の60%以上","フレネルゾーン半径の100%","フレネルゾーン半径の10%以上"],"a":0,"e":"理想的にはフレネルゾーン全体を確保しますが、実際にはフレネルゾーン半径の60%以上のアンテナ高さが確保できていれば、大きな影響を受けにくいとされています。","id":288},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"コンパス（磁気センサー）のキャリブレーションが必要となる場面として、正しいものを1つ選びなさい。","c":["飛行場所を大きく移動したとき","毎回のバッテリー交換のたび","飛行時間が1時間を超えたとき"],"a":0,"e":"地磁気は場所によって異なるため、飛行場所を大きく移動したときや磁気異常が疑われる場所ではキャリブレーションを行います。","id":289},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"GNSSによる測位精度が低下しやすい場所として、正しいものを1つ選びなさい。","c":["高層建築物に囲まれた場所や、山間部の谷間","開けた田畑の上空","海上の上空"],"a":0,"e":"高層建築物や崖に囲まれた場所では、衛星からの電波が遮られたり反射波を受信したりするため、測位精度が低下します。","id":290},{"ch":4,"sec":"4.4 電波・磁気・GNSS","q":"鉄塔や変電所付近での飛行における注意点として、正しいものを1つ選びなさい。","c":["磁気の影響でコンパスが正常に機能しないおそれがある","磁気の影響は機体に及ばない","GNSSの精度のみが影響を受ける"],"a":0,"e":"鉄塔、変電所、鉄筋構造物、送電線の付近では磁気の影響によりコンパスが誤った方位を示すことがあり、機体が意図しない方向へ流れるおそれがあります。","id":291},{"ch":4,"sec":"4.5 整備・保管","q":"リチウムポリマーバッテリーを長期間使用しない場合の保管について、正しいものを1つ選びなさい。","c":["充電率60%程度を目安に保管する","満充電の状態で保管する","完全に放電した状態で保管する"],"a":0,"e":"バッテリーの劣化を遅らせるため、長期間使用しない場合は充電率60%程度を目安に保管します。満充電や完全放電での長期保管は劣化を早めます。","id":292},{"ch":4,"sec":"4.5 整備・保管","q":"バッテリーの充電を行う場所として、適切なものを1つ選びなさい。","c":["可燃物から離れ、監視できる場所で行う","就寝中に自宅の寝室で行う","車内に放置して行う"],"a":0,"e":"リチウムポリマーバッテリーは充電中の発火のおそれがあります。可燃物から離れた場所で、人が監視できる状態で充電します。","id":293},{"ch":4,"sec":"4.5 整備・保管","q":"機体の保管環境として、適切なものを1つ選びなさい。","c":["直射日光や高温多湿を避けた場所","日当たりのよい車内","湿度の高い屋外の物置"],"a":0,"e":"直射日光、高温、多湿は電子部品やバッテリーの劣化を早めます。温度と湿度が安定した場所に保管します。","id":294},{"ch":4,"sec":"4.5 整備・保管","q":"日常点検の実施者について、正しいものを1つ選びなさい。","c":["飛行させる者が、飛行前に自ら実施する","製造事業者のみが実施できる","年1回、整備事業者が実施する"],"a":0,"e":"日常点検は飛行させる者が飛行前に実施するもので、その結果は飛行日誌の日常点検記録に記載します。","id":295},{"ch":4,"sec":"4.5 整備・保管","q":"点検整備記録に記載する内容として、正しいものを1つ選びなさい。","c":["実施した点検・整備の内容、実施日、実施者等","飛行した経路の座標","撮影した映像の一覧"],"a":0,"e":"点検整備記録には、実施した点検・修理・改造・整備の内容、実施日、実施場所、実施者などを記載します。","id":296},{"ch":4,"sec":"4.5 整備・保管","q":"モーターの点検について、正しいものを1つ選びなさい。","c":["異音、異常な発熱、回転の引っかかりの有無を確認する","回転すれば点検は不要である","分解して内部を確認しなければならない"],"a":0,"e":"モーターは手で回したときの引っかかりやガタ、飛行後の異常な発熱、異音の有無を確認します。ベアリングの劣化は振動や出力低下の原因となります。","id":297},{"ch":4,"sec":"4.5 整備・保管","q":"機体の改造を行った場合の取扱いとして、正しいものを1つ選びなさい。","c":["機体認証を受けた機体では、改造により認証の効力に影響が生じ得る","改造は自由であり、届出は不要である","改造しても登録記号の変更は生じない一方、認証への影響もない"],"a":0,"e":"機体認証を受けた機体に設計の変更を伴う改造を行った場合、認証の前提が変わるため、あらためて確認を受ける必要が生じます。","id":298},{"ch":4,"sec":"4.5 整備・保管","q":"飛行後の機体の清掃について、正しいものを1つ選びなさい。","c":["砂塵や水滴、塩分等を除去し、腐食や故障を防ぐ","汚れは性能に影響しないため清掃は不要である","水洗いを行うのが最も確実である"],"a":0,"e":"砂塵はモーターや可動部の摩耗を招き、海岸付近の塩分は腐食の原因となります。飛行後は乾いた布などで清掃し、水分を残さないようにします。","id":299},{"ch":4,"sec":"4.5 整備・保管","q":"バッテリーの廃棄について、正しいものを1つ選びなさい。","c":["自治体や回収事業者の定める方法に従って処分する","一般の可燃ごみとして廃棄する","屋外に放置して自然放電させる"],"a":0,"e":"リチウムポリマーバッテリーは発火の危険があるため、一般ごみとして廃棄してはなりません。自治体や回収事業者の定める方法に従って処分します。","id":300},{"ch":4,"sec":"4.5 整備・保管","q":"寒冷時のバッテリーの取扱いについて、正しいものを1つ選びなさい。","c":["低温では性能が低下するため、適温に保ってから使用する","低温でも性能は変わらない","低温では容量が増加する"],"a":0,"e":"低温環境ではバッテリーの内部抵抗が増して出力と容量が低下し、飛行時間が短くなります。保温して適温にしてから使用します。","id":301},{"ch":5,"sec":"5.1 点検プロセス","q":"飛行前点検で確認すべき項目として、正しいものを1つ選びなさい。","c":["機体の外観、プロペラ、バッテリー、通信、各舵面の動作等","バッテリー残量のみ","GNSSの捕捉数のみ"],"a":0,"e":"飛行前点検では、機体の外観と各部の緩み、プロペラの状態、バッテリーの装着と残量、通信の確立、舵面やジンバルの動作などを一通り確認します。","id":302},{"ch":5,"sec":"5.1 点検プロセス","q":"点検をチェックリストに基づいて行う理由として、最も適切なものを1つ選びなさい。","c":["記憶に頼ると確認漏れが生じやすいため","法令で書式が定められているため","点検時間を短縮できるため"],"a":0,"e":"人の記憶は状況や心理状態に左右され、慣れるほど確認漏れが生じます。チェックリストを用いることで、確認の抜けを防ぎます。","id":303},{"ch":5,"sec":"5.1 点検プロセス","q":"点検中に軽微な不具合を発見した場合の対応として、正しいものを1つ選びなさい。","c":["飛行の可否を判断し、必要なら是正するまで飛行しない","軽微であれば飛行後に対応すればよい","飛行中に様子を見る"],"a":0,"e":"軽微に見える不具合も、飛行中の負荷で重大な故障に発展することがあります。是正されるまで飛行させない判断が求められます。","id":304},{"ch":5,"sec":"5.1 点検プロセス","q":"プロペラの取付け時に確認すべきこととして、正しいものを1つ選びなさい。","c":["回転方向に応じた正しい位置に、確実に固定されているか","色が揃っているか","製造年月日が同じか"],"a":0,"e":"マルチローターのプロペラは回転方向ごとに形状が異なります。取付け位置の誤りは離陸直後の墜落につながるため、位置と締付けを確実に確認します。","id":305},{"ch":5,"sec":"5.1 点検プロセス","q":"送信機（プロポ）の飛行前確認として、正しいものを1つ選びなさい。","c":["バッテリー残量、各スティックとスイッチの動作、機体との通信を確認する","電源が入ることのみ確認する","前回使用時に異常がなければ確認不要である"],"a":0,"e":"送信機側のバッテリー残量、スティックやスイッチの動作、フェールセーフ設定、機体との通信確立を飛行前に確認します。","id":306},{"ch":5,"sec":"5.1 点検プロセス","q":"フェールセーフ機能の設定確認について、正しいものを1つ選びなさい。","c":["通信が途絶した際の動作を、飛行前に確認しておく","初期設定のままで問題ない","通信が途絶することはないため確認不要である"],"a":0,"e":"通信途絶時に自動帰還するのか、その場でホバリングするのか、着陸するのかは設定によって異なります。飛行場所に適した設定であるか事前に確認します。","id":307},{"ch":5,"sec":"5.1 点検プロセス","q":"自動帰還（RTH）の帰還高度の設定について、正しいものを1つ選びなさい。","c":["経路上の最も高い障害物より高く設定する","常に最低高度に設定する","初期値のままでよい"],"a":0,"e":"自動帰還は設定された高度まで上昇してから直線的に戻ります。経路上の建物や樹木、送電線より高い帰還高度を設定しなければ衝突します。","id":308},{"ch":5,"sec":"5.1 点検プロセス","q":"離陸前のGNSS捕捉状況の確認について、正しいものを1つ選びなさい。","c":["十分な衛星数を捕捉し、測位が安定してから離陸する","捕捉していなくても離陸して構わない","捕捉数は機体が自動判断するため確認不要である"],"a":0,"e":"測位が不安定なまま離陸すると、ホームポイントが誤って記録され、自動帰還時に想定外の場所へ向かうおそれがあります。安定を確認してから離陸します。","id":309},{"ch":5,"sec":"5.1 点検プロセス","q":"日常点検と点検整備の違いについて、正しいものを1つ選びなさい。","c":["日常点検は飛行前の確認、点検整備は定期的・専門的な整備である","両者は同じものである","日常点検は年1回行うものである"],"a":0,"e":"日常点検は飛行のたびに飛行させる者が行う確認であり、点検整備は取扱説明書等に定める周期で行う分解を伴う整備を含みます。それぞれ記録が必要です。","id":310},{"ch":5,"sec":"5.1 点検プロセス","q":"機体の使用時間や飛行回数の管理について、正しいものを1つ選びなさい。","c":["消耗部品の交換時期を把握するため、累積を記録する","記録しなくても異常が出てから対応すればよい","製造事業者が管理するものである"],"a":0,"e":"モーター、プロペラ、バッテリーなどの消耗部品には交換の目安があります。累積の使用時間や飛行回数を記録し、目安に達する前に交換します。","id":311},{"ch":5,"sec":"5.1 点検プロセス","q":"飛行前の現地確認として、正しいものを1つ選びなさい。","c":["離着陸地点の地表面の状態や周囲の障害物を確認する","地図上で確認していれば現地確認は不要である","障害物は飛行中に回避すればよい"],"a":0,"e":"砂利や草地は砂塵や転倒の原因となり、送電線や細い枝は上空から視認しにくい障害物です。現地で目視により確認します。","id":312},{"ch":5,"sec":"5.1 点検プロセス","q":"点検記録の保存について、正しいものを1つ選びなさい。","c":["飛行日誌として記録し、定められた期間保存する","点検が終われば破棄してよい","記録は任意である"],"a":0,"e":"特定飛行を行う場合、飛行記録・日常点検記録・点検整備記録からなる飛行日誌を備え、記載および保存が義務付けられています。","id":313},{"ch":5,"sec":"5.1 点検プロセス","q":"複数の機体を運用する場合の点検管理について、正しいものを1つ選びなさい。","c":["機体ごとに個別に記録を管理する","代表機の記録のみ残せばよい","同一機種であればまとめて記録してよい"],"a":0,"e":"同一機種であっても使用状況や消耗の度合いは機体ごとに異なります。登録記号等により機体を特定し、個別に記録を管理します。","id":314},{"ch":5,"sec":"5.1 点検プロセス","q":"ジンバルやカメラの点検について、正しいものを1つ選びなさい。","c":["固定具の解除忘れや可動範囲の異常を確認する","撮影に使わなければ点検不要である","起動すれば問題ない"],"a":0,"e":"輸送用の固定具を外し忘れるとジンバルのモーターに負荷がかかり故障の原因となります。可動範囲や動作の滑らかさを確認します。","id":315},{"ch":5,"sec":"5.1 点検プロセス","q":"点検の際の周囲の安全確保について、正しいものを1つ選びなさい。","c":["モーターを回転させる確認では、プロペラの回転範囲に人を入れない","点検中は安全確保の必要はない","プロペラは低速回転であれば危険はない"],"a":0,"e":"プロペラは低速でも人体を傷つけます。モーターを回す確認を行う際は、回転範囲から人を遠ざけ、機体を確実に固定または保持します。","id":316},{"ch":5,"sec":"5.1 点検プロセス","q":"点検で異常がないことを確認する目的として、最も適切なものを1つ選びなさい。","c":["飛行中の不具合による事故を未然に防ぐため","許可申請の要件を満たすため","機体の資産価値を保つため"],"a":0,"e":"点検の目的は、飛行中に発生し得る不具合を地上にいるうちに発見し、事故を未然に防ぐことにあります。","id":317},{"ch":5,"sec":"5.2 操縦知識","q":"ATTIモード（GNSSを使用しない姿勢制御モード）での飛行について、正しいものを1つ選びなさい。","c":["風により機体が流されるため、操縦者が位置を修正し続ける必要がある","GNSSモードと同様に位置が保持される","高度も保持されない"],"a":0,"e":"ATTIモードでは姿勢は安定しますが水平位置は保持されません。風によって機体が流されるため、操縦者が継続的に位置を修正する必要があります。","id":318},{"ch":5,"sec":"5.2 操縦知識","q":"機首を操縦者側に向けた状態での操作について、正しいものを1つ選びなさい。","c":["左右の操作が操縦者から見て逆になるため、混乱しやすい","機首の向きは操作に影響しない","前後の操作のみが逆になる"],"a":0,"e":"機首がこちらを向いている状態では、機体から見た左右と操縦者から見た左右が反転します。対面飛行は事前の練習が欠かせません。","id":319},{"ch":5,"sec":"5.2 操縦知識","q":"向かい風での飛行時の注意点として、正しいものを1つ選びなさい。","c":["対地速度が低下し、電力消費が増えるため帰投時の残量に注意する","向かい風では電力消費が減る","風向は電力消費に影響しない"],"a":0,"e":"向かい風では同じ対気速度でも対地速度が落ち、目的地までの所要時間と電力消費が増えます。往路が追い風の場合は特に帰路の残量に注意します。","id":320},{"ch":5,"sec":"5.2 操縦知識","q":"急激な操作を避けるべき理由として、正しいものを1つ選びなさい。","c":["姿勢が大きく乱れ、機体の制御を失うおそれがあるため","バッテリーの残量表示が乱れるため","撮影した映像が乱れるため"],"a":0,"e":"急激なスティック操作は大きな姿勢変化と加速度を生み、機体の安定を損ないます。とくに強風下や低高度では制御を失う危険があります。","id":321},{"ch":5,"sec":"5.2 操縦知識","q":"障害物の近くを飛行する場合の操作として、正しいものを1つ選びなさい。","c":["速度を落とし、余裕をもった距離を保つ","障害物検知機能があるため通常の速度でよい","可能な限り接近して飛行する"],"a":0,"e":"障害物検知機能はすべての物体を検知できるとは限らず、細い電線や透明な物体は検知が困難です。速度を落とし、十分な距離を保ちます。","id":322},{"ch":5,"sec":"5.2 操縦知識","q":"離陸直後に注意すべき事項として、正しいものを1つ選びなさい。","c":["低高度で一時静止し、機体の挙動と異音の有無を確認する","速やかに目標高度まで上昇する","離陸後すぐに水平移動を開始する"],"a":0,"e":"離陸直後に低い高度で一時静止し、機体の傾き、振動、異音、各種表示を確認することで、異常があれば直ちに着陸できます。","id":323},{"ch":5,"sec":"5.2 操縦知識","q":"着陸時の操作として、正しいものを1つ選びなさい。","c":["接地直前は降下速度を落とし、確実に接地させる","高度を保ったまま一気に降下させる","接地後すぐにスロットルを上げる"],"a":0,"e":"接地直前に降下速度を落とすことで、地面効果による跳ね返りや転倒を防ぎます。接地後はモーターを速やかに停止させます。","id":324},{"ch":5,"sec":"5.2 操縦知識","q":"モニターを見ながらの飛行について、正しいものを1つ選びなさい。","c":["モニターに集中すると機体の実位置や周囲の状況を見失いやすい","モニターの方が機体の位置を正確に把握できる","モニターを見ていれば目視の要件を満たす"],"a":0,"e":"モニターの画角は限られ、周囲の状況は把握できません。モニターに集中すると機体の実位置や接近する障害物を見落とします。","id":325},{"ch":5,"sec":"5.2 操縦知識","q":"操縦者の立ち位置について、正しいものを1つ選びなさい。","c":["太陽を背にするなど、機体を見失いにくい位置を選ぶ","太陽に向かって立つと機体が見やすい","立ち位置は操縦に影響しない"],"a":0,"e":"逆光では機体の姿勢や向きの判別が著しく困難になります。太陽を背にする、背景に空が広がる位置を選ぶなど、視認性を確保します。","id":326},{"ch":5,"sec":"5.2 操縦知識","q":"飛行中に想定外の挙動が生じた場合の対応として、正しいものを1つ選びなさい。","c":["まず安全な空間を確保し、手動操作で安定させたうえで着陸させる","自動帰還に切り替えれば必ず安全である","操作を続けて回復を試みる"],"a":0,"e":"想定外の挙動が生じた場合は、障害物のない空間へ移動して姿勢を安定させ、速やかに安全な場所へ着陸させます。自動機能が正常に働く保証はありません。","id":327},{"ch":5,"sec":"5.2 操縦知識","q":"操縦練習を行う場所として、適切なものを1つ選びなさい。","c":["十分な広さがあり、第三者が立ち入らない場所","人通りの多い公園","住宅地の道路上"],"a":0,"e":"練習では操作ミスによる意図しない挙動が起こり得ます。十分な広さがあり、第三者が立ち入らない管理された場所を選びます。","id":328},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"CRM（クルー・リソース・マネジメント）の考え方として、正しいものを1つ選びなさい。","c":["利用可能な人・情報・機器を活用し、安全な意思決定を行うこと","操縦者が単独ですべてを判断すること","機器の性能を最大限に引き出すこと"],"a":0,"e":"CRMは、操縦者・補助者・機器・情報など利用可能なあらゆる資源を活用して、安全な運航のための意思決定を行う考え方です。","id":329},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"ヒューマンエラーに対する考え方として、正しいものを1つ選びなさい。","c":["人は誰でも誤るという前提に立ち、仕組みで防ぐ","注意力を高めれば誤りは完全になくせる","誤りは個人の資質の問題である"],"a":0,"e":"注意喚起だけではエラーは防げません。チェックリスト、複数人による確認、手順の標準化など、仕組みによって誤りの発生と影響を抑えます。","id":330},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"操縦者の意思決定を歪める要因として、正しいものを1つ選びなさい。","c":["納期や依頼主からの圧力による、飛行を強行しようとする心理","十分な睡眠と休息","事前の入念な準備"],"a":0,"e":"スケジュールの遅れや依頼主の期待は、安全上の疑義があっても飛行を強行させる圧力となります。こうした心理的要因を自覚することが重要です。","id":331},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"補助者との連携において重要なこととして、正しいものを1つ選びなさい。","c":["気づいたことを遠慮なく伝えられる関係を築く","補助者は操縦者の指示にのみ従うべきである","補助者は運航の判断に口を出すべきでない"],"a":0,"e":"補助者が異常や危険に気づいても伝えられない関係では、安全は確保できません。立場に関わらず率直に発言できる雰囲気づくりが重要です。","id":332},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"注意の配分について、正しいものを1つ選びなさい。","c":["一つの対象に注意が集中すると、他の異常を見落としやすい","人は複数の対象に同等の注意を払える","注意の配分は訓練では改善しない"],"a":0,"e":"一点に注意が集中すると他の情報が処理されなくなります。機体、周囲、表示に注意を巡回させる習慣と、補助者による分担が有効です。","id":333},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"飛行前のブリーフィングの目的として、最も適切なものを1つ選びなさい。","c":["飛行の計画、役割分担、中止条件を関係者間で共有すること","形式的に記録を残すこと","依頼主に進捗を報告すること"],"a":0,"e":"ブリーフィングでは、飛行の目的と経路、各自の役割、連絡手段、中止の判断基準、緊急時の手順を共有し、認識のずれをなくします。","id":334},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"飛行後のデブリーフィングについて、正しいものを1つ選びなさい。","c":["うまくいった点と課題を振り返り、次回に活かす","問題がなければ実施の必要はない","操縦者の反省の場である"],"a":0,"e":"飛行後の振り返りにより、気づきや改善点を関係者で共有します。問題がなかった飛行からも、良好な実践を確認できます。","id":335},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"操縦者が「自分なら大丈夫」と考える心理について、正しいものを1つ選びなさい。","c":["危険を過小評価させる要因となり、事故につながり得る","経験に裏付けられた適切な自信である","安全上、望ましい心構えである"],"a":0,"e":"自分だけは事故を起こさないという思い込みは、危険の過小評価につながります。経験を積むほど生じやすいため、意識的な自己点検が必要です。","id":336},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"視覚による機体の把握について、正しいものを1つ選びなさい。","c":["距離が離れるほど、機体の姿勢や向きの判別が困難になる","距離が離れても姿勢は判別できる","機体が小さいほど遠距離でも見やすい"],"a":0,"e":"距離が離れると機体は点にしか見えず、姿勢や進行方向の判別が困難になります。目視を維持できる距離の限界をあらかじめ把握しておきます。","id":337},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"長時間の連続作業が操縦に与える影響として、正しいものを1つ選びなさい。","c":["疲労により注意力と判断力が低下する","慣れにより精度が向上し続ける","影響はない"],"a":0,"e":"連続した作業は疲労を蓄積させ、注意力と判断力を低下させます。適切な休憩を挟み、必要に応じて交代する体制を組みます。","id":338},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"状況認識（シチュエーショナル・アウェアネス）について、正しいものを1つ選びなさい。","c":["現在の状況を正しく把握し、この先の変化を予測すること","過去の飛行実績を記録すること","機体の仕様を理解すること"],"a":0,"e":"状況認識とは、機体・環境・自分の状態を正しく把握し、この先どうなるかを予測して先手を打つことをいいます。安全な意思決定の前提です。","id":339},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"操縦に影響する身体的要因として、正しいものを1つ選びなさい。","c":["空腹、脱水、寒暑による体温の変化も判断力に影響する","身体的要因は操縦に影響しない","影響するのは睡眠不足だけである"],"a":0,"e":"空腹、脱水、暑熱や寒冷による体温変化も、注意力や判断力を低下させます。飛行前の水分補給や服装の調整も安全対策の一部です。","id":340},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"「この操作で大丈夫か」と迷いが生じた場合の対応として、正しいものを1つ選びなさい。","c":["いったん安全な状態に戻し、落ち着いて判断する","迷いながらもそのまま操作を続ける","迷いは無視して計画通り進める"],"a":0,"e":"迷いが生じた時点で状況認識が不十分になっています。ホバリングや着陸などいったん安全な状態に戻し、落ち着いて判断し直します。","id":341},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"複数の作業を同時に求められた場合の優先順位として、正しいものを1つ選びなさい。","c":["機体の安全な飛行の維持を最優先する","撮影の完遂を最優先する","依頼主への報告を最優先する"],"a":0,"e":"まず機体を安全に飛ばし続けること、次に位置と経路の把握、最後に撮影などの任務という順に優先します。任務を優先して安全を損なってはなりません。","id":342},{"ch":5,"sec":"5.3 パフォーマンス・CRM","q":"操縦者が服用した薬の影響を判断する方法として、最も適切なものを1つ選びなさい。","c":["添付文書の記載を確認し、必要に応じて医師や薬剤師に相談する","自覚症状がなければ問題ない","少量であれば影響しない"],"a":0,"e":"薬の影響は自覚しにくいことがあります。添付文書で眠気等の副作用の有無を確認し、判断に迷う場合は医師や薬剤師に相談します。","id":343},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行計画の通報について、正しいものを1つ選びなさい。","c":["特定飛行を行う場合、あらかじめ飛行計画を通報しなければならない","飛行計画の通報は任意である","飛行後に通報すればよい"],"a":0,"e":"特定飛行を行う場合は、あらかじめ飛行計画を国土交通大臣に通報しなければなりません。通報は飛行情報共有システムを通じて行います。","id":344},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行計画に含めるべき内容として、正しいものを1つ選びなさい。","c":["飛行の日時、経路、高度、目的、機体、操縦者等","撮影する被写体の一覧","機体の購入価格"],"a":0,"e":"飛行計画には、飛行の日時と経路、高度、目的、使用する無人航空機、操縦者、立入管理措置の内容などを記載します。","id":345},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行情報共有システムの目的として、正しいものを1つ選びなさい。","c":["航空機と無人航空機の間で飛行情報を共有し、安全を確保するため","飛行実績を集計して統計を取るため","操縦者の技量を評価するため"],"a":0,"e":"飛行情報共有システムは、有人航空機と無人航空機の飛行情報を関係者間で共有し、相互の接近や衝突を防ぐことを目的としています。","id":346},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行計画を変更した場合の対応として、正しいものを1つ選びなさい。","c":["変更が生じた場合は、その内容を速やかに反映する","一度通報すれば変更の反映は不要である","変更は飛行後にまとめて報告する"],"a":0,"e":"日時や経路、高度などに変更が生じた場合は、その内容を速やかに反映させます。実態と異なる計画は、他の空域利用者の判断を誤らせます。","id":347},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"緊急用務空域について、正しいものを1つ選びなさい。","c":["飛行前に指定の有無を確認し、指定されている場合は原則飛行させない","許可を受けていれば飛行できる","指定は事後に公示される"],"a":0,"e":"災害時の捜索救助等のため緊急用務空域が指定されることがあります。飛行のたびに指定の有無を確認し、指定されている場合は原則として飛行させてはなりません。","id":348},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"補助者を配置する位置として、適切なものを1つ選びなさい。","c":["飛行経路と周囲を広く監視でき、操縦者と連絡がとれる位置","操縦者のすぐ隣","機体の真下"],"a":0,"e":"補助者は飛行経路とその周囲を監視できる位置に配置します。操縦者の死角を補い、第三者の接近や航空機の接近を早期に発見する役割を担います。","id":349},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"緊急時の対応手順について、正しいものを1つ選びなさい。","c":["緊急着陸地点をあらかじめ定め、関係者間で共有しておく","緊急時はその場で判断すればよい","緊急着陸地点は不要である"],"a":0,"e":"制御不能やバッテリー異常に備え、経路上に緊急着陸が可能な場所をあらかじめ選定し、関係者で共有しておきます。","id":350},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行中止の判断基準について、正しいものを1つ選びなさい。","c":["風速や視程などの中止条件を、飛行前に数値で定めておく","中止は現場の感覚で判断する","中止基準は定めない方が柔軟に対応できる"],"a":0,"e":"中止条件をあらかじめ数値で定めておくことで、現場での迷いや圧力に左右されず、客観的に判断できます。","id":351},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"運航管理者を置く場合の役割として、正しいものを1つ選びなさい。","c":["飛行計画の策定や体制の管理を行い、安全な運航を支える","操縦者に代わって機体を操作する","事故の責任をすべて負う"],"a":0,"e":"運航管理者は飛行計画の策定、要員や機体の管理、安全に関する情報の整備などを担い、組織として安全な運航を支えます。","id":352},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行の許可・承認を受けた場合の飛行マニュアルの扱いについて、正しいものを1つ選びなさい。","c":["許可・承認の条件として、飛行マニュアルの遵守が求められる","マニュアルは申請時のみ必要である","マニュアルの内容は自由に変更できる"],"a":0,"e":"許可・承認は提出した飛行マニュアルの遵守を前提としています。実際の運航でマニュアルに従わない場合、許可の条件違反となります。","id":353},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行経路の設定について、正しいものを1つ選びなさい。","c":["万一の落下を想定し、人や物件の上空を極力避ける経路とする","最短距離を優先して経路を設定する","経路は飛行しながら決めればよい"],"a":0,"e":"機体は不意に落下する可能性があります。経路の設定では、直下に人や重要な物件が存在しない経路を選び、リスクを低減します。","id":354},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行時間の計画について、正しいものを1つ選びなさい。","c":["バッテリーの性能に余裕を見込み、予備を含めて計画する","カタログ上の飛行時間をそのまま計画に用いる","飛行時間は計画に含めなくてよい"],"a":0,"e":"カタログ値は無風・無積載の条件での値です。風、気温、ペイロードにより飛行時間は短くなるため、余裕を見込み予備バッテリーを準備します。","id":355},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"複数機を同時に飛行させる場合の体制として、正しいものを1つ選びなさい。","c":["機体間の空域や高度を分離し、相互の連絡体制を確保する","同一空域で自由に飛行させてよい","1人の操縦者が複数機を同時に操作するのが効率的である"],"a":0,"e":"複数機を同時に飛行させる場合は、飛行空域や高度を分離し、各操縦者間で常時連絡がとれる体制を確保して衝突を防ぎます。","id":356},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行の許可・承認の申請先として、正しいものを1つ選びなさい。","c":["国土交通大臣","都道府県知事","指定試験機関"],"a":0,"e":"特定飛行のうち許可・承認が必要なものについては、国土交通大臣に申請します。申請はオンラインシステムを通じて行うことができます。","id":357},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行前に確認すべき他機関との調整について、正しいものを1つ選びなさい。","c":["飛行場所によっては、土地管理者や警察、消防等への連絡が必要となる","航空法の手続きさえ済ませれば他の調整は不要である","調整は飛行後に行えばよい"],"a":0,"e":"公園、河川敷、港湾などでは管理者の許可が必要な場合があります。また、人目につく場所では事前に警察等へ連絡しておくと通報による混乱を防げます。","id":358},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行日誌の携行について、正しいものを1つ選びなさい。","c":["特定飛行を行う際は、飛行日誌を携行しなければならない","事務所に保管しておけばよい","携行は推奨されるが義務ではない"],"a":0,"e":"特定飛行を行う場合、飛行日誌を備え、飛行のたびに記載するとともに、当該無人航空機を飛行させる際に携行しなければなりません。","id":359},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行の実施可否に関する最終確認について、正しいものを1つ選びなさい。","c":["出発前と現地到着後の双方で、条件が満たされているか確認する","出発前に確認していれば現地では不要である","現地でのみ確認すればよい"],"a":0,"e":"気象や現地の状況は時間とともに変化します。出発前の計画段階と現地到着後の双方で条件を確認し、いずれかで満たされなければ中止します。","id":360},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"運航体制における教育訓練について、正しいものを1つ選びなさい。","c":["定期的に訓練を行い、技量と知識の維持向上を図る","技能証明を取得すれば訓練は不要である","訓練は新人のみが対象である"],"a":0,"e":"技量は使わなければ低下し、制度も改正されます。定期的な操縦訓練と知識の更新を組織的に行い、能力を維持します。","id":361},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行の記録に残すべき内容として、正しいものを1つ選びなさい。","c":["飛行の日時、離着陸場所、飛行時間、操縦者、不具合とその処置等","撮影した写真の枚数","当日の交通手段"],"a":0,"e":"飛行記録には、飛行年月日、離陸および着陸の場所と時刻、飛行時間、操縦者の氏名、不具合の発生と講じた措置などを記載します。","id":362},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"立入管理措置を講じた飛行について、正しいものを1つ選びなさい。","c":["第三者の立入りを管理する措置を講じた飛行はカテゴリーⅡ飛行に該当する","立入管理措置を講じればすべての手続きが不要となる","立入管理措置は第三者上空の飛行でのみ必要となる"],"a":0,"e":"特定飛行のうち、第三者の立入りを管理する措置を講じたうえで行う飛行はカテゴリーⅡ飛行に該当します。措置を講じない飛行はカテゴリーⅢ飛行となります。","id":363},{"ch":5,"sec":"5.4 飛行計画と運航体制","q":"飛行中に第三者が飛行経路に接近した場合の対応として、正しいものを1つ選びなさい。","c":["直ちに飛行を中断し、安全な場所へ退避または着陸させる","高度を上げて飛行を継続する","補助者に退去を求めながら飛行を続ける"],"a":0,"e":"立入管理区画に第三者が入った場合、直ちに飛行を中断して安全な場所へ退避させるか着陸させます。飛行を続けながらの対応は危険です。","id":364},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"リスクの大きさを評価する際の考え方として、正しいものを1つ選びなさい。","c":["発生の可能性と、発生した場合の影響の大きさの組合せで評価する","発生の可能性のみで評価する","影響の大きさのみで評価する"],"a":0,"e":"リスクは、事象の発生する可能性（頻度）と、発生した場合の影響の重大性の組合せで評価します。両者を掛け合わせて優先順位を決めます。","id":365},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"リスクへの対応の考え方として、正しいものを1つ選びなさい。","c":["リスクを回避、低減、移転、受容のいずれかの方法で扱う","すべてのリスクをゼロにする","許容できるリスクは存在しない"],"a":0,"e":"リスクはゼロにできません。飛行を行わない（回避）、手順や装備で小さくする（低減）、保険で備える（移転）、残存分を受け入れる（受容）という考え方で扱います。","id":366},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"立入管理区画の設定における危険半径の考え方として、正しいものを1つ選びなさい。","c":["飛行高度と同じ数値、または30メートルのいずれか長い方を加える","常に30メートルを加える","常に飛行高度と同じ数値を加える"],"a":0,"e":"立入管理区画は、飛行領域に危険半径を加えた範囲とします。危険半径は、飛行高度と同じ数値または30メートルのいずれか長い方とされています。","id":367},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"飛行前のリスク評価を行うタイミングとして、正しいものを1つ選びなさい。","c":["飛行計画の策定段階で行い、現地の状況に応じて見直す","飛行後に行う","事故が起きてから行う"],"a":0,"e":"リスク評価は計画段階で行い、想定される危険と対策を検討します。現地の状況が想定と異なる場合は、その場で再評価します。","id":368},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"ハザードとリスクの関係として、正しいものを1つ選びなさい。","c":["ハザードは危険の源であり、リスクはそれが害をもたらす可能性の大きさである","両者は同じ意味である","リスクが顕在化したものがハザードである"],"a":0,"e":"ハザードは危険を生じさせる源（強風、送電線、人混みなど）であり、リスクはそのハザードが実際に害をもたらす可能性と影響の大きさを指します。","id":369},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"複数のリスク低減策を組み合わせる理由として、最も適切なものを1つ選びなさい。","c":["一つの対策が機能しなくても、他の対策で被害を防ぐため","対策が多いほど申請が通りやすいため","対策の数が安全性の指標となるため"],"a":0,"e":"単一の対策は必ず破られることがあります。複数の独立した対策を重ねることで、一つが機能しなくても事故に至らない構造をつくります。","id":370},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"リスク評価において考慮すべき第三者の存在について、正しいものを1つ選びなさい。","c":["飛行経路の直下だけでなく、機体が流された場合の到達範囲も考慮する","飛行経路の直下のみ考慮すればよい","第三者は立入管理区画の外にいるので考慮不要である"],"a":0,"e":"制御不能となった機体は風に流されます。経路直下だけでなく、風向と高度から想定される到達範囲まで含めて第三者の存在を評価します。","id":371},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"運航のリスクを高める要因の組合せについて、正しいものを1つ選びなさい。","c":["複数の小さな要因が重なることで、重大な事故につながることがある","要因が一つでなければ事故にはならない","小さな要因は無視してよい"],"a":0,"e":"事故は多くの場合、単一の原因ではなく、小さな不備や悪条件が連鎖して発生します。個々は軽微に見えても、重なりを警戒する必要があります。","id":372},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"飛行の中止基準を定めておく意義として、最も適切なものを1つ選びなさい。","c":["判断が状況や心理に左右されるのを防ぐため","法令で義務付けられているため","作業効率を高めるため"],"a":0,"e":"現場では時間や依頼主の期待といった圧力がかかります。あらかじめ客観的な中止基準を定めておくことで、その場の心理に左右されない判断ができます。","id":373},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"バッテリー残量に関するリスク管理として、正しいものを1つ選びなさい。","c":["帰投に必要な残量に、予期せぬ事態に備えた余裕を上乗せする","残量警告が出るまで飛行する","残量は満充電からの経過時間で判断すれば十分である"],"a":0,"e":"向かい風、迂回、捜索など予期せぬ事態で消費が増えます。帰投に必要な残量に余裕を上乗せし、その水準に達したら直ちに帰投を開始します。","id":374},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"想定される緊急事態への備えとして、正しいものを1つ選びなさい。","c":["制御不能、通信途絶、バッテリー異常などの場合の手順を定めておく","緊急事態は想定しても意味がない","緊急事態が起きてから手順を考える"],"a":0,"e":"制御不能、通信途絶、GNSS喪失、バッテリー異常、第三者の侵入といった事態ごとに、とるべき行動をあらかじめ定め、訓練しておきます。","id":375},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"リスク管理における記録の役割として、正しいものを1つ選びなさい。","c":["過去の事例を蓄積し、次の飛行の評価に活用する","記録は監査のためだけに必要である","記録は事故時のみ作成する"],"a":0,"e":"飛行記録やヒヤリハットの蓄積は、どの条件で何が起きやすいかを示す貴重な情報です。次の飛行のリスク評価に活用します。","id":376},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"想定を超える事態に備える姿勢として、正しいものを1つ選びなさい。","c":["すべてを想定できるとは限らないため、余裕をもった計画とする","十分に検討すればすべての事態を想定できる","想定外は不可抗力であり備える必要はない"],"a":0,"e":"どれほど検討してもすべての事態は想定できません。距離、高度、時間、電力のいずれにも余裕を持たせ、想定外に対する耐性を高めます。","id":377},{"ch":6,"sec":"6.1 リスク管理の基礎","q":"物件投下を行う飛行のリスクについて、正しいものを1つ選びなさい。","c":["投下により機体の重量バランスが急変し、姿勢が乱れるおそれがある","投下は機体の挙動に影響しない","投下後は軽くなるため常に安定する"],"a":0,"e":"物件の投下により重量と重心が急に変化し、機体の姿勢が乱れることがあります。投下時の挙動をあらかじめ把握しておく必要があります。","id":378},{"ch":6,"sec":"6.2 気象","q":"風速について、単に「風速」といった場合に指すものを1つ選びなさい。","c":["観測時の前10分間における平均風速","瞬間の最大風速","1時間の平均風速"],"a":0,"e":"単に風速という場合は、観測時の前10分間における平均風速を指します。瞬間風速はある瞬間の値で、平均風速の1.5倍から3倍程度になることがあります。","id":379},{"ch":6,"sec":"6.2 気象","q":"風向の表し方について、正しいものを1つ選びなさい。","c":["360度を16等分し、風が吹いてくる方向で表す","360度を8等分し、風が向かう方向で表す","360度を16等分し、風が向かう方向で表す"],"a":0,"e":"風向は風が吹いてくる方向をいい、360度を16等分して北から時計回りに表します。北の風とは、北から南に向かって吹く風です。","id":380},{"ch":6,"sec":"6.2 気象","q":"高気圧における北半球の風の吹き方として、正しいものを1つ選びなさい。","c":["時計回りに、等圧線と約30度の角度で中心から外へ吹き出す","反時計回りに中心へ吹き込む","等圧線に平行に吹く"],"a":0,"e":"北半球の高気圧では、時計回りに等圧線と約30度の角度をなして中心から外側へ風が吹き出します。低気圧では反時計回りに吹き込みます。","id":381},{"ch":6,"sec":"6.2 気象","q":"ダウンバーストの規模について、正しいものを1つ選びなさい。","c":["数百メートルから10キロメートルにおよぶことがある","常に10メートル程度の範囲に限られる","数キロメートル四方に一定して発生する"],"a":0,"e":"ダウンバーストは積乱雲から吹き下ろす強い下降気流が地表で四方に広がる現象で、その広がりは数百メートルから10キロメートルにおよぶことがあります。","id":382},{"ch":6,"sec":"6.2 気象","q":"竜巻の発生時間の目安として、正しいものを1つ選びなさい。","c":["数分から10分程度のものが多い","数時間にわたって継続する","常に1日以上継続する"],"a":0,"e":"竜巻はダウンバーストより強烈なものがあり、発生時間は数分から10分程度のものが多く、通常の観測網では捉えにくい現象です。","id":383},{"ch":6,"sec":"6.2 気象","q":"催し場所の上空における飛行で、中止すべき風速の基準として正しいものを1つ選びなさい。","c":["風速5メートル毎秒以上","風速10メートル毎秒以上","風速15メートル毎秒以上"],"a":0,"e":"多数の者が集合する催しが行われている場所の上空での飛行では、風速5メートル毎秒以上の場合に飛行を中止することが求められます。","id":384},{"ch":6,"sec":"6.3 機体別のリスク","q":"最大離陸重量25キログラム以上の大型機を運航する際の考え方として、正しいものを1つ選びなさい。","c":["事故発生時の影響が大きいため、より高い習熟と慎重な運航が求められる","小型機と同等の準備で足りる","重量があるため風の影響を受けず、運航は容易である"],"a":0,"e":"大型機は運動エネルギーが大きく、事故発生時の影響が格段に大きくなります。操縦者の運航への習熟と、より慎重なリスク評価が求められます。","id":385},{"ch":6,"sec":"6.3 機体別のリスク","q":"飛行機（固定翼機）に特有のリスクとして、正しいものを1つ選びなさい。","c":["速度が落ちると失速し、高度を失って墜落するおそれがある","空中で停止できるため、緊急時に静止して判断できる","低速でも揚力が維持される"],"a":0,"e":"飛行機は一定以上の速度がなければ揚力を維持できず、失速すると急激に高度を失います。空中で停止できないため、常に前進し続ける必要があります。","id":386},{"ch":6,"sec":"6.3 機体別のリスク","q":"飛行機の着陸時に必要となる配慮として、正しいものを1つ選びなさい。","c":["滑走範囲を見込んだ広さのある場所を選定する","垂直に降下できるため狭い場所でよい","着陸地点は飛行中に決めればよい"],"a":0,"e":"飛行機は滑走して着陸するため、滑走範囲を含めた広さが必要です。離着陸地点は周囲の物件から30メートル以上離せる場所を選定します。","id":387},{"ch":6,"sec":"6.3 機体別のリスク","q":"回転翼航空機（ヘリコプター）のメインローターに関するリスクとして、正しいものを1つ選びなさい。","c":["回転半径が大きく、接触時の被害が大きい","小型のため接触しても危険は小さい","停止状態でも回転し続ける"],"a":0,"e":"ヘリコプターのメインローターは回転半径が大きく、回転面も広くなります。接触時の被害が大きいため、人や物件との距離確保が特に重要です。","id":388},{"ch":6,"sec":"6.3 機体別のリスク","q":"回転翼航空機（マルチローター）のモーター故障に関するリスクとして、正しいものを1つ選びなさい。","c":["ローター数が少ない機体ほど、1基の故障で墜落に至りやすい","ローター数にかかわらず故障の影響は同じである","ローター数が少ないほど冗長性が高い"],"a":0,"e":"4基のマルチローターは1基が停止すると姿勢を維持できず墜落に至ります。6基や8基の機体は、1基が停止しても飛行を継続できる冗長性があります。","id":389},{"ch":6,"sec":"6.3 機体別のリスク","q":"マルチローターの離着陸地点の選定について、正しいものを1つ選びなさい。","c":["周囲の物件から30メートル以上離すことができる場所を選定する","物件に接した場所でも問題ない","高低差のある場所が望ましい"],"a":0,"e":"離着陸地点は、周囲の物件から30メートル以上離すことができる場所を選定します。距離が確保できない場合は、立入管理等の追加の措置を講じます。","id":390},{"ch":6,"sec":"6.3 機体別のリスク","q":"離陸地点と操縦者・補助者との距離について、正しいものを1つ選びなさい。","c":["3メートル以上を保つか、取扱説明書に推奨距離があればそれに従う","距離を保つ必要はない","常に10メートル以上必要である"],"a":0,"e":"離陸地点は操縦者および補助者との距離を3メートル以上保つこととされています。取扱説明書に推奨距離が記載されている場合はそれに従います。","id":391},{"ch":6,"sec":"6.3 機体別のリスク","q":"大型機の離着陸地点と操縦者・補助者との距離の推奨として、正しいものを1つ選びなさい。","c":["20メートル以上離れることが推奨される","3メートル以上あればよい","距離の推奨はない"],"a":0,"e":"大型機では、離着陸地点は操縦者および補助者と20メートル以上離れることが推奨されます。取扱説明書に推奨距離がある場合はそれに従います。","id":392},{"ch":6,"sec":"6.3 機体別のリスク","q":"大型機のペイロード搭載時のリスクとして、正しいものを1つ選びなさい。","c":["重心の変化により操縦特性が変わるため、事前に確認する","ペイロードは操縦特性に影響しない","重量が増すほど安定する"],"a":0,"e":"ペイロードの搭載位置により重心が移動し、操縦特性が変化します。実際の搭載状態での挙動を、安全な場所であらかじめ確認します。","id":393},{"ch":6,"sec":"6.3 機体別のリスク","q":"小型機に特有のリスクとして、正しいものを1つ選びなさい。","c":["軽量であるため風に流されやすく、姿勢を崩しやすい","軽量であるため風の影響を受けにくい","小型機にリスクはない"],"a":0,"e":"小型軽量の機体は慣性が小さく、突風により容易に流され、姿勢を崩します。重量が小さいことは事故時の被害は小さくする一方、安定性では不利です。","id":394},{"ch":6,"sec":"6.3 機体別のリスク","q":"機体の冗長性について、正しいものを1つ選びなさい。","c":["重要な系統を二重化することで、単一の故障で機能を失わないようにする","部品点数を減らすことで信頼性を高めることをいう","冗長性は重量増を招くため不要である"],"a":0,"e":"冗長性とは、バッテリー、通信、測位、制御などの重要な系統を二重化し、一つが故障しても機能を失わないようにする設計上の考え方です。","id":395},{"ch":6,"sec":"6.3 機体別のリスク","q":"機体のプロペラガードについて、正しいものを1つ選びなさい。","c":["接触時の被害を軽減できるが、重量増と飛行時間の短縮を伴う","装着すればあらゆる事故を防げる","飛行性能に影響しない"],"a":0,"e":"プロペラガードは接触時の被害軽減に有効ですが、重量が増し、風の影響も受けやすくなり飛行時間が短くなります。用途に応じて判断します。","id":396},{"ch":6,"sec":"6.3 機体別のリスク","q":"機体認証を受けた機体の使用について、正しいものを1つ選びなさい。","c":["使用の条件として、認証時の使用の条件に従って飛行させる必要がある","認証を受ければどのような条件でも飛行できる","認証は機体の性能のみを証明するもので、使用条件は伴わない"],"a":0,"e":"機体認証には使用の条件が付されることがあります。認証を受けた機体であっても、その条件の範囲内で飛行させなければなりません。","id":397},{"ch":6,"sec":"6.3 機体別のリスク","q":"第二種機体認証の有効期間として、正しいものを1つ選びなさい。","c":["3年","1年","5年"],"a":0,"e":"機体認証の有効期間は、第一種が1年、第二種が3年です。有効期間内であっても、改造等により前提が変われば確認が必要となります。","id":398},{"ch":6,"sec":"6.3 機体別のリスク","q":"機体に搭載する灯火について、正しいものを1つ選びなさい。","c":["夜間飛行では、機体の向きや位置が認識できる灯火を装備する","昼間と同じ状態で飛行できる","灯火は装飾であり機能上の意味はない"],"a":0,"e":"夜間飛行では、機体の姿勢や向きを把握できる灯火の装備が必要です。灯火の色や配置により、機首方向を判別できるようにします。","id":399},{"ch":6,"sec":"6.3 機体別のリスク","q":"機体のバッテリーの経年劣化について、正しいものを1つ選びなさい。","c":["充放電の繰り返しにより容量が低下し、飛行時間が短くなる","適切に使用すれば劣化しない","劣化は外観から必ず判別できる"],"a":0,"e":"リチウムポリマーバッテリーは充放電の繰り返しや保管条件により容量が低下します。外観に現れないこともあるため、充放電回数や内部抵抗で管理します。","id":400},{"ch":6,"sec":"6.3 機体別のリスク","q":"機体の防水性能について、正しいものを1つ選びなさい。","c":["防水性能が明示されていない機体は、降雨中の飛行を避ける","すべての機体は防滴構造である","少量の雨であれば問題ない"],"a":0,"e":"多くの無人航空機は防水構造ではありません。降雨中の飛行は電子部品の短絡やモーターの故障を招くおそれがあるため避けます。","id":401},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"夜間飛行における主要なリスクとして、正しいものを1つ選びなさい。","c":["機体の姿勢や周囲の障害物の把握が困難になる","気温が下がるため機体性能が向上する","風が弱いため常に安全である"],"a":0,"e":"夜間は機体の姿勢・向き・距離感の把握が著しく困難になり、送電線や樹木などの障害物も視認できません。灯火の装備と事前の現地確認が不可欠です。","id":402},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"夜間飛行に備えた準備として、適切なものを1つ選びなさい。","c":["明るいうちに現地の障害物を確認し、飛行経路を把握しておく","夜間に到着してから経路を決める","昼間の飛行と同じ準備でよい"],"a":0,"e":"夜間は障害物が視認できません。明るいうちに現地を下見し、障害物の位置と飛行経路、緊急着陸地点を把握しておきます。","id":403},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"目視外飛行における主要なリスクとして、正しいものを1つ選びなさい。","c":["機体周辺の障害物や第三者の接近を直接確認できない","機体の位置がわからなくなることはない","モニターにより周囲を完全に把握できる"],"a":0,"e":"目視外飛行では機体周辺の状況を直接確認できません。カメラの画角は限られ、側方や後方の障害物、接近する航空機は捉えられません。","id":404},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"目視外飛行を行う際の安全対策として、正しいものを1つ選びなさい。","c":["経路上に補助者を配置する、または障害物のない経路と高度を選定する","自動操縦であれば対策は不要である","高度を上げれば対策は不要である"],"a":0,"e":"目視外飛行では、経路を監視する補助者の配置や、障害物のない経路・高度の選定、機体の位置を常時把握できる装置の使用などの対策が必要です。","id":405},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"人または物件から30メートル未満の距離での飛行におけるリスクとして、正しいものを1つ選びなさい。","c":["制御を失った際に、人や物件に直接被害が及ぶ可能性が高い","距離が近いほど操縦しやすく安全である","30メートル未満でも被害の可能性は変わらない"],"a":0,"e":"距離が近いほど、制御不能や突風による流されが生じた際に回避する余地がありません。接近する必要性を吟味し、可能な限り距離を確保します。","id":406},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"30メートルの距離を測る対象について、正しいものを1つ選びなさい。","c":["無人航空機を飛行させる者およびその関係者以外の人または物件","すべての人および物件","建物のみ"],"a":0,"e":"30メートルの距離は、飛行に関与しない第三者およびその物件との間で確保します。操縦者や補助者など関係者はこの対象に含まれません。","id":407},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"催し場所の上空における飛行のリスクとして、正しいものを1つ選びなさい。","c":["多数の人が集まっており、墜落時の被害が甚大となる","人が多いほど機体が視認されやすく安全である","催し場所では風の影響が小さい"],"a":0,"e":"催し場所の上空は多数の第三者が密集しており、墜落時の被害が甚大です。厳格な立入管理、風速による中止基準、機体の落下傘等の措置が求められます。","id":408},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"催し場所上空の飛行で求められる機体側の措置として、正しいものを1つ選びなさい。","c":["第三者や物件に接触した場合の危害を軽減する構造を備えること","高性能なカメラを搭載すること","予備のバッテリーを搭載すること"],"a":0,"e":"催し場所上空の飛行では、風速5メートル毎秒以上での中止に加え、接触時の危害を軽減する構造を機体に備えることが求められます。","id":409},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"危険物の輸送を行う飛行におけるリスクとして、正しいものを1つ選びなさい。","c":["墜落時に積載物による二次被害が発生するおそれがある","危険物は密閉すればリスクはない","少量であればリスクはない"],"a":0,"e":"危険物を輸送する飛行では、墜落や落下により積載物が漏洩・引火し、火災や中毒などの二次被害を招くおそれがあります。","id":410},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"無人航空機の飛行に必要な燃料やバッテリーの取扱いについて、正しいものを1つ選びなさい。","c":["飛行に必要な燃料やバッテリーは、輸送が禁止される危険物に該当しない","搭載するすべての物品が危険物に該当する","予備バッテリーの搭載は常に危険物輸送となる"],"a":0,"e":"当該無人航空機の飛行のために必要な燃料やバッテリーなどは、輸送が禁止される危険物には該当しません。","id":411},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"物件投下における主要なリスクとして、正しいものを1つ選びなさい。","c":["投下物が予期しない場所に落下し、人や物件に危害を及ぼすおそれがある","投下物は必ず真下に落下する","投下は機体の安定性を高める"],"a":0,"e":"投下物は風や機体の移動により流され、予期しない場所へ落下することがあります。また投下の瞬間に機体の重量バランスが急変します。","id":412},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"投下場所に補助者を配置しない場合の物件投下の高度について、正しいものを1つ選びなさい。","c":["原則として1メートル以内である必要がある","原則として5メートル以内である必要がある","高度の制限はない"],"a":0,"e":"投下場所に補助者を配置しない場合、物件投下を行う際の高度は原則として1メートル以内である必要があります。","id":413},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"水や農薬の散布の扱いについて、正しいものを1つ選びなさい。","c":["液体を散布する行為は物件投下に該当する","液体は物件ではないため投下に該当しない","農薬のみが物件投下に該当する"],"a":0,"e":"無人航空機から液体や個体を投下する行為は、物件投下に該当します。農薬散布や水の散布も対象となり、承認が必要です。","id":414},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"空港等の周辺空域における飛行のリスクとして、正しいものを1つ選びなさい。","c":["離着陸する航空機との衝突により、重大な事故を招くおそれがある","航空機は高高度を飛行するため衝突の危険はない","空港周辺は管制されているため安全である"],"a":0,"e":"空港周辺では航空機が低高度を飛行します。無人航空機との衝突は多数の人命に関わる重大事故を招くため、原則として飛行が禁止されています。","id":415},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"高度150メートル以上の空域を飛行する際のリスクとして、正しいものを1つ選びなさい。","c":["航空機が飛行する空域と重なり、衝突のおそれが生じる","高度が高いほど障害物がなく安全である","風が安定しているため安全である"],"a":0,"e":"高度150メートル以上は航空機が飛行する空域と分離する必要があるため、原則として飛行が禁止されています。捜索救助中の航空機はより低い高度も飛行します。","id":416},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"高度150メートル以上の空域における例外の取扱いとして、正しいものを1つ選びなさい。","c":["構造物から30メートル以内の空域については、例外的な取扱いがある","例外は一切認められない","申請すればすべての空域で飛行できる"],"a":0,"e":"煙突や鉄塔などの構造物の周辺は航空機が接近しないことから、高度150メートル以上であっても当該構造物から30メートル以内の空域については例外的な取扱いがあります。","id":417},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"人口集中地区（DID）上空の飛行におけるリスクとして、正しいものを1つ選びなさい。","c":["人家や第三者が密集しており、墜落時の被害が大きい","建物により風が遮られるため安全である","人口集中地区では電波環境が良好である"],"a":0,"e":"人口集中地区は人家が密集し、第三者が常時存在します。墜落時の被害が大きいうえ、建物によるビル風や電波の反射といったリスクも重なります。","id":418},{"ch":6,"sec":"6.4 飛行方法別のリスク","q":"人口集中地区の判断基準について、正しいものを1つ選びなさい。","c":["5年ごとに実施される国勢調査の結果に基づき設定される","毎年見直される","市区町村が独自に設定する"],"a":0,"e":"人口集中地区（DID）は、5年ごとに実施される国勢調査の結果から一定の基準により設定される地域です。最新の設定を確認して判断します。","id":419},{"ch":3,"sec":"3.3 カテゴリー","q":"カテゴリーⅡ飛行のうち、特にリスクが高いものとして区分される飛行に該当しないものを1つ選びなさい。","c":["最大離陸重量25キログラム以上の無人航空機の飛行","催し場所上空における飛行","人口集中地区における高度30メートルでの飛行"],"a":2,"e":"空港周辺、高度150メートル以上、催し場所上空、危険物輸送、物件投下、最大離陸重量25キログラム以上の飛行は、リスクの高いものとしてカテゴリーⅡAに区分されます。それ以外はカテゴリーⅡBです。","id":420}],"C":[{"cat":"重要数値","f":"無人航空機となる重量の下限","b":"100g以上（本体＋バッテリー）。未満は模型航空機","id":1},{"cat":"重要数値","f":"飛行禁止空域となる高度","b":"地表又は水面から150m以上（海抜高度ではない）","id":2},{"cat":"重要数値","f":"航空交通管制区の下限高度","b":"地表又は水面から200m以上","id":3},{"cat":"重要数値","f":"模型航空機の届出が必要になる高度","b":"250m以上","id":4},{"cat":"重要数値","f":"第三者・第三者の物件との確保距離","b":"30m（未満なら承認が必要）","id":5},{"cat":"重要数値","f":"係留の紐等の長さの上限","b":"30m以下（十分な強度を有するもの）","id":6},{"cat":"重要数値","f":"高層構造物周辺で150m規制から除外される範囲","b":"当該構造物から30m以内","id":7},{"cat":"重要数値","f":"催し場所上空で飛行を中止すべき風速","b":"5m/s以上","id":8},{"cat":"重要数値","f":"カテゴリーⅡAに該当する機体重量","b":"最大離陸重量25kg以上","id":9},{"cat":"重要数値","f":"登録記号の文字高（25kg以上／25kg未満）","b":"25mm以上／3mm以上","id":10},{"cat":"重要数値","f":"リモートIDの発信頻度","b":"1秒間に1回以上","id":11},{"cat":"重要数値","f":"機体登録の有効期間","b":"3年","id":12},{"cat":"重要数値","f":"第一種機体認証の有効期間","b":"1年（第二種は3年）","id":13},{"cat":"重要数値","f":"技能証明の有効期間","b":"一等・二等とも3年","id":14},{"cat":"重要数値","f":"技能証明を申請できる最低年齢","b":"16歳","id":15},{"cat":"重要数値","f":"更新講習の修了時期／更新申請の期間","b":"申請日以前3月以内／有効期間満了日の6月前〜1月前","id":16},{"cat":"重要数値","f":"小型無人機等飛行禁止法のイエロー・ゾーン","b":"対象施設の周囲おおむね1,000m","id":17},{"cat":"重要数値","f":"GNSSの測位に必要な衛星数","b":"4基以上","id":18},{"cat":"重要数値","f":"リチウムポリマーバッテリー1セルの電圧","b":"3.7V","id":19},{"cat":"重要数値","f":"バッテリーの長期保管時の充電量の目安","b":"60%（35℃を超える環境では保管しない）","id":20},{"cat":"重要数値","f":"離着陸地点と操縦者・補助者との推奨距離","b":"マルチローター3m以上／飛行機・ヘリコプター20m以上（周囲の物件からは30m以上）","id":21},{"cat":"重要数値","f":"「風速」の定義","b":"観測時の前10分間における平均風速","id":22},{"cat":"重要数値","f":"気象庁の風力階級","b":"0〜12の13階級（ビューフォート風力階級）","id":23},{"cat":"重要数値","f":"標準大気圧（1気圧）","b":"1013hPa","id":24},{"cat":"重要数値","f":"飛行申請の提出期限","b":"カテゴリーⅡは10開庁日前、カテゴリーⅢは20開庁日前","id":25},{"cat":"重要数値","f":"種類の限定／飛行の方法の限定の数","b":"6種類／3種類","id":26},{"cat":"制度","f":"特定飛行の定義","b":"規制対象の空域（4つ）における飛行、又は規制対象の方法（6つ）による飛行のいずれかに該当する飛行","id":27},{"cat":"制度","f":"飛行禁止空域4つ","b":"①空港等の周辺 ②緊急用務空域 ③150m以上 ④人口集中地区（DID）の上空","id":28},{"cat":"制度","f":"承認が必要な飛行の方法6つ","b":"①夜間 ②目視外 ③30m未満 ④催し場所上空 ⑤危険物輸送 ⑥物件投下","id":29},{"cat":"制度","f":"カテゴリーを分ける決め手","b":"立入管理措置を講じるか（講じる＝Ⅱ／講じない＝Ⅲ／特定飛行でない＝Ⅰ）","id":30},{"cat":"制度","f":"カテゴリーⅡAの6つ","b":"空港周辺／150m以上／催し場所上空／危険物輸送／物件投下／25kg以上","id":31},{"cat":"制度","f":"カテゴリーⅢに必要なもの","b":"一等無人航空機操縦士＋第一種機体認証＋許可・承認","id":32},{"cat":"制度","f":"係留で手続きが不要になる5つ","b":"DID／夜間／目視外／30m未満／物件投下（催し場所上空は不可）","id":33},{"cat":"制度","f":"レベル3.5の3要件","b":"①機上カメラ等による第三者の立入り無しの事前確認 ②目視内飛行の限定解除を受けた技能証明 ③第三者賠償責任保険への加入","id":34},{"cat":"制度","f":"リモートIDが免除される4つ","b":"事前登録期間中に登録した機体／リモートID特定区域上空／30m以内の係留／警察等の秘匿業務","id":35},{"cat":"制度","f":"「事故」の3類型","b":"人の死傷（重傷以上）／物件の損壊（第三者所有物、規模を問わず）／航空機との衝突・接触","id":36},{"cat":"制度","f":"「重大インシデント」の4類型","b":"航空機との衝突・接触のおそれ／重傷に至らない負傷／制御不能／飛行中の発火","id":37},{"cat":"制度","f":"飛行日誌の3つの記録","b":"飛行記録／日常点検記録／点検整備記録","id":38},{"cat":"制度","f":"飛行前の確認5項目","b":"外部点検・作動点検／空域及び周囲の状況／気象情報／燃料・バッテリー残量／リモートID機能の作動状況","id":39},{"cat":"制度","f":"行政処分の点数区分","b":"1〜2口頭注意／3〜5文書警告／6〜8停止3月／9〜11停止6月／12〜14停止1年／15〜取消","id":40},{"cat":"制度","f":"罰則の最上限","b":"事故時に危険防止措置を講じなかったとき＝2年以下の懲役又は100万円以下の罰金","id":41},{"cat":"制度","f":"すべての空港に設定される制限表面","b":"進入表面・水平表面・転移表面","id":42},{"cat":"制度","f":"4大空港＋政令空港に追加できる制限表面","b":"円錐表面・延長進入表面・外側水平表面","id":43},{"cat":"制度","f":"小型無人機等飛行禁止法の例外3つ","b":"施設管理者等の同意／土地所有者等による当該土地上空／国・地方公共団体の業務（いずれも公安委員会等へ通報が必要）","id":44},{"cat":"システム","f":"マルチローターの右移動の原理","b":"右側のローターの回転数を下げ、左側を上げる → 機体が右に傾き推力の合力が右へ働く","id":45},{"cat":"システム","f":"モード1とモード2で入れ替わる舵","b":"スロットルとエレベーターの左右のみ（エルロン・ラダーは共通）","id":46},{"cat":"システム","f":"マルチローターの舵と動き","b":"スロットル＝上昇降下／エレベーター＝前後（ピッチ）／エルロン＝左右（ロール）／ラダー＝機首旋回（ヨー）","id":47},{"cat":"システム","f":"失速とは","b":"迎角が大きすぎて流れが翼表面から剥離し、揚力が減り抗力が増大する現象。急降下を始め舵が効かなくなる","id":48},{"cat":"システム","f":"IMUが検出するもの","b":"3軸のジャイロ＋3方向の加速度センサ等により3次元の角速度と加速度","id":49},{"cat":"システム","f":"電波の回折の性質","b":"周波数が低い（波長が長い）ほど障害物を回り込みやすい。2.4GHzは回折しにくい","id":50},{"cat":"システム","f":"電波の減衰","b":"進行距離の2乗に反比例（距離2倍で電力密度1/4）","id":51},{"cat":"システム","f":"免許不要の無線局","b":"73MHz帯等（微弱）／920MHz帯20mW／2.4GHz帯10mW/MHz","id":52},{"cat":"システム","f":"無人移動体画像伝送システムに必要な資格","b":"無線局免許＋第三級陸上特殊無線技士以上（169MHz/2.4GHz/5.7GHz帯）","id":53},{"cat":"運航","f":"点検プロセス6つ","b":"飛行前の準備／飛行前の点検／飛行中の監視／飛行後の点検／運航終了後の点検／異常事態発生時の点検","id":54},{"cat":"運航","f":"5つのCRMスキル","b":"状況認識／意思決定／ワークロード管理／チームワーク／コミュニケーション","id":55},{"cat":"運航","f":"TEMの連鎖","b":"スレット → エラー → UAS（安全マージン低下）→ 事故","id":56},{"cat":"運航","f":"ボルテックス・リング・ステート","b":"垂直降下時に吹きおろした空気を再び吸い込み、揚力を急激に失う現象。水平移動を合わせて降下すれば予防できる","id":57},{"cat":"運航","f":"緊急時の大原則","b":"離陸地点に戻すことを前提とせず、速やかに近くの安全な無人地帯へ不時着させる","id":58},{"cat":"運航","f":"リスクの計量式","b":"予測される頻度（発生確率）× 結果の重大性（被害の大きさ）","id":59},{"cat":"運航","f":"危険半径","b":"高度と同じ数値または30mのいずれか長い方","id":60},{"cat":"運航","f":"事故発生時の対応順序","b":"①人命最優先（救護・通報）②二次災害防止 ③警察・消防等へ通報 ④国土交通大臣へ報告 ⑤記録の保存","id":61},{"cat":"気象","f":"高気圧・低気圧の風（北半球）","b":"高気圧＝時計回りに吹き出す・下降気流・晴れ／低気圧＝反時計回りに吹き込む・上昇気流・悪天","id":62},{"cat":"気象","f":"寒冷前線の特徴","b":"積乱雲による突風・雷、短時間の強い雨。通過後は西〜北西の風に急変し気温低下","id":63},{"cat":"気象","f":"温暖前線の特徴","b":"層状の厚い雲が広がり弱い雨が絶え間なく降る。気温・湿度は次第に高くなる","id":64},{"cat":"気象","f":"海陸風と山谷風","b":"海陸風＝日中は陸へ・夜間は海へ（入替時は朝凪夕凪）／山谷風＝昼は谷風・夜は山風","id":65},{"cat":"気象","f":"ダウンバースト","b":"積乱雲の強烈な下降流が地表で水平にドーナツ状に広がる。数百m〜10km、数分〜10分。直径4km程度以下がマイクロバースト","id":66},{"cat":"気象","f":"10種雲形の上層雲","b":"巻雲・巻層雲・巻積雲（中層＝高層雲・乱層雲・高積雲）","id":67}],"T":[{"ch":2,"title":"無人航空機操縦者の心得","secs":[{"t":"2.1 操縦者の役割と責任","h":"<p>操縦者は運航・安全管理に責任を負い、<b>飛行開始から終了までの全て</b>について責任を問われる。知識と能力に裏付けられた的確な判断を行い、あらゆる状況で人の安全を第一とする。</p><ul><li>技能証明保有者が複数いるときは、誰が操縦者かを<b>飛行前に明確化</b>する</li><li>補助者を置くなら役割と連絡手段を必ず確認する</li><li>事故は飛行前の準備不足が原因のことが多い。レクリエーションでも業務でも同じ水準の準備を行う</li><li>空域は航空機も使う。<b>交差・接近時は無人航空機側が回避</b>する</li><li>中止・帰還させる勇気を持つ。切り抜けるより事前回避</li></ul><div class='cal'><b>事故時の法的責任は3種類</b><br>刑事責任（業務上過失致死傷等）／民事責任（損害賠償）／行政処分等（取消・効力停止1年・6月・3月・文書警告・口頭注意）</div><div class='cal warn'><b>試験ポイント</b> 効力の停止期間は「1年・6月・3月」の3種類だけ。「2年」「9月」はひっかけ。</div>"},{"t":"2.2 安全な飛行の確保","h":"<ol class='steps'><li><b>飛行計画の作成</b>／機体性能・経験を考慮した無理のない計画。近所や経験のある場所でも必ず作成。緊急着陸地点や安全にホバリング・旋回できる場所も設定。ドローン情報基盤システムへ事前通報（困難なら事後可）</li><li><b>飛行予定地域・周辺施設の調査</b>／日出・日没の時刻／標高・障害物・目標物／離着陸場所の状況／歩行者・自動車の通行、有人航空機の飛行状況</li><li><b>点検・気象情報・地域情報</b>／気になるところは必ず整備してから飛行。最新の気象情報。条例・立入禁止区域・緊急用務空域・飛行自粛要請空域も確認</li><li><b>連絡体制・服装・体調管理</b>／関係機関と常に連絡がとれる体制。動きやすく素肌（頭部含む）の露出が少なく関係者と分かる服装。前日に十分な睡眠</li><li><b>技能証明書等の携帯</b>／特定飛行時は 許可書・承認書／技能証明書／飛行日誌 を携行</li><li><b>飛行中の注意</b>／天候悪化のおそれがあれば飛行途中でもただちに帰還・緊急着陸。周囲の監視が最大の安全対策で、衝突防止装置を過信しない</li><li><b>飛行後</b>／点検・手入れ、機体とバッテリーの適切な保管、飛行日誌を遅滞なく記載</li></ol>"},{"t":"2.3 事故が起きた時の対応","h":"<ol class='steps'><li><b>人命最優先</b>／ケガの有無・程度の確認、救護・通報</li><li><b>二次災害防止</b>／通電中なら電源OFF。回転中のプロペラに不用意に近付かない</li><li><b>通報</b>／警察署・消防署その他必要な機関へ</li><li><b>国へ報告</b>／国土交通大臣へ報告</li><li><b>記録</b>／飛行ログ等を残し原因究明・再発防止</li></ol><div class='cal'><b>保険</b> 無人航空機に強制保険はなく<b>すべて任意保険</b>。ただしカテゴリーⅡ飛行のうち<b>総重量25kg以上</b>の機体、または<b>レベル3.5飛行</b>では十分な補償が可能な第三者賠償責任保険への加入が求められる（第5版で範囲拡大）。</div>"}]},{"ch":3,"title":"無人航空機に関する規則","secs":[{"t":"3.1 定義と登録制度","h":"<div class='cal'><b>無人航空機の3条件</b>（すべて満たすもの）<br>① 飛行機・回転翼航空機・滑空機・飛行船で<b>構造上人が乗れない</b><br>② <b>遠隔操作又は自動操縦</b>で飛行させられる<br>③ 本体＋バッテリーの合計が<b>100g以上</b>（他の着脱付属品は含まない）</div><p>100g未満は<b>模型航空機</b>。紙飛行機・気球・ロケットは無人航空機に該当しない。</p><div class='cal warn'><b>100g未満でも規制はある</b> 小型無人機等飛行禁止法の「小型無人機」は大きさ・重さを問わず対象。緊急用務空域は100g未満の模型航空機も飛行禁止。</div><h4>登録制度</h4><ul><li>登録義務は100g以上／有効期間は<b>3年</b></li><li>登録記号の文字高＝25kg以上は<b>25mm以上</b>、25kg未満は<b>3mm以上</b></li><li>リモートIDの発信頻度は<b>1回/秒以上</b></li><li>目的は①所有者把握 ②原因究明等の措置 ③安全上問題のある機体の登録拒否</li></ul><h4>リモートIDの免除4つ</h4><ul><li>制度施行前（2022/6/19まで）の事前登録期間中に登録した機体</li><li>届け出たリモートID特定区域上空の飛行</li><li>30m以内の十分な強度の紐等で係留して行う飛行</li><li>警察庁・都道府県警察・海上保安庁の秘匿を要する業務のための飛行</li></ul><p>リモートIDは静的情報（製造番号・登録記号）と動的情報（位置・速度・高度・時刻）を発信し、<b>所有者や使用者の情報は含まない</b>。</p>"},{"t":"3.2 特定飛行（空域4・方法6）","h":"<div class='cal'><b>特定飛行</b>＝規制対象の<b>空域（4つ）</b>における飛行、または規制対象の<b>方法（6つ）</b>による飛行の<b>いずれか</b>に該当する飛行</div><h4>飛行禁止空域 4つ</h4><ul><li><b>(A) 空港等の周辺</b>／進入表面・転移表面・水平表面等の上空。新千歳・成田・東京・中部・関西・大阪・福岡・那覇の8空港は進入表面等の下の空域や敷地上空も禁止</li><li><b>(B) 緊急用務空域</b>／国交省がその都度指定しHP・Xで公示。飛行前の確認が義務。他の空域の許可があっても飛行不可。100g未満の模型航空機も対象</li><li><b>(C) 150m以上</b>／<b>海抜高度ではなく</b>直下の地表・水面からの高度差</li><li><b>(D) 人口集中地区（DID）</b>／5年毎の国勢調査から設定。工業専用地域内の区域は対象外（第5版）</li></ul><h4>承認が必要な飛行の方法 6つ</h4><ul><li><b>夜間飛行</b>／日没後から日出まで。昼間＝国立天文台が発表する日の出〜日の入り</li><li><b>目視外飛行</b>／目視＝自分の目で見ること。双眼鏡・モニター（FPV含む）・補助者の監視は含まない。眼鏡・コンタクトは含む</li><li><b>30m未満の飛行</b>／第三者又は第三者の物件との直線距離。関係者や自ら管理する物件は該当しない</li><li><b>催し場所上空</b>／風速5m/s以上なら中止。接触時の危害軽減構造も必要</li><li><b>危険物の輸送</b>／飛行に必要な燃料・電池・パラシュート用火薬は対象外</li><li><b>物件の投下</b>／液体・霧状のものの散布も含む。手渡しや地表に置く行為は投下に含まれない</li></ul><div class='cal'><b>「物件」に当たる／当たらない</b><br>当たる：自動車・鉄道車両・船舶・建設機械／ビル・橋梁・鉄塔・電柱・電線・信号機・街灯 など<br>当たらない：<b>土地や自然物（樹木、雑草等）</b></div>"},{"t":"3.3 カテゴリーとレベル","h":"<div class='cal'><b>カテゴリーを分ける決め手＝立入管理措置を講じるかどうか</b></div><ul><li><b>カテゴリーⅠ</b>／特定飛行に該当しない飛行。手続き不要（レベル1・2）</li><li><b>カテゴリーⅡ</b>／特定飛行＋立入管理措置あり<br><b>ⅡA</b>＝①空港周辺 ②150m以上 ③催し場所上空 ④危険物輸送 ⑤物件投下 ⑥25kg以上 → 技能証明＋機体認証があっても<b>許可・承認が必要</b><br><b>ⅡB</b>＝その他。技能証明＋機体認証があれば手続き不要だが<b>飛行マニュアルの作成・遵守が義務</b>（レベル3・3.5を含む）</li><li><b>カテゴリーⅢ</b>／特定飛行＋立入管理措置なし＝第三者上空。<b>一等＋第一種機体認証＋許可・承認</b>（レベル4）</li></ul><h4>機体認証・技能証明の対応</h4><table><tr><th>飛行</th><th>機体認証</th><th>期間</th><th>技能証明</th><th>期間</th></tr><tr><td>カテゴリーⅢ</td><td>第一種</td><td>1年</td><td>一等</td><td>3年</td></tr><tr><td>カテゴリーⅡ</td><td>第二種</td><td>3年</td><td>二等</td><td>3年</td></tr></table><div class='cal warn'><b>覚え分け</b> 検査は国又は登録検査機関、試験は指定試験機関。有効期間で<b>1年なのは第一種機体認証だけ</b>、あとは全部3年（登録も3年）。</div>"},{"t":"3.4 規制の例外・特例","h":"<ul><li><b>捜索救助の特例</b>／国・地方公共団体またはこれらから依頼を受けた者が事故・災害に際し捜索救助目的で飛行させる場合、空域と方法の規制がすべて適用されない。独自の活動は対象外</li><li><b>150m以上の例外</b>／煙突や鉄塔等の高層構造物から<b>30m以内</b>の空域は飛行禁止空域から除外。ただし第三者の物件から30m以内の飛行に当たるため方法の手続きは必要</li><li><b>係留の例外</b>／30m以下の十分な強度の紐等で係留し立入管理措置を講じれば <b>DID／夜間／目視外／30m未満／物件投下</b> の手続きが不要。<b>えい航は係留ではない</b></li><li><b>農薬散布等の例外（第5版）</b>／一定要件を満たす空中散布は 夜間／目視外／30m未満／危険物輸送／物件投下 の承認が不要</li></ul><h4>第三者と第三者上空</h4><p>直接関与者＝操縦者・操縦する可能性のある者・補助者等。間接関与者＝①飛行目的に関与していると操縦者が判断 ②計画外の挙動時の指示・注意を受けている ③関与するかを自ら決定できる、の<b>3条件すべて</b>。</p><p>屋内や停止中の車両内部など<b>遮蔽物に覆われて保護される状況</b>は第三者上空とみなさない。</p><div class='cal'><b>レベル3.5の3要件</b><br>① 機上カメラと地上モニター等で進行方向の飛行経路直下・周辺に第三者の立入りが無いことを確認できることの事前確認<br>② 目視内飛行の限定解除を受けた技能証明の保有<br>③ 十分な補償が可能な第三者賠償責任保険への加入</div><div class='cal warn'><b>レベル3.5の誤解しやすい点</b> 一時的な道路等の横断に限って移動中の車両等の上空を飛べるだけで、<b>歩行者等の第三者上空は飛べない</b>。また機上カメラは補助者・看板の代替であり、立入管理措置そのものが不要になるわけではない。</div>"},{"t":"3.5 操縦者の義務","h":"<h4>すべての操縦者が守る6つのルール</h4><ol><li><b>アルコール・薬物</b>／濃度にかかわらず体内にアルコールを保有する状態では飛行させない。薬物には<b>医薬品も含む</b></li><li><b>飛行前の確認</b>／(a)外部点検・作動点検 (b)空域及び周囲の状況 (c)気象情報 (d)燃料・バッテリー残量 (e)リモートID機能の作動状況</li><li><b>衝突防止</b>／飛行前に航行中の航空機を確認したら飛行しない。飛行中なら地上に降下させる等</li><li><b>迷惑飛行の禁止</b>／必要がないのに高調音・急降下、人への急接近</li><li><b>整備・改造の義務</b>／登録を受けられない機体とならないよう維持。登録記号の表示も維持</li><li><b>事故等の場合の措置</b>／直ちに飛行を中止し救護・通報等 → 国土交通大臣へ報告</li></ol><div class='cal'><b>事故</b>＝人の死傷（重傷以上）／物件の損壊（第三者所有物、規模・損害額を問わず全て）／航空機との衝突・接触<br><b>重大インシデント</b>＝航空機との衝突・接触のおそれ／重傷に至らない負傷／制御不能／飛行中の発火</div><h4>特定飛行で追加される義務</h4><ul><li><b>飛行計画の通報</b>／ドローン情報基盤システムへ事前通報（困難なら事後可）。通報した計画に従って飛行する</li><li><b>飛行日誌の携行と記載</b>／飛行記録・日常点検記録・点検整備記録。紙でも電子でもよいが速やかに参照・提示できること</li><li><b>使用の条件の遵守</b>／使用条件等指定書で指定された最大離陸重量・飛行可能高度・速度等の範囲内でのみ特定飛行できる</li></ul>"},{"t":"3.6 罰則と行政処分","h":"<table><tr><th>違反行為</th><th>罰則</th></tr><tr><td>事故時に危険防止措置を講じなかった</td><td>2年以下の懲役／100万円以下の罰金</td></tr><tr><td>無登録で飛行させた</td><td>1年以下の懲役／50万円以下の罰金</td></tr><tr><td>アルコール・薬物の影響下で飛行</td><td>1年以下の懲役／30万円以下の罰金</td></tr><tr><td>規制対象の空域・方法に違反、飛行前確認をしない 等</td><td>50万円以下の罰金</td></tr><tr><td>飛行計画を通報せず特定飛行、事故の報告をしない</td><td>30万円以下の罰金</td></tr><tr><td>技能証明不携帯、飛行日誌の不備</td><td>10万円以下の罰金</td></tr></table><div class='cal warn'><b>覚え方</b> 2年＝救護しなかった（人命）／1年＝無登録・アル薬（飛ばす資格）／50万＝飛ばし方／30万＝届出しなかった／10万＝持っていなかった・書かなかった</div><h4>行政処分の点数制</h4><table><tr><th>点数</th><th>処分</th></tr><tr><td>1〜2</td><td>口頭注意</td></tr><tr><td>3〜5</td><td>文書警告</td></tr><tr><td>6〜8</td><td>効力の停止 3月</td></tr><tr><td>9〜11</td><td>効力の停止 6月</td></tr><tr><td>12〜14</td><td>効力の停止 1年</td></tr><tr><td>15〜</td><td>技能証明の取消</td></tr></table><p>15点＝事故時に危険防止措置を講じない／アルコール・薬物／飛行計画の変更指示に従わない。10点＝飛行計画を通報しない特定飛行。1点＝技能証明書不携帯・登録記号の表示なし。</p>"},{"t":"3.7 技能証明制度","h":"<ul><li>申請できる最低年齢は<b>16歳</b></li><li>有効期間は一等・二等とも<b>3年</b></li><li>種類の限定は<b>6種類</b>（マルチローター／ヘリコプター／飛行機 × 重量制限なし／25kg未満）</li><li>飛行の方法の限定は<b>3種類</b>（昼間かつ目視内／昼間／目視内）</li><li>更新講習は<b>申請日以前3月以内</b>に修了し、有効期間満了日の<b>6月前から1月前まで</b>に申請（第5版で見直し）</li></ul><p>流れは <b>学科試験 → 実地試験 → 身体検査 → 交付申請</b>。学科に合格しないと実地へ進めない。登録講習機関で講習を修了し修了審査に合格すると<b>実地試験が免除</b>される。</p><div class='cal'><b>パワードリフト機</b>は回転翼航空機（マルチローター）と飛行機の<b>両方の限定</b>が必要。</div><p>申請できない場合：16歳未満／拒否された日から1年以内・保留中／取り消された日から2年以内・効力停止中。</p>"},{"t":"3.8 航空機の運航ルール","h":"<div class='cal'><b>大原則：航空機が進路権を有する</b>／航空機側から無人航空機を視認して回避することは困難で、無人航空機の方が機動性が高いため、交差・接近時は<b>無人航空機側が回避</b>する。</div><ul><li><b>IFR（計器飛行方式）</b>／管制機関の指示等に常時従う。旅客機は通常IFR</li><li><b>VFR（有視界飛行方式）</b>／IFR以外で操縦者の判断に基づく。小型機や回転翼機に多い。空港周辺ではVFRでも管制の指示に従う</li><li><b>航空交通管制区</b>／地表・水面から<b>200m以上</b>のうち国が指定した空域</li><li><b>航空交通管制圏</b>／離着陸が頻繁な空港等及びその周辺。飛行する全ての航空機が管制と連絡</li></ul><h4>制限表面</h4><p>すべての空港：<b>進入表面・水平表面・転移表面</b>／4大空港＋政令空港に追加できる：<b>円錐表面・延長進入表面・外側水平表面</b></p><div class='cal warn'><b>数字のひっかけ</b> 模型航空機の届出は<b>250m以上</b>、管制区は<b>200m以上</b>、無人航空機の飛行禁止空域は<b>150m以上</b>。</div><p>ドクターヘリ、公的機関の捜索救助機、低空飛行の許可を受けた航空機などは150m以下を飛行していることがある。</p>"},{"t":"3.9 航空法以外の法令","h":"<h4>小型無人機等飛行禁止法</h4><ul><li>対象＝小型無人機（<b>大きさ・重さを問わず</b>、100g未満も含む）＋特定航空用機器</li><li><b>レッド・ゾーン</b>＝対象施設の敷地・区域の上空（1年以下の拘禁刑／50万円以下の罰金）</li><li><b>イエロー・ゾーン</b>＝その周囲<b>おおむね1,000m</b>（6月以下の拘禁刑／50万円以下の罰金）</li><li>対象施設＝国の重要施設等／外国公館等／防衛関係施設／空港／原子力事業所</li><li>例外は3つだけ：(a)施設管理者等の同意 (b)土地所有者等による当該土地上空 (c)国・地方公共団体の業務。いずれも<b>公安委員会等へ通報が必要</b></li></ul><div class='cal warn'>航空法の許可・承認や機体認証・技能証明を持っていても、小型無人機等飛行禁止法の対象区域は飛行できない。</div><h4>電波法</h4><table><tr><th>区分</th><th>免許</th><th>周波数帯／出力</th><th>資格</th></tr><tr><td>免許不要</td><td>不要</td><td>73MHz帯等（微弱）／920MHz帯 20mW／2.4GHz帯 10mW/MHz</td><td>不要</td></tr><tr><td>携帯局（無人移動体画像伝送）</td><td>要</td><td>169MHz帯 10mW／2.4GHz帯 1W／5.7GHz帯 1W</td><td>第三級陸上特殊無線技士以上</td></tr><tr><td>陸上移動局（4G・5G）</td><td>不要（包括免許）</td><td>800MHz〜2GHz帯</td><td>不要</td></tr></table><p>アマチュア無線は金銭上の利益のためではなく個人的興味による自己訓練等のためのもので<b>業務利用不可</b>。携帯電話を機体に搭載する場合は<b>上空用プラン等の手続</b>が必要。</p><p><b>飛行自粛要請空域</b>は法令に基づく規制ではなく、関係省庁の要請に基づき国交省が自粛を要請するもの。</p>"}]},{"ch":4,"title":"無人航空機のシステム","secs":[{"t":"4.1 機体の種類と特徴","h":"<table><tr><th>種類</th><th>得意</th><th>不得意</th></tr><tr><td>マルチローター</td><td>垂直離着陸・ホバリング・前後左右移動・水平回転</td><td>エネルギー消費大、風の影響を受けやすい</td></tr><tr><td>ヘリコプター</td><td>1組のローターで効率よく揚力、垂直離着陸・ホバリング</td><td>スワッシュプレート・テールローターが必要で構造が複雑</td></tr><tr><td>飛行機</td><td>高速・長時間・長距離、推力を失っても滑空できる</td><td>ホバリング・後退・横移動不可、滑走路が必要、失速の危険</td></tr><tr><td>パワードリフト機</td><td>垂直離着陸＋巡航中は前進飛行</td><td>マルチローター＋飛行機の両方の限定が必要</td></tr></table><div class='cal'><b>マルチローターの動きの原理</b><br>上昇：全ローターの回転数を上げる／ホバリング：重量と揚力が釣り合う<br><b>前後左右移動</b>：指示した側のローター回転数を<b>下げ</b>、反対側を<b>上げる</b>→機体が傾き推力の合力が傾いた方向に働く<br><b>水平回転</b>：反トルクのバランスを崩すと始まる</div><table><tr><th>舵</th><th>マルチローター</th><th>飛行機</th></tr><tr><td>スロットル</td><td>上昇・降下</td><td>速度変化</td></tr><tr><td>エレベーター</td><td>ピッチ→前後移動</td><td>ピッチ→上昇・降下</td></tr><tr><td>エルロン</td><td>ロール→左右移動</td><td>ロール→左右旋回</td></tr><tr><td>ラダー</td><td>ヨー→機首の左右旋回</td><td>ヨー→左右旋回</td></tr></table><div class='cal warn'><b>モード1と2</b>で変わるのは<b>スロットルとエレベーターの左右だけ</b>。エルロン・ラダーは共通。</div><h4>夜間飛行に必要な装備</h4><ul><li>機体の姿勢及び方向が正確に視認できる<b>灯火</b>（飛行範囲が照明等で十分照らされている場合を除く）</li><li>離着陸地点・緊急着陸地点・回避すべき障害物を視認できる地上照明</li><li>ビジョンセンサーが夜間非対応だと安全機能が使えない可能性</li></ul>"},{"t":"4.2 飛行原理と飛行性能","h":"<p>飛行機に働く4つの力＝<b>揚力・重力・推力・抗力</b>。4つが釣り合うと定常飛行（釣り合い飛行）。</p><p>機体の3軸＝<b>左右軸まわり＝ピッチ／前後軸まわり＝ロール／上下軸まわり＝ヨー</b>。角度はピッチ角・ロール角（バンク角）・ヨー角、角速度はピッチング・ローリング・ヨーイング。</p><div class='cal'><b>揚力と失速</b><br>流れと垂直方向に働く力＝揚力、流れの方向＝抗力。一般に迎角が増すと揚力・抗力とも増加するが、<b>迎角が大きすぎると流れが翼表面から剥離</b>→揚力が減り抗力が増大＝<b>失速</b>。飛行中に失速すると急降下を始め舵が効かなくなる。</div><h4>反トルクの処理</h4><ul><li><b>マルチローター</b>：偶数個のプロペラを半数ずつCW／CCWに回転させて相殺</li><li><b>ヘリコプター</b>：メインローターの反トルクをテールローターで相殺。可変ピッチ機構でピッチ・ロール、テールローターの推力でヨーを制御</li></ul><h4>ペイロード搭載時の注意</h4><ul><li>最大積載量と飛行性能は飛行高度・大気状態で変わる</li><li>機体重量が変わると安定性・飛行性能・運動性能が変化する</li><li><b>重心位置の変化</b>は飛行特性に大きく影響。ペイロードの有無で重心が著しく変化しないようにする</li></ul>"},{"t":"4.3 機体の構成","h":"<table><tr><th>デバイス</th><th>機能</th></tr><tr><td>GNSS</td><td>人工衛星の電波を受信し地球上での位置・高度を取得</td></tr><tr><td>ジャイロセンサ</td><td><b>回転角速度</b>を測定</td></tr><tr><td>加速度センサ</td><td>直交3軸方向の<b>加速度</b>を測定</td></tr><tr><td>IMU</td><td>3軸ジャイロ＋3方向加速度センサ等で3次元の角速度と加速度を検出</td></tr><tr><td>地磁気センサ</td><td>地磁気で機体の向きを取得</td></tr><tr><td>高度センサ</td><td>気圧センサ（歪みゲージ）／超音波（音波の反射時間）／LiDAR（レーザー光の反射時間）</td></tr><tr><td>メインコントローラー</td><td>センサ情報と送信機の指令から姿勢を制御</td></tr><tr><td>ESC</td><td>モーターの回転数を制御し揚力・推力を変化させる</td></tr></table><h4>バッテリー</h4><table><tr><th>用語</th><th>単位</th><th>求め方</th></tr><tr><td>電圧</td><td>V</td><td>セル当たりの電圧（LiPo＝<b>3.7V</b>）×セル数</td></tr><tr><td>出力</td><td>W</td><td>放電時電圧×電流</td></tr><tr><td>容量</td><td>Ah</td><td>電流×時間</td></tr><tr><td>エネルギー容量</td><td>Wh</td><td>放電時電圧×電流×時間</td></tr></table><ul><li>リチウムポリマーは<b>電解質が可燃物</b>。エネルギー密度・電圧が高く、自己放電が少なくメモリ効果が小さい</li><li>過放電・過充電は急速に劣化させ、ガス発生で膨らむ原因になる</li><li>複数セルは<b>バランスコネクタ</b>を充電器へ接続して充電する</li><li>冬季は放電能力が極端に低下し飛行時間が半減することがある</li></ul>"},{"t":"4.4 電波・磁気・GNSS","h":"<table><tr><th>性質</th><th>内容</th></tr><tr><td>直進</td><td>障害物が無ければ直進する</td></tr><tr><td>反射・屈折</td><td>異なる媒質間で発生。入射角＝反射角</td></tr><tr><td>回折</td><td><b>周波数が低い（波長が長い）ほど</b>障害物を回り込める。2.4GHzは回折しにくく直進性が高い</td></tr><tr><td>干渉</td><td>2つ以上の波が重なり強め合い／弱め合う</td></tr><tr><td>減衰</td><td>進行距離の<b>2乗に反比例</b>（距離2倍で電力密度1/4）。水中では大きく減衰</td></tr></table><p><b>フレネルゾーン</b>：周波数が高い／距離が短いほど半径は小さい。アンテナ高さを確保して地面をゾーン外にする。<br><b>マルチパス</b>：反射・屈折で複数経路を通った電波がわずかに遅れて届き、一時的に操縦不能になる要因。</p><h4>地磁気センサ</h4><p>高圧線・変電所・電波塔・鉄材を多く使用した建物・鉄道・自動車・鉄板などの影響を受ける。<b>磁気キャリブレーション</b>＝飛行前にその場所の地磁気を検出して方位を取得させること。正しく行われないと意図しない方向へ飛行する可能性がある。</p><h4>GNSS</h4><ul><li>GPS（米）＋GLONASS（露）＋Galileo（欧）＋QZSS（日）等の総称</li><li>最低<b>4基以上</b>の衛星からの信号を同時受信して位置を計算</li><li>単独測位は数十m、RTK・DGPSなら数cm〜数m</li><li>一般に<b>水平方向より高度方向の誤差が大きい</b></li><li>精度に影響：衛星の時計の精度／捕捉衛星数／マルチパス／受信環境のノイズ</li></ul>"},{"t":"4.5 整備・点検・保管","h":"<ul><li>長期保管は充電<b>60%</b>を目安。満充電での保管も放電状態での保管もNG</li><li>端子が短絡しないよう注意し、<b>機体コネクタと接続したままにしない</b></li><li>発火しても安全を保てる<b>不燃性のケース</b>に入れて保管する</li><li><b>35℃</b>を超える高温環境で保管しない／衝撃を与えない／水に濡らさない</li><li>膨らんでいる場合は内部に可燃性ガスが発生している可能性があり<b>早めに交換</b></li><li>事業で用いたバッテリーは<b>産業廃棄物</b>として廃棄</li><li>飛行前後に加え、機体ごとに定められた<b>一定の期間・一定の総飛行時間ごと</b>に整備点検を行う</li></ul>"}]},{"ch":5,"title":"操縦者及び運航体制","secs":[{"t":"5.1 運航時の点検プロセス","h":"<div class='cal'><b>6つの点検プロセス</b>（機体メーカーの指示に従って実施）<br>①飛行前の準備 ②飛行前の点検 ③飛行中の監視 ④飛行後の点検 ⑤運航終了後の点検 ⑥異常事態発生時の点検</div><h4>飛行前の準備</h4><ol><li>機体の確認：登録と有効期間／機体認証と使用の条件／整備状況</li><li>操縦者の確認：技能証明の等級・限定・条件・有効期間／操縦能力・飛行経験</li><li>飛行空域及びその周囲：第三者の有無、地上の状況、航空機や他の無人航空機、障害物、禁止空域・緊急用務空域・飛行自粛要請空域</li><li>気象状況：最新の気象情報</li><li>必要な手続き：許可・承認の取得／書類の携帯</li><li>立入管理措置・安全確保措置：飛行マニュアル／立入管理／安全管理者・補助者の配置／緊急時の措置</li><li>飛行計画の策定及び通報</li></ol><h4>飛行前の点検</h4><p>①機器の取付け（ネジの脱落やゆるみ）②発動機・モーターの異音 ③機体の損傷やゆがみ ④燃料・バッテリー残量 ⑤通信系統・推進系統・電源系統・自動制御系統の作動 ⑥<b>登録記号の表示</b> ⑦<b>リモートID機能の作動</b></p><h4>飛行中の監視</h4><p>①機体の異常と計画通りの経路・高度・速度 ②気象の変化 ③航空機及び他の無人航空機の有無、第三者の有無</p>"},{"t":"5.2 操縦知識","h":"<div class='cal warn'><b>ボルテックス・リング・ステート</b><br>垂直降下時に吹きおろした空気が再び吸い込まれ、回転翼の上下で再循環して<b>急激に揚力を失う</b>現象。予防は<b>降下の際に水平方向の移動を合わせて操作する</b>こと。</div><h4>離着陸の要点</h4><ul><li><b>マルチローター</b>／揚力が重力を上回ると離陸。緊急時はGNSSに頼らない手動ホバリング・着陸も要求される</li><li><b>ヘリコプター</b>／水平な場所を選び、滑りやすい場所・砂や乾燥した土は避ける。離陸後は<b>速やかに地面効果外へ</b>。垂直方向の急上昇は避ける</li><li><b>飛行機</b>／離着陸は<b>向かい風が原則</b>。追い風は失速の危険。着陸は目測の誤りによる滑走路逸脱に注意</li></ul><h4>手動操縦と自動操縦</h4><ul><li>手動：細かな操作ができ、センサ機能不全時の危険回避に必須。<b>高い再現性を求められる操縦には不向き</b>。視線と機体の正面方向が異なると意図しない方向へ飛びやすい</li><li>自動：ウェイポイントで位置・向き・高度・速度を設定でき再現性が高い。<b>経路上の障害物は事前に現地確認</b>が必要</li></ul><div class='cal'><b>緊急時の大原則</b> 離陸地点などに戻すことを前提とせず、速やかに近くの<b>安全な無人地帯へ不時着</b>させる。</div>"},{"t":"5.3 パフォーマンスとCRM","h":"<ul><li>操縦者は疲労を感じても飛行を継続してしまう傾向があるため、適切に飛行時間を管理する</li><li>高いストレスは安全な飛行を妨げる</li><li><b>前夜の飲酒でも翌日の操縦時まで影響が残る可能性</b>がある。アルコール検知器の活用も有用</li></ul><h4>補助者の役割</h4><p>飛行準備、飛行経路の安全管理、第三者の立入管理、地上・空域の安全確認、危険予知の警告、緊急着陸地点への誘導、着陸後の機体回収や安全点検の補助。</p><div class='cal'><b>CRM</b>＝全ての利用可能な<b>人的リソース・ハードウェア・情報</b>を活用する概念。操縦技量（テクニカルスキル）だけではヒューマンエラーは無くせない。<br><b>TEM</b>＝CRMの効果を最大限発揮する手法。<b>スレット → エラー → UAS（安全マージンの低下）→ 事故</b> の連鎖を断ち切る。</div><div class='cal warn'><b>5つのCRMスキル（ノンテクニカルスキル）</b><br>状況認識／意思決定／ワークロード管理／チームワーク／コミュニケーション</div>"}]},{"ch":6,"title":"運航上のリスク管理","secs":[{"t":"6.1 リスク管理の基礎","h":"<div class='cal'><b>ハザード</b>＝事故等につながる可能性のある危険要素（潜在含む）<br><b>リスク</b>＝運航の安全に影響を与える事象が発生する可能性<br><b>リスクの計量</b>＝予測される頻度（発生確率）× 結果の重大性（被害の大きさ）</div><p>対策は2方向：①事象の発生確率を低減する（信頼性の高い機材）②事象発生による被害を軽減する（パラシュート）。<b>両方を検討</b>したうえで必要な対策をとる。</p><h4>安全マージン</h4><ul><li>周辺・上方に障害物がない水平な場所を離着陸場所に設定</li><li>緊急時に一時的な着陸が可能なスペースを前もって確保</li><li>飛行領域に<b>危険半径（高度と同じ数値または30mのいずれか長い方）</b>を加えた範囲を無人地帯とする</li></ul><p>逸脱防止は<b>ジオフェンス機能</b>と<b>衝突防止機能</b>。運航体制は、操縦と安全管理の役割を分割するため<b>安全管理者（運航管理者）</b>の配置が望ましい。</p>"},{"t":"6.2 気象の基礎知識","h":"<div class='cal warn'>「目視により常時監視」は目視可能な距離外での飛行を禁止するだけでなく、<b>近距離でも雲中や濃霧等、目視で確認できない気象状態では飛行させてはならない</b>ことを意味する。</div><table><tr><th></th><th>高気圧（北半球）</th><th>低気圧（北半球）</th></tr><tr><td>風</td><td><b>時計回りに中心から外へ吹き出す</b></td><td><b>反時計回りに中心へ吹き込む</b></td></tr><tr><td>気流</td><td>下降気流</td><td>上昇気流</td></tr><tr><td>天気</td><td>一般によい</td><td>一般に悪い</td></tr></table><p>標準大気圧（1気圧）＝<b>1013hPa</b>。等圧線の間隔が狭いほど風は強い。</p><table><tr><th>前線</th><th>特徴</th></tr><tr><td>寒冷前線</td><td>積乱雲により突風・雷、短時間で強い雨。通過後は西〜北西の風に急変し気温低下</td></tr><tr><td>温暖前線</td><td>層状の厚い雲が広がり弱い雨が絶え間なく降る。気温・湿度は次第に上昇</td></tr><tr><td>閉塞前線</td><td>寒冷前線が温暖前線に追いついた前線。閉塞が進むと低気圧の勢力が弱まる</td></tr><tr><td>停滞前線</td><td>気団同士の勢力が変わらず留まる。梅雨前線・秋雨前線</td></tr></table><h4>風の基礎</h4><ul><li>風向は<b>風が吹いてくる方向</b>（北の風＝北から南へ）。360度を16等分</li><li><b>風速＝観測時の前10分間における平均風速</b>。単位はm/s</li><li>風は地面の摩擦を受けるため<b>上空では強く地表に近づくほど弱い</b></li><li>風力階級（ビューフォート）は<b>0〜12の13階級</b></li></ul><h4>局地風・現象</h4><ul><li><b>海陸風</b>：日中は陸へ、夜間は海へ。入替時は朝凪・夕凪</li><li><b>山谷風</b>：昼は谷風（谷を這い上がる）、夜は山風</li><li><b>ダウンバースト</b>：積乱雲の強烈な下降流が地表で水平にドーナツ状に広がる。数百m〜10km、数分〜10分。直径4km程度以下が<b>マイクロバースト</b></li></ul><p><b>10種雲形</b>／上層：巻雲・巻層雲・巻積雲　中層：高層雲・乱層雲・高積雲　低層等：積雲・積乱雲・層積雲・層雲</p>"},{"t":"6.3 機体の種類に応じたリスク","h":"<div class='cal'><b>距離の数字</b><br>操縦者・補助者との距離：飛行機／ヘリコプター＝<b>20m以上</b>、マルチローター＝<b>3m以上</b><br>周囲の物件との距離：いずれも<b>30m以上</b></div><ul><li><b>飛行機</b>／広い離着陸エリアが必要、最小旋回半径が大きい、離着陸は向かい風から。ホバリング不可のため上空待機は旋回飛行。緊急着陸は滑空で行うため広範囲のエリアが必要</li><li><b>ヘリコプター</b>／プロペラガードがない機体が一般的で広い離着陸エリアが必要。メインローター半径以下の高度で地面効果が顕著。垂直上昇は避け、離陸後は速やかに地面効果外へ。<b>オートローテーション</b>機構があれば動力停止でも軟着陸が可能</li><li><b>マルチローター</b>／自動帰還時の高度は障害物を回避できる安全な高さに設定。プロペラガード等がない機体では立入制限や補助者配置を検討</li><li><b>大型機（25kg以上）</b>／慣性力が大きく増速・減速・上昇・降下に要する時間と距離が長い。緊急着陸地点は河川敷や農用地など第三者の進入が少ない場所</li></ul>"},{"t":"6.4 飛行の方法に応じたリスク","h":"<h4>夜間飛行</h4><ul><li>原則として<b>目視外飛行は実施しない</b></li><li>機体の向きを視認できる灯火を装備した機体を使用</li><li>操縦者は事前に第三者の立入りの無い安全な場所で<b>訓練を実施</b></li><li>離着陸地点・回避すべき障害物・緊急着陸予定地点には照明が必要</li></ul><h4>目視外飛行（補助者あり）</h4><ul><li>飛行経路全体を把握できる双眼鏡等を有する補助者の配置を推奨</li><li>自動操縦システム＋機体外の様子を監視できるカメラ等</li><li>地上で位置及び異常の有無を把握できること</li><li><b>フェールセーフ機能</b>：①電波断絶時の自動帰還・位置維持 ②GNSS異常時の位置維持・安全な自動着陸 ③電池の電圧・容量・温度異常時の発煙発火防止＋自動帰還・自動着陸</li></ul><h4>目視外飛行（補助者を配置しない場合）に追加される要件</h4><ul><li>航空機からの視認を容易にする灯火又は認識しやすい塗色</li><li>飛行経路全体の航空機の状況が常に確認できるカメラ等</li><li>第三者に危害を加えないことを製造事業者等が証明した機能</li><li>針路・姿勢・高度・速度・周辺気象を地上で把握できること</li><li>計画上の飛行経路と実際の位置の差を地上で把握できること</li><li>初期故障期間を超えた十分な飛行実績を有する機体</li></ul>"}]}]};
const CH = {2:"操縦者の心得",3:"規則",4:"システム",5:"運航体制",6:"リスク管理"};
const CHFULL = {2:"無人航空機操縦者の心得",3:"無人航空機に関する規則",4:"無人航空機のシステム",5:"操縦者及び運航体制",6:"運航上のリスク管理"};
const MOCK_MIX = {2:3,3:20,4:12,5:7,6:8};
const CATC = {"すべて":"blue","重要数値":"c3","制度":"c4","システム":"c5","運航":"c6","気象":"c2"};
const PASS = 40, MOCK_SEC = 30*60;

/* ---------- store ---------- */

try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(blank(), JSON.parse(r)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function qs(id){ return S.q[id] || (S.q[id] = {s:0,o:0,x:0,b:0,lv:0,due:""}); }
const fmtd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => fmtd(new Date());
function markDay(){ const t=today(); if(S.days[S.days.length-1]!==t){ S.days.push(t); S.days=S.days.slice(-400); save(); } }
function streak(){
  if(!S.days.length) return 0;
  const set=new Set(S.days); let n=0; const d=new Date();
  if(!set.has(fmtd(d))) d.setDate(d.getDate()-1);
  while(set.has(fmtd(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function chStats(ch){
  const list = DATA.Q.filter(q=>q.ch===ch);
  let seen=0, ok=0, tot=0;
  list.forEach(q=>{ const r=S.q[q.id]; if(r&&r.s){ seen++; ok+=r.o; tot+=r.o+r.x; } });
  return {n:list.length, seen, rate: tot? Math.round(ok/tot*100):0};
}
function overall(){
  let seen=0, ok=0, tot=0;
  DATA.Q.forEach(q=>{ const r=S.q[q.id]; if(r&&r.s){ seen++; ok+=r.o; tot+=r.o+r.x; } });
  return {seen, total:DATA.Q.length, rate: tot? Math.round(ok/tot*100):0,
          mastery: Math.round(DATA.Q.filter(q=>{const r=S.q[q.id];return r&&r.o>0&&r.o>=r.x;}).length/DATA.Q.length*100)};
}
const weakIds  = () => DATA.Q.filter(q=>{const r=S.q[q.id];return r&&r.x>0&&r.x>=r.o;}).map(q=>q.id);
const wrongIds = () => DATA.Q.filter(q=>{const r=S.q[q.id];return r&&r.x>0;}).map(q=>q.id);
const bmIds    = () => DATA.Q.filter(q=>{const r=S.q[q.id];return r&&r.b;}).map(q=>q.id);
const freshIds = () => DATA.Q.filter(q=>{const r=S.q[q.id];return !r||!r.s;}).map(q=>q.id);

/* ---------- 復習スケジュール（間隔反復） ----------
   正解するたびに次の出題を 1→3→7→14→30→60日 と伸ばし、誤答したら翌日に戻す */
const SRS = [1,3,7,14,30,60];
const MAXLV = SRS.length - 1;
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return fmtd(d); }
function schedule(r, ok){
  r.lv = ok ? Math.min((r.lv||0)+1, MAXLV) : 0;
  r.due = addDays(SRS[r.lv]);
}
const dueIds  = () => { const t=today(); return DATA.Q.filter(q=>{const r=S.q[q.id];return r&&r.s&&r.due&&r.due<=t;}).map(q=>q.id); };
const dueSoon = n => { const t=today(), lim=addDays(n);
  return DATA.Q.filter(q=>{const r=S.q[q.id];return r&&r.s&&r.due&&r.due>t&&r.due<=lim;}).length; };
const settled = () => DATA.Q.filter(q=>{const r=S.q[q.id];return r&&(r.lv||0)>=3;}).length;

/* ---------- 誤答の理由タグ ---------- */
const REASONS = [["k","知識がなかった","c3"],["m","読み違えた","c4"],["d","2択で迷った","c5"]];
function reasonStats(){
  const miss = {k:0,m:0,d:0};
  DATA.Q.forEach(q=>{ const r=S.q[q.id]; if(r && r.rz && miss[r.rz]!==undefined) miss[r.rz] += (r.nz||1); });
  return {m:miss, total:miss.k+miss.m+miss.d};
}
function topReason(){
  const s = reasonStats();
  if(!s.total) return null;
  let best = "k";
  Object.keys(s.m).forEach(k=>{ if(s.m[k] > s.m[best]) best = k; });
  const label = (REASONS.find(r=>r[0]===best)||["",""])[1];
  return {key:best, label, n:s.m[best], pct:Math.round(s.m[best]/s.total*100)};
}

/* ---------- 時間配分 ---------- */
const TARGET_SEC = Math.round(MOCK_SEC / 50);
function paceStats(){
  const rows = S.mocks.filter(x=>Array.isArray(x.p) && x.p.length);
  if(!rows.length) return null;
  const all = [];
  rows.forEach(x=>x.p.forEach(s=>{ if(s>0 && s<600) all.push(s); }));
  if(!all.length) return null;
  all.sort((a,b)=>a-b);
  const med = all[Math.floor(all.length/2)];
  return {n:all.length, med, over:all.filter(s=>s>=60).length, slow:all.filter(s=>s>=TARGET_SEC*2).length, worst:all[all.length-1]};
}

/* ---------- 弱点の自動出題 ---------- */
function chAccuracy(ch){
  let ok=0, tot=0;
  DATA.Q.filter(q=>q.ch===ch).forEach(q=>{ const r=S.q[q.id]; if(r&&r.s){ ok+=r.o; tot+=r.o+r.x; } });
  return tot ? Math.round(ok/tot*100) : null;
}
function daily20(){
  const t = today();
  const due=[], wrong=[], weakSec=[], fresh=[], rest=[];
  const wsec = new Set(weakSecs().map(o=>o.ch+"\u0001"+o.sec));
  DATA.Q.forEach(q=>{
    const r = S.q[q.id];
    if(r && r.s && r.due && r.due<=t) due.push(q.id);
    else if(r && r.x>0 && r.o < r.x) wrong.push(q.id);
    else if(r && r.s && wsec.has(q.ch+"\u0001"+q.sec)) weakSec.push(q.id);
    else if(!r || !r.s) fresh.push(q.id);
    else rest.push(q.id);
  });
  const pick = [];
  const take = (arr,n)=>{ shuffle(arr).slice(0,n).forEach(id=>{ if(pick.length<20 && pick.indexOf(id)<0) pick.push(id); }); };
  take(due,10); take(wrong,6); take(weakSec,5); take(fresh,5); take(rest,20);
  if(pick.length<20) take(fresh.concat(weakSec,wrong,due),20);
  return pick.slice(0,20);
}

/* ---------- 合格可能性 ---------- */
function readiness(){
  const ms = S.mocks;
  if(ms.length < 2) return null;
  const pct = m => m.n ? m.s/m.n*100 : 0;
  const recent = ms.slice(-5);
  const avg = Math.round(recent.reduce((a,m)=>a+pct(m),0)/recent.length);
  const last3 = ms.slice(-3), prev3 = ms.slice(-6,-3);
  const trend = (prev3.length) ? Math.round(last3.reduce((a,m)=>a+pct(m),0)/last3.length - prev3.reduce((a,m)=>a+pct(m),0)/prev3.length) : 0;
  const recentPass = ms.slice(-3).filter(m=>{ const n=m.n||50; return m.s/Math.max(1,n)*100 >= PASS/50*100; }).length;
  const level = (avg>=90 && trend>=0) ? 2 : (avg>=80) ? 1 : 0;
  return {avg, trend, level, n:recent.length, recentPass};
}

/* 旧バージョンの学習記録に復習予定日を与える（初回だけ走る） */
(function(){
  let dirty = false;
  Object.keys(S.q).forEach(k=>{
    const r = S.q[k];
    if(!r || !r.s || r.due) return;
    const good = (r.o||0) - (r.x||0);
    r.lv  = good >= 3 ? 3 : (good >= 1 ? good : 0);
    r.due = addDays(r.lv);
    dirty = true;
  });
  if(dirty) save();
})();

/* ---------- 節（セクション）単位の集計 ---------- */
function secStats(){
  const m = new Map(), out = [];
  DATA.Q.forEach(q=>{
    const k = q.ch + "\u0001" + q.sec;
    let o = m.get(k);
    if(!o){ o = {ch:q.ch, sec:q.sec, n:0, seen:0, ok:0, tot:0, ids:[], ix:out.length}; m.set(k,o); out.push(o); }
    o.n++; o.ids.push(q.id);
    const r = S.q[q.id];
    if(r && r.s){ o.seen++; o.ok += r.o; o.tot += r.o + r.x; }
  });
  out.forEach(o=>{ o.rate = o.tot ? Math.round(o.ok/o.tot*100) : null; });
  return out;
}
function weakSecs(){
  return secStats().filter(o=>o.seen>=2 && o.rate!==null && o.rate<80)
                   .sort((a,b)=> (a.rate-b.rate) || (b.seen-a.seen));
}
